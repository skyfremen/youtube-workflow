name: Wacky Insights longform MVP

on:
  workflow_dispatch:

concurrency:
  group: youtube-longform-mvp
  cancel-in-progress: false

jobs:
  render-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Shorts automation isolation
        shell: bash
        run: |
          test -d youtube-shorts-bot
          test -d youtube-longform-bot
          if grep -R "youtube-shorts-bot" youtube-longform-bot --exclude=README.md; then
            echo "Longform code must not depend on the Shorts bot."
            exit 1
          fi
          echo "Longform MVP is isolated from youtube-shorts-bot."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: youtube-longform-bot/requirements-tts.txt

      - name: Install free local tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Kokoro local neural TTS
        run: python -m pip install -r youtube-longform-bot/requirements-tts.txt

      - name: Install longform dependencies
        working-directory: youtube-longform-bot
        run: npm install

      - name: Validate 15-second animation plan
        working-directory: youtube-longform-bot
        run: node scripts/validate-plan.mjs content/demo-plan.json

      - name: Generate Kokoro neural narration
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          mkdir -p public output
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('content/demo-plan.json', 'utf8'));
          fs.writeFileSync('output/narration.txt', plan.scenes.map((s) => s.narration).join(' '));
          NODE
          python scripts/generate-kokoro.py \
            --text-file output/narration.txt \
            --output public/narration-kokoro-raw.wav \
            --voice af_heart \
            --speed 1.0
          printf 'kokoro\n' > output/tts-engine.txt
          ffmpeg -y -i public/narration-kokoro-raw.wav -af "apad=pad_dur=15" -t 15 public/narration.wav

      - name: Verify Kokoro narration
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          test -s public/narration-kokoro-raw.wav
          test -s public/narration.wav
          grep -qx 'kokoro' output/tts-engine.txt
          RAW_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/narration-kokoro-raw.wav)"
          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/narration.wav)"
          python3 - <<PY
          raw_duration = float('${RAW_DURATION}')
          final_duration = float('${FINAL_DURATION}')
          assert raw_duration > 1.0, raw_duration
          assert 14.5 <= final_duration <= 15.5, final_duration
          print(f'PASS: Kokoro raw narration {raw_duration:.2f}s; final track {final_duration:.2f}s')
          PY

      - name: Render 15-second 1080p animation MVP 2
        working-directory: youtube-longform-bot
        run: npm run render

      - name: Verify rendered video and audio
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          test -s output/demo.mp4
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          AUDIO="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          python3 - <<PY
          duration = float('${DURATION}')
          width = int('${WIDTH}')
          height = int('${HEIGHT}')
          audio = '${AUDIO}'.strip()
          assert 14.5 <= duration <= 15.5, duration
          assert width == 1920, width
          assert height == 1080, height
          assert audio == 'audio', audio
          print(f'PASS: {duration:.2f}s, {width}x{height}, audio present')
          PY

      - name: Upload MVP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacky-longform-animation-mvp2-${{ github.run_id }}
          path: |
            youtube-longform-bot/output/demo.mp4
            youtube-longform-bot/content/demo-plan.json
            youtube-longform-bot/public/narration.wav
            youtube-longform-bot/public/narration-kokoro-raw.wav
            youtube-longform-bot/output/tts-engine.txt
          retention-days: 3

      - name: Confirm no YouTube publication
        run: echo 'LONGFORM ANIMATION MVP 2 COMPLETE - 15-second render only; no upload or scheduling code executed.'
