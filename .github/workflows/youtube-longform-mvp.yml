name: Wacky Insights longform Phase 5

on:
  workflow_dispatch:

concurrency:
  group: youtube-longform-phase5
  cancel-in-progress: true

jobs:
  storyboard-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Shorts automation isolation
        shell: bash
        run: |
          test -d youtube-shorts-bot
          test -d youtube-longform-bot
          if grep -R "youtube-shorts-bot" youtube-longform-bot --exclude=README.md; then
            echo "Longform code must not depend on the Shorts bot."
            exit 1
          fi
          echo "Phase 5 is isolated from youtube-shorts-bot."

      - name: Restore cached Phase 5 narration
        id: narration-cache
        uses: actions/cache@v4
        with:
          path: |
            youtube-longform-bot/public/narration.wav
            youtube-longform-bot/public/narration-kokoro-raw.wav
          key: ${{ runner.os }}-phase5-audio-${{ hashFiles('youtube-longform-bot/content/scene-plan.json', 'youtube-longform-bot/scripts/generate-kokoro.py', 'youtube-longform-bot/requirements-tts.txt') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore longform Node cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            youtube-longform-bot/node_modules
            ~/.cache/remotion
          key: ${{ runner.os }}-longform-node-${{ hashFiles('youtube-longform-bot/package.json') }}

      - name: Install longform dependencies on cache miss
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: youtube-longform-bot
        run: npm install --no-audit --no-fund

      - name: Ensure FFmpeg tools
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFmpeg already available."
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Validate storyboard and asset registry
        working-directory: youtube-longform-bot
        run: node scripts/validate-storyboard.mjs content/scene-plan.json assets/registry.json

      - uses: actions/setup-python@v5
        if: steps.narration-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: youtube-longform-bot/requirements-tts.txt

      - name: Restore Kokoro model cache
        if: steps.narration-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: ${{ runner.os }}-kokoro-cpu-${{ hashFiles('youtube-longform-bot/requirements-tts.txt') }}

      - name: Install CPU-only Kokoro on narration cache miss
        if: steps.narration-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! command -v espeak-ng >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends espeak-ng
          fi
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r youtube-longform-bot/requirements-tts.txt

      - name: Generate Phase 5 Kokoro narration on cache miss
        if: steps.narration-cache.outputs.cache-hit != 'true'
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          mkdir -p public output
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('content/scene-plan.json', 'utf8'));
          fs.writeFileSync('output/narration.txt', plan.scenes.map((s) => s.narration).join(' '));
          NODE
          python scripts/generate-kokoro.py \
            --text-file output/narration.txt \
            --output public/narration-kokoro-raw.wav \
            --voice af_heart \
            --speed 1.0
          ffmpeg -y -i public/narration-kokoro-raw.wav -af "apad=pad_dur=30" -t 30 public/narration.wav

      - name: Verify narration
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          mkdir -p output
          printf 'kokoro\n' > output/tts-engine.txt
          test -s public/narration-kokoro-raw.wav
          test -s public/narration.wav
          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/narration.wav)"
          python3 - <<PY
          duration = float('${FINAL_DURATION}')
          assert 29.5 <= duration <= 30.5, duration
          print(f'PASS: Phase 5 narration {duration:.2f}s')
          PY

      - name: Render 30-second 720p Phase 5
        working-directory: youtube-longform-bot
        run: npm run render

      - name: Verify Phase 5 video
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          test -s output/demo.mp4
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          AUDIO="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          python3 - <<PY
          duration = float('${DURATION}')
          width = int('${WIDTH}')
          height = int('${HEIGHT}')
          audio = '${AUDIO}'.strip()
          assert 29.5 <= duration <= 30.5, duration
          assert width == 1280, width
          assert height == 720, height
          assert audio == 'audio', audio
          print(f'PASS: {duration:.2f}s, {width}x{height}, audio present')
          PY

      - name: Upload Phase 5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacky-longform-phase5-${{ github.run_id }}
          path: |
            youtube-longform-bot/output/demo.mp4
            youtube-longform-bot/content/scene-plan.json
            youtube-longform-bot/assets/registry.json
            youtube-longform-bot/output/tts-engine.txt
          retention-days: 2

      - name: Confirm no YouTube publication
        if: always()
        run: echo 'PHASE 5 COMPLETE - storyboard + asset registry render test only; no YouTube upload or scheduling code executed.'
