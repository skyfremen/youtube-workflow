name: Wacky Insights longform Phase 6

on:
  workflow_dispatch:

concurrency:
  group: youtube-longform-phase6
  cancel-in-progress: true

jobs:
  narration-first-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Shorts automation isolation
        shell: bash
        run: |
          test -d youtube-shorts-bot
          test -d youtube-longform-bot
          if grep -R "youtube-shorts-bot" youtube-longform-bot --exclude=README.md; then
            echo "Longform code must not depend on the Shorts bot."
            exit 1
          fi
          echo "Phase 6 is isolated from youtube-shorts-bot."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore longform Node and Remotion cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            youtube-longform-bot/node_modules
            ~/.cache/remotion
          key: ${{ runner.os }}-node24-longform-${{ hashFiles('youtube-longform-bot/package.json') }}

      - name: Install longform dependencies on cache miss
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: youtube-longform-bot
        run: npm install --no-audit --no-fund

      - name: Validate Phase 6 source storyboard and assets
        working-directory: youtube-longform-bot
        run: node scripts/validate-phase6.mjs content/phase6-plan.json assets/registry.json

      - name: Restore measured Phase 6 narration
        id: narration-cache
        uses: actions/cache@v4
        with:
          path: |
            youtube-longform-bot/public/narration.wav
            youtube-longform-bot/output/phase6-timing.json
          key: ${{ runner.os }}-phase6-narration-${{ hashFiles('youtube-longform-bot/content/phase6-plan.json', 'youtube-longform-bot/scripts/generate-phase6-narration.py', 'youtube-longform-bot/requirements-tts.txt') }}

      - uses: actions/setup-python@v5
        if: steps.narration-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: youtube-longform-bot/requirements-tts.txt

      - name: Restore Kokoro model cache
        if: steps.narration-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: ${{ runner.os }}-kokoro-cpu-${{ hashFiles('youtube-longform-bot/requirements-tts.txt') }}

      - name: Install CPU-only Kokoro on narration cache miss
        if: steps.narration-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r youtube-longform-bot/requirements-tts.txt

      - name: Generate and measure narration first
        if: steps.narration-cache.outputs.cache-hit != 'true'
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          mkdir -p public output/phase6-segments
          python scripts/generate-phase6-narration.py \
            --plan content/phase6-plan.json \
            --output public/narration.wav \
            --manifest output/phase6-timing.json \
            --segments-dir output/phase6-segments \
            --voice af_heart \
            --speed 1.0 \
            --gap 0.10

      - name: Build runtime storyboard from measured audio
        working-directory: youtube-longform-bot
        run: node scripts/build-phase6-runtime-plan.mjs content/phase6-plan.json output/phase6-timing.json content/runtime-plan.json

      - name: Verify narration-first timing
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          test -s public/narration.wav
          test -s output/phase6-timing.json
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('content/runtime-plan.json', 'utf8'));
          const timing = JSON.parse(fs.readFileSync('output/phase6-timing.json', 'utf8'));
          if (plan.timing_mode !== 'measured_kokoro_scene_audio') throw new Error('Runtime plan is not narration-timed');
          if (Math.abs(plan.duration_seconds - timing.total_duration) > 0.001) throw new Error('Runtime duration does not match narration');
          if (plan.scenes.length !== timing.scenes.length) throw new Error('Scene timing count mismatch');
          for (const scene of plan.scenes) {
            if (!(scene.duration > 0) || !(scene.speech_duration > 0)) throw new Error(`Invalid runtime timing for ${scene.id}`);
            for (const beat of scene.beats || []) {
              if (beat.at < 0 || beat.at >= scene.duration) throw new Error(`Beat outside measured scene timing in ${scene.id}`);
            }
          }
          console.log(`PASS: narration-first runtime ${plan.duration_seconds.toFixed(2)}s across ${plan.scenes.length} scenes`);
          NODE

      - name: Render narration-timed 720p Phase 6
        working-directory: youtube-longform-bot
        run: npm run render

      - name: Verify Phase 6 output exists
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          test -s output/demo.mp4
          BYTES="$(stat -c%s output/demo.mp4)"
          test "$BYTES" -gt 100000
          echo "PASS: Phase 6 MP4 created (${BYTES} bytes)."

      - name: Upload Phase 6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacky-longform-phase6-${{ github.run_id }}
          path: |
            youtube-longform-bot/output/demo.mp4
            youtube-longform-bot/content/phase6-plan.json
            youtube-longform-bot/content/runtime-plan.json
            youtube-longform-bot/output/phase6-timing.json
            youtube-longform-bot/assets/registry.json
          retention-days: 2

      - name: Confirm no YouTube publication
        if: always()
        run: echo 'PHASE 6 COMPLETE - narration-first render test only; no YouTube upload or scheduling code executed.'
