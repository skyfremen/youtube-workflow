name: Wacky Insights longform Asset Quality MVP

on:
  workflow_dispatch:

concurrency:
  group: youtube-longform-asset-mvp
  cancel-in-progress: true

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Shorts automation isolation
        shell: bash
        run: |
          test -d youtube-shorts-bot
          test -d youtube-longform-bot
          if grep -R "youtube-shorts-bot" youtube-longform-bot --exclude=README.md; then
            echo "Longform code must not depend on the Shorts bot."
            exit 1
          fi
          echo "Longform Asset Quality MVP is isolated from youtube-shorts-bot."

      - name: Restore cached Kokoro narration
        id: narration-cache
        uses: actions/cache@v4
        with:
          path: |
            youtube-longform-bot/public/narration.wav
            youtube-longform-bot/public/narration-kokoro-raw.wav
          key: ${{ runner.os }}-longform-audio-${{ hashFiles('youtube-longform-bot/content/demo-plan.json', 'youtube-longform-bot/scripts/generate-kokoro.py', 'youtube-longform-bot/requirements-tts.txt') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore longform Node cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            youtube-longform-bot/node_modules
            ~/.cache/remotion
          key: ${{ runner.os }}-longform-node-${{ hashFiles('youtube-longform-bot/package.json') }}

      - name: Install longform dependencies on cache miss
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: youtube-longform-bot
        run: npm install --no-audit --no-fund

      - name: Ensure FFmpeg tools
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFmpeg already available on runner; skipping apt install."
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Validate 8-second Asset Quality plan
        working-directory: youtube-longform-bot
        run: node scripts/validate-plan.mjs content/demo-plan.json

      - uses: actions/setup-python@v5
        if: steps.narration-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: youtube-longform-bot/requirements-tts.txt

      - name: Restore Kokoro model cache
        if: steps.narration-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: ${{ runner.os }}-kokoro-model-${{ hashFiles('youtube-longform-bot/requirements-tts.txt') }}

      - name: Install Kokoro only when narration is not cached
        if: steps.narration-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! command -v espeak-ng >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends espeak-ng
          fi
          python -m pip install -r youtube-longform-bot/requirements-tts.txt

      - name: Generate Kokoro narration only on cache miss
        if: steps.narration-cache.outputs.cache-hit != 'true'
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          mkdir -p public output
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('content/demo-plan.json', 'utf8'));
          fs.writeFileSync('output/narration.txt', plan.scenes.map((s) => s.narration).join(' '));
          NODE
          python scripts/generate-kokoro.py \
            --text-file output/narration.txt \
            --output public/narration-kokoro-raw.wav \
            --voice af_heart \
            --speed 1.0
          ffmpeg -y -i public/narration-kokoro-raw.wav -af "apad=pad_dur=8" -t 8 public/narration.wav

      - name: Verify narration
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          mkdir -p output
          printf 'kokoro\n' > output/tts-engine.txt
          test -s public/narration-kokoro-raw.wav
          test -s public/narration.wav
          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/narration.wav)"
          python3 - <<PY
          final_duration = float('${FINAL_DURATION}')
          assert 7.5 <= final_duration <= 8.5, final_duration
          print(f'PASS: narration {final_duration:.2f}s; cache hit=${{ steps.narration-cache.outputs.cache-hit }}')
          PY

      - name: Render 8-second 720p Asset Quality MVP
        working-directory: youtube-longform-bot
        run: npm run render

      - name: Verify rendered video and audio
        working-directory: youtube-longform-bot
        shell: bash
        run: |
          test -s output/demo.mp4
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          AUDIO="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1:nokey=1 output/demo.mp4)"
          python3 - <<PY
          duration = float('${DURATION}')
          width = int('${WIDTH}')
          height = int('${HEIGHT}')
          audio = '${AUDIO}'.strip()
          assert 7.5 <= duration <= 8.5, duration
          assert width == 1280, width
          assert height == 720, height
          assert audio == 'audio', audio
          print(f'PASS: {duration:.2f}s, {width}x{height}, audio present')
          PY

      - name: Upload Asset Quality MVP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacky-longform-asset-quality-mvp-${{ github.run_id }}
          path: |
            youtube-longform-bot/output/demo.mp4
            youtube-longform-bot/content/demo-plan.json
            youtube-longform-bot/output/tts-engine.txt
          retention-days: 2

      - name: Confirm no YouTube publication
        run: echo 'ASSET QUALITY MVP COMPLETE - 8-second render only; no YouTube upload or scheduling code executed.'
