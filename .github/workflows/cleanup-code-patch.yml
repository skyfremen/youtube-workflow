name: Cleanup Code Patch

on:
  push:
    branches: ['cleanup/schema-v3-only']
    paths:
      - '.github/workflows/cleanup-code-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/schema-v3-only
          fetch-depth: 0

      - name: Remove proven dead and compatibility code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected cleanup target not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # media_resolver: remove an unused import and a compatibility alias.
          replace(
              'youtube-shorts-bot/media_resolver.py',
              '    crop_fill_geometry,\n',
              '',
          )
          replace(
              'youtube-shorts-bot/media_resolver.py',
              '''\ndef rendition_is_suitable(rendition, target_width=TARGET_WIDTH, target_height=TARGET_HEIGHT):\n    """Backward-compatible name for the shared production-cost suitability gate."""\n    return rendition_is_production_suitable(\n        rendition, target_width=target_width, target_height=target_height\n    )\n\n''',
              '\n',
          )
          replace(
              'youtube-shorts-bot/media_resolver.py',
              '''def generic_fallback(asset):\n    """Legacy fallback is allowed only when the original itself fits the cost cap.\n\n    A generic provider download endpoint can resolve to the original 4K file, so\n    unknown or oversized originals are deliberately not used by production.\n    """''',
              '''def generic_fallback(asset):\n    """Use the provider original only when it already fits the production cost cap.\n\n    A generic provider download endpoint can resolve to a 4K file, so unknown or\n    oversized originals are deliberately not used by production.\n    """''',
          )
          replace(
              'youtube-shorts-bot/tests/test_media_resolver_renditions.py',
              'import media_resolver\n',
              'import media_resolver\nfrom background_policy import crop_fill_geometry, rendition_is_production_suitable\n',
          )
          replace(
              'youtube-shorts-bot/tests/test_media_resolver_renditions.py',
              'media_resolver.rendition_is_suitable(',
              'rendition_is_production_suitable(',
          )
          replace(
              'youtube-shorts-bot/tests/test_media_resolver_renditions.py',
              'media_resolver.crop_fill_geometry(1920, 1080)',
              'crop_fill_geometry(1920, 1080)',
          )

          # render: remove a definition-only helper and old hook-deduplication fallback.
          replace(
              'youtube-shorts-bot/render.py',
              '''\ndef story_body_without_repeated_hook(script, hook):\n    script = str(script).strip()\n    hook = str(hook).strip()\n    if hook and script.startswith(hook):\n        remainder = script[len(hook):].lstrip()\n        if remainder:\n            return remainder\n    return script\n\n\ndef pick_existing(paths):\n    for path in paths:\n        if Path(path).exists():\n            return path\n    return None\n\n''',
              '\n',
          )
          replace(
              'youtube-shorts-bot/render.py',
              '''    story_text = story_body_without_repeated_hook(script, hook)\n    if not story_text:\n        raise SystemExit("story.script must contain story narration after the opening card hook")\n''',
              '''    story_text = str(script).strip()\n    if not story_text:\n        raise SystemExit("story.script must contain story narration")\n''',
          )
          replace(
              'youtube-shorts-bot/tests/test_intro_sequence.py',
              '''from render import (\n    CARD_TRANSITION_SECONDS, START_LEAD_SECONDS, X264_CRF, X264_PRESET, caption_events,\n    story_body_without_repeated_hook,\n)\n\n\nclass IntroSequenceTests(unittest.TestCase):\n    def test_repeated_card_hook_is_not_repeated_in_story(self):\n        hook = "My manager put the rule in writing."\n        script = hook + "\\n\\nThen payroll saw the email and everything changed."\n        self.assertEqual(\n            story_body_without_repeated_hook(script, hook),\n            "Then payroll saw the email and everything changed.",\n        )\n\n    def test_distinct_story_opening_is_preserved(self):\n        hook = "The email changed everything."\n        script = "We were three days from month-end when the meeting started."\n        self.assertEqual(story_body_without_repeated_hook(script, hook), script)\n''',
              '''from render import (\n    CARD_TRANSITION_SECONDS, START_LEAD_SECONDS, X264_CRF, X264_PRESET, caption_events,\n)\n\n\nclass IntroSequenceTests(unittest.TestCase):\n''',
          )

          # Validator now owns the no-repeated-hook invariant.
          replace(
              'youtube-shorts-bot/validate_content.py',
              'LEGACY_NAME = "Wacky " + "Insights"\nLEGACY_HANDLE = "@WACKY" + "INSIGHTS"\nLEGACY_HASHTAG = "#wacky" + "insights"\nLEGACY_BRANDING = (LEGACY_HANDLE, LEGACY_HASHTAG, LEGACY_NAME)',
              'RETIRED_NAME = "Wacky " + "Insights"\nRETIRED_HANDLE = "@WACKY" + "INSIGHTS"\nRETIRED_HASHTAG = "#wacky" + "insights"\nRETIRED_BRANDING = (RETIRED_HANDLE, RETIRED_HASHTAG, RETIRED_NAME)',
          )
          replace(
              'youtube-shorts-bot/validate_content.py',
              'for term in LEGACY_BRANDING',
              'for term in RETIRED_BRANDING',
          )
          replace(
              'youtube-shorts-bot/validate_content.py',
              '''        for key in ("category", "story_type", "hook", "script"):\n            if not _nonempty(story.get(key)):\n                errors.append(f"story.{key} must be non-empty")\n        if story.get("category") not in CATEGORIES:''',
              '''        for key in ("category", "story_type", "hook", "script"):\n            if not _nonempty(story.get(key)):\n                errors.append(f"story.{key} must be non-empty")\n        hook = str(story.get("hook") or "").strip()\n        script = str(story.get("script") or "").strip()\n        if hook and script.startswith(hook):\n            errors.append("story.script must not repeat story.hook at the beginning")\n        if story.get("category") not in CATEGORIES:''',
          )
          replace(
              'youtube-shorts-bot/planner/STORY_RULES.md',
              '`story.script` starts directly after the hook and **must not repeat the hook verbatim**. Legacy immutable requests that already duplicate the hook are handled defensively by the renderer; new requests should not rely on that fallback.',
              '`story.script` starts directly after the hook and **must not repeat the hook verbatim**. The request validator rejects a script that starts by repeating `story.hook`.',
          )

          # Candidate analytics has exactly one normalized input contract.
          replace(
              'youtube-shorts-bot/planning_config.py',
              '''# planning_engine.normalized_performance_score remains backward-compatible with\n# direct normalized metrics used by tests/older callers. New production planning\n# should pass only historical_attribute_fit, produced by analytics_learning.py.\nPERFORMANCE_WEIGHTS = {\n    "historical_attribute_fit": 100,\n    "engaged_view_rate": 25,\n    "average_percentage_viewed": 25,\n    "average_view_duration_relative": 15,\n    "subscribers_per_1000_views": 15,\n    "shares_per_1000_views": 10,\n    "likes_per_1000_views": 5,\n    "comments_per_1000_views": 5,\n}\n''',
              '''# Candidate analytics enters planning only through the normalized historical\n# attribute-fit score produced by analytics_learning.py.\nPERFORMANCE_WEIGHTS = {"historical_attribute_fit": 100}\n''',
          )
          replace(
              'youtube-shorts-bot/planning_config.py',
              '# Fresh-start analytics must mature before it can steer creative selection.',
              '# Analytics must mature before it can steer creative selection.',
          )
          replace(
              'youtube-shorts-bot/planning_engine.py',
              'from __future__ import annotations\n\n',
              '',
          )
          replace(
              'youtube-shorts-bot/planning_engine.py',
              '''def normalized_performance_score(metrics):\n    """Weighted 0-100 score using only metrics that actually exist."""\n    if not isinstance(metrics, dict):\n        return None\n    usable = []\n    for key, weight in PERFORMANCE_WEIGHTS.items():\n        value = metrics.get(key)\n        if value is None:\n            continue\n        usable.append((_bounded(value, key), weight))\n    if not usable:\n        return None\n    denominator = sum(weight for _, weight in usable)\n    return round(sum(value * weight for value, weight in usable) / denominator, 3)\n''',
              '''def normalized_performance_score(metrics):\n    """Return the canonical normalized historical-attribute fit score."""\n    if not isinstance(metrics, dict):\n        return None\n    value = metrics.get("historical_attribute_fit")\n    return None if value is None else round(_bounded(value, "historical_attribute_fit"), 3)\n''',
          )
          replace(
              'youtube-shorts-bot/tests/test_planning_engine.py',
              '''    def test_missing_metrics_are_renormalized_not_fabricated(self):\n        score = normalized_performance_score({"average_percentage_viewed": 80, "likes_per_1000_views": 20})\n        expected = (80 * 25 + 20 * 5) / 30\n        self.assertAlmostEqual(score, expected, places=3)\n        self.assertIsNone(normalized_performance_score({"average_percentage_viewed": None}))\n''',
              '''    def test_only_historical_attribute_fit_enters_candidate_scoring(self):\n        self.assertEqual(\n            normalized_performance_score({"historical_attribute_fit": 82}), 82.0\n        )\n        self.assertIsNone(\n            normalized_performance_score({"average_percentage_viewed": 82})\n        )\n        self.assertIsNone(\n            normalized_performance_score({"historical_attribute_fit": None})\n        )\n''',
          )
          replace(
              'youtube-shorts-bot/tests/test_planning_engine.py',
              'semifinalists[0]["analytics_metrics"] = {"average_percentage_viewed": 82}',
              'semifinalists[0]["analytics_metrics"] = {"historical_attribute_fit": 82}',
          )

          # Analytics dates are Singapore-local, matching the planner and workflow cadence.
          replace(
              'youtube-shorts-bot/analytics_collection.py',
              'from datetime import date, datetime, timedelta, timezone\nfrom pathlib import Path\n',
              'from datetime import datetime, timedelta, timezone\nfrom pathlib import Path\nfrom zoneinfo import ZoneInfo\n',
          )
          replace(
              'youtube-shorts-bot/analytics_collection.py',
              'LATEST_PATH = ANALYTICS / "latest.json"\n',
              'LATEST_PATH = ANALYTICS / "latest.json"\nSINGAPORE_TZ = ZoneInfo("Asia/Singapore")\n\n\ndef singapore_date(now_utc=None):\n    current = now_utc or datetime.now(timezone.utc)\n    if current.tzinfo is None:\n        raise ValueError("now_utc must be timezone-aware")\n    return current.astimezone(SINGAPORE_TZ).date()\n',
          )
          replace(
              'youtube-shorts-bot/analytics_collection.py',
              '(ANALYTICS / f"{date.today().isoformat()}.json").write_text(text, encoding="utf-8")',
              '(ANALYTICS / f"{singapore_date().isoformat()}.json").write_text(text, encoding="utf-8")',
          )
          replace(
              'youtube-shorts-bot/analytics_collection.py',
              '''    oldest_publish_date = min(_instant(receipt["publish_at"]).date() for receipt in receipts.values())\n    start_date = max(date.today() - timedelta(days=90), oldest_publish_date).isoformat()\n    end_date = date.today().isoformat()\n''',
              '''    oldest_publish_date = min(_instant(receipt["publish_at"]).date() for receipt in receipts.values())\n    today = singapore_date()\n    start_date = max(today - timedelta(days=90), oldest_publish_date).isoformat()\n    end_date = today.isoformat()\n''',
          )
          replace(
              'youtube-shorts-bot/analytics_learning.py',
              'from __future__ import annotations\n\n',
              '',
          )

          # Fail fast if any expected replacement produced trailing whitespace errors.
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot
          if git diff --cached --quiet; then
            echo "No cleanup patch changes were needed."
            exit 0
          fi
          git commit -m "cleanup: remove dead compatibility paths"
          git push origin HEAD:cleanup/schema-v3-only
