name: One-time Wacky Dramas Emoji Renderer Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migration-fix-emoji-render.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch emoji rendering and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('youtube-shorts-bot/render.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def render_emoji(')
          end = text.index('\ndef caption_events(', start)
          new = '''def render_emoji(icon, target_size, scale):
              # NotoColorEmoji on Debian is a bitmap font with a native 109px strike.
              # Render at that supported size first, then downscale the bitmap for
              # the configured canvas. Scaling the font size itself makes Pillow
              # reject the strike at 720p and previously caused every emoji to fall
              # back to an identical dot.
              for emoji_font in EMOJI_FONT_CANDIDATES:
                  if not Path(emoji_font).exists():
                      continue
                  try:
                      tile_size = 150
                      tile = Image.new("RGBA", (tile_size, tile_size), (0, 0, 0, 0))
                      draw = ImageDraw.Draw(tile)
                      preferred_size = 109 if "ColorEmoji" in emoji_font else 96
                      fnt = ImageFont.truetype(emoji_font, preferred_size)
                      bb = draw.textbbox((0, 0), icon, font=fnt, embedded_color=True)
                      x = (tile_size - (bb[2] - bb[0])) / 2 - bb[0]
                      y = (tile_size - (bb[3] - bb[1])) / 2 - bb[1]
                      draw.text((x, y), icon, font=fnt, embedded_color=True)
                      bbox = tile.getbbox()
                      if bbox:
                          tile = tile.crop(bbox)
                          return ImageOps.contain(tile, (target_size, target_size), method=Image.Resampling.LANCZOS)
                  except (OSError, ValueError):
                      continue
              raise RuntimeError(f"Unable to render requested card emoji: {icon}")
          '''
          # Dedent the source embedded in YAML while preserving Python function indentation.
          import textwrap
          new = textwrap.dedent(new)
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')

          test = Path('youtube-shorts-bot/tests/test_emoji_render.py')
          test.write_text('''import hashlib\nimport sys\nimport unittest\nfrom pathlib import Path\n\nBASE = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(BASE))\n\nfrom render import render_emoji\n\n\nclass EmojiRenderTests(unittest.TestCase):\n    def test_requested_emojis_render_as_distinct_images(self):\n        icons = ["💼", "⏰", "📧", "😳", "🔥"]\n        images = [render_emoji(icon, 36, 2 / 3) for icon in icons]\n        hashes = {hashlib.sha256(image.tobytes()).hexdigest() for image in images}\n        self.assertEqual(len(hashes), len(icons))\n        for image in images:\n            self.assertIsNotNone(image.getbbox())\n            self.assertGreater(image.getbbox()[2] - image.getbbox()[0], 8)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migration-fix-emoji-render.yml
          git add youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_emoji_render.py
          git commit -m "[skip upload] fix Wacky Dramas emoji rendering"
          git pull --rebase origin main
          git push origin HEAD:main
