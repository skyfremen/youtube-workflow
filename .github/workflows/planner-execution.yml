name: Planner Execution

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/planner-execution/inputs/*.json'

concurrency:
  group: planner-execution-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve exactly one new execution input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | awk '$1 == "A" && $2 ~ /^youtube-shorts-bot\/content\/planner-execution\/inputs\/[^/]+\.json$/ {print $2}')
          if [ "${#paths[@]}" -ne 1 ]; then
            echo "::error::Planner execution commit must add exactly one input envelope"
            exit 1
          fi
          path="${paths[0]}"
          stem="$(basename "${path}" .json)"
          if [[ ! "${stem}" =~ ^pe-[A-Za-z0-9-]{8,96}$ ]]; then
            echo "::error::Invalid planner execution filename"
            exit 1
          fi
          python - "${path}" "${stem}" <<'PY'
          import json, sys
          path, stem = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          if data.get('execution_id') != stem:
              raise SystemExit('execution_id must match filename stem')
          PY
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
          echo "execution_id=${stem}" >> "${GITHUB_OUTPUT}"

      - name: Execute canonical repository operation
        shell: bash
        env:
          INPUT_PATH: ${{ steps.input.outputs.path }}
          EXECUTION_ID: ${{ steps.input.outputs.execution_id }}
        run: |
          set -euo pipefail
          output="youtube-shorts-bot/content/planner-execution/results/${EXECUTION_ID}.json"
          PYTHONPATH=youtube-shorts-bot python youtube-shorts-bot/planning/execution_bridge.py \
            --input "${INPUT_PATH}" \
            --output "${output}"
          test -s "${output}"

      - name: Persist deterministic result
        shell: bash
        env:
          EXECUTION_ID: ${{ steps.input.outputs.execution_id }}
        run: |
          set -euo pipefail
          result="youtube-shorts-bot/content/planner-execution/results/${EXECUTION_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${result}"
          git diff --cached --quiet && { echo "::error::No planner result produced"; exit 1; }
          git commit -m "[skip upload] planner execution ${EXECUTION_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
