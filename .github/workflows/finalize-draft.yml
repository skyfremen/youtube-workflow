name: Finalize Draft

on:
  push:
    branches: [main]
    paths:
      - 'content/drafts/*.json'

permissions:
  contents: write

concurrency:
  group: finalize-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    outputs:
      request_source_sha: ${{ steps.request_commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Identify one immutable draft
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t drafts < <(
            git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" |
            awk '$1 == "A" && $2 ~ /^content\/drafts\/draft-[A-Za-z0-9-]{8,96}\.json$/ {print $2}'
          )
          if [ "${#drafts[@]}" -ne 1 ]; then
            echo "::error::DRAFT_COMMIT_INVALID expected exactly one newly added immutable draft"
            exit 1
          fi
          echo "path=${drafts[0]}" >> "${GITHUB_OUTPUT}"
          echo "id=$(basename "${drafts[0]}" .json)" >> "${GITHUB_OUTPUT}"

      - name: Refresh latest serialized planning state
        shell: bash
        run: |
          set -euo pipefail
          path="${{ steps.draft.outputs.path }}"
          source_blob="$(git rev-parse "${GITHUB_SHA}:${path}")"
          git fetch origin main
          git reset --hard origin/main
          if [[ ! -f "${path}" ]]; then
            echo "::error::DRAFT_MISSING_FROM_MAIN ${path}"
            exit 1
          fi
          current_blob="$(git hash-object "${path}")"
          if [[ "${source_blob}" != "${current_blob}" ]]; then
            echo "::error::DRAFT_IMMUTABILITY_VIOLATION ${path}"
            exit 1
          fi

      - name: Preflight draft JSON
        shell: bash
        run: |
          set -euo pipefail
          python pipeline.py preflight-draft --draft "${{ steps.draft.outputs.path }}"

      - name: Finalize draft and allocate YouTube slots
        id: finalize
        env:
          RUNTIME_AUTH_A: ${{ secrets.YOUTUBE_CLIENT_ID }}
          RUNTIME_AUTH_B: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RUNTIME_AUTH_C: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$(python pipeline.py finalize --draft "${{ steps.draft.outputs.path }}" | tail -1)"
          echo "request_path=${request_path}" >> "${GITHUB_OUTPUT}"

      - name: Commit immutable batch request
        id: request_commit
        shell: bash
        run: |
          set -euo pipefail
          request_path="${{ steps.finalize.outputs.request_path }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${request_path}"
          if git diff --cached --quiet; then
            echo "Request already exists identically."
          else
            git commit -m "[request] finalize immutable production batch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          source_sha="$(git log --diff-filter=A --format=%H -- "${request_path}" | head -1)"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::REQUEST_SOURCE_UNRESOLVED"
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Persist precise draft failure
        if: ${{ failure() && steps.draft.outputs.id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          failure="content/failures/${{ steps.draft.outputs.id }}.json"
          if [ ! -f "${failure}" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${failure}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[failure] record draft validation failure"
          git pull --rebase origin main
          git push origin HEAD:main

  dispatch:
    needs: finalize
    uses: ./.github/workflows/dispatch.yml
    with:
      request_source_sha: ${{ needs.finalize.outputs.request_source_sha }}
    secrets:
      PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
