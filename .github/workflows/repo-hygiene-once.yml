name: Repository Hygiene Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-hygiene-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[maintenance bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch hygiene and documentation drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Private Dry Run: include owner docs, align the Ad-hoc concurrency assertion,
          # and permanently reject retired private render assets.
          replace_once(
              '.github/workflows/dry-run.yml',
              "      - 'README.md'\n      - '.github/workflows/**'",
              "      - 'README.md'\n      - 'docs/private/**'\n      - '.github/workflows/**'",
          )
          old_group = "assert 'group: private-adhoc-${" + "{ inputs.content_id }}' in adhoc"
          new_group = "assert 'group: private-adhoc-production-${" + "{ github.ref }}' in adhoc"
          replace_once('.github/workflows/dry-run.yml', old_group, new_group)
          replace_once(
              '.github/workflows/dry-run.yml',
              "              Path('youtube-shorts-bot/rendering'),\n              Path('youtube-shorts-bot/Dockerfile'),",
              "              Path('youtube-shorts-bot/rendering'),\n              Path('youtube-shorts-bot/assets'),\n              Path('youtube-shorts-bot/Dockerfile'),",
          )

          # README: precommit validation now precedes every immutable planning-pool commit.
          replace_once(
              'README.md',
              '2. Daily planning commits an immutable **36-candidate attempt pool**; Ad-hoc planning commits an immutable **5-candidate** pool. These are planning candidates, not production requests.',
              '2. Before any immutable pool commit, ChatGPT executes the live machine-readable planner contract and the matching pre-commit validator against temporary exact bytes at the inspected HEAD. Daily requires **36/36 PASS** from `planning.daily_precommit`; Ad-hoc requires **5/5 PASS** from `planning.adhoc_precommit`. Only those exact validated bytes may become the immutable pool. These remain planning candidates, not production requests.',
          )
          replace_once(
              'README.md',
              'ChatGPT: 36 complete ranked candidates\n        ↓\nimmutable Daily attempt pool',
              'ChatGPT: 36 complete ranked candidates\n        ↓\ntemporary draft → daily_precommit 36/36 PASS\n        ↓\nexact validated bytes → immutable Daily attempt pool',
          )
          replace_once(
              'README.md',
              'ChatGPT: 5 complete ranked candidates\n        ↓\nimmutable Ad-hoc pool',
              'ChatGPT: 5 complete ranked candidates\n        ↓\ntemporary draft → adhoc_precommit 5/5 PASS\n        ↓\nexact validated bytes → immutable Ad-hoc pool',
          )
          replace_once(
              'README.md',
              'It compiles private Python, runs planning/state/contract/ranked-pool tests, validates the media registry, exercises planning acceptance, verifies private/public contract parity, checks private execution boundaries, and dispatches/verifies the linked public runtime Dry Run.',
              'It compiles private Python, runs planning/state/contract/ranked-pool/precommit tests, validates the media registry, exercises planning acceptance, verifies private/public contract parity, checks private execution boundaries, and dispatches/verifies the linked public runtime Dry Run.',
          )

          # System overview: document the now-mandatory temporary precommit gate while
          # preserving promotion-time first-valid fallback as defense in depth.
          replace_once(
              'youtube-shorts-bot/docs/SYSTEM_OVERVIEW.md',
              'Daily:\n  -> commit one immutable 36-candidate attempt pool',
              'Daily:\n  -> write one temporary exact-byte 36-candidate draft\n  -> execute the live planner contract + daily_precommit (36/36 required)\n  -> commit those exact validated bytes as one immutable 36-candidate attempt pool',
          )
          replace_once(
              'youtube-shorts-bot/docs/SYSTEM_OVERVIEW.md',
              'Ad-hoc:\n  -> commit one immutable 5-candidate pool',
              'Ad-hoc:\n  -> write one temporary exact-byte 5-candidate draft\n  -> execute the live planner contract + adhoc_precommit (5/5 required)\n  -> commit those exact validated bytes as one immutable 5-candidate pool',
          )
          replace_once(
              'youtube-shorts-bot/docs/SYSTEM_OVERVIEW.md',
              'For normal Daily the pool has 36 and target 24. Ad-hoc has 5 and target 1.\n\nA failed candidate is skipped, never repaired. Later candidates retain original rank. If fewer than the target pass, the attempt fails closed.',
              'For normal Daily the pool has 36 and target 24. Ad-hoc has 5 and target 1. Before either pool becomes immutable, ChatGPT must execute the corresponding precommit validator against the exact temporary bytes and current rules HEAD: newly authored Daily pools require 36/36 valid candidates and Ad-hoc pools require 5/5.\n\nPromotion still independently validates every committed candidate as defense in depth. If repository state or time-dependent facts change after precommit, a later-invalid candidate is skipped, never repaired, and later candidates retain original rank. If fewer than the target pass, the attempt fails closed.',
          )
          replace_once(
              'youtube-shorts-bot/docs/SYSTEM_OVERVIEW.md',
              'A failed attempt remains immutable. While no canonical `content/planning/YYYY-MM-DD.json` exists, ChatGPT may author a new corrected/replenished attempt under a new ID.',
              'A failed attempt remains immutable. Mechanical authoring/contract mistakes should be caught by the mandatory precommit gate before an attempt enters history; a committed attempt can still fail if repository state, timing or other independently validated facts change after precommit. While no canonical `content/planning/YYYY-MM-DD.json` exists, ChatGPT may author a new corrected/replenished attempt under a new ID.',
          )
          replace_once(
              'youtube-shorts-bot/docs/SYSTEM_OVERVIEW.md',
              '2. ranked-pool tests prove Daily 36 / Ad-hoc 5 sizes and frozen-rank semantics;',
              '2. precommit/ranked-pool tests prove Daily 36/36 and Ad-hoc 5/5 authoring gates plus frozen-rank promotion semantics;',
          )

          # Recovery docs: GitHub partial reruns now recreate current-attempt START
          # evidence only from a prior exact START plus the immutable dispatch intent.
          replace_once(
              'youtube-shorts-bot/docs/RECOVERY.md',
              'Manual Daily recovery uses `daily-production.yml` `workflow_dispatch` with one or more existing immutable content IDs. The private workflow writes an immutable recovery manifest and sends only its opaque batch ID, exact source SHA and compatibility fingerprint to the public runtime. The batch processes each content ID through the same recovery-first publisher. Per-video failures are isolated so the rest of a valid batch can continue, but an individual failed request never bypasses its durable intent, mapping, upload record, receipt, or frozen treatment rules.\n',
              'Manual Daily recovery uses `daily-production.yml` `workflow_dispatch` with one or more existing immutable content IDs. The private workflow writes an immutable recovery manifest and sends only its opaque batch ID, exact source SHA and compatibility fingerprint to the public runtime. The batch processes each content ID through the same recovery-first publisher. Per-video failures are isolated so the rest of a valid batch can continue, but an individual failed request never bypasses its durable intent, mapping, upload record, receipt, or frozen treatment rules.\n\nGitHub partial reruns increment `GITHUB_RUN_ATTEMPT` and may rerun a failed unit or aggregate job without rerunning the original prepare job. For attempts greater than 1, the runtime progress layer may reconstruct the missing current-attempt `START` record only when it finds exactly one prior START for the same workflow run/batch/source/runtime identity and the immutable prepared dispatch intent still matches the same contract. It then creates a normal append-only START for the current attempt before recording progress. Concurrent matrix workers may race to create that one identical START and must converge idempotently. Attempt 1 still requires the explicit workflow Start step; an old START is never accepted directly as current-attempt evidence.\n',
          )
          replace_once(
              'youtube-shorts-bot/docs/AUTOMATIC_RECOVERY.md',
              'The public runtime also writes append-only progress records at meaningful execution stages. Recovery uses the most recent exact execution/progress timestamp when deciding whether a started run is still healthy. A successful GitHub dispatch API response by itself is therefore not treated as proof that public code actually ran.',
              'The public runtime also writes append-only progress records at meaningful execution stages. Recovery uses the most recent exact execution/progress timestamp when deciding whether a started run is still healthy. A successful GitHub dispatch API response by itself is therefore not treated as proof that public code actually ran. On a GitHub partial rerun (attempt > 1) where prepare was not rerun, the progress layer may create the missing current-attempt START only from exactly one prior matching START plus the still-matching immutable dispatch intent; attempt 1 cannot use this repair path.',
          )

          # Owner map: include the progress module and current rerun semantics.
          replace_once(
              'docs/private/runtime-map.md',
              '| `runtime/transport.py` | Exact-revision private input fetch, allowlisted state transport, completion and diagnostic write-back |',
              '| `runtime/transport.py` | Exact-revision private input fetch, allowlisted state transport, explicit START creation, completion and diagnostic write-back |',
          )
          replace_once(
              'docs/private/runtime-map.md',
              '| `runtime/output/state.py` | Immutable intent/upload recovery state |\n| `runtime/output/verify.py` | Exact remote publication-state verification |',
              '| `runtime/output/state.py` | Immutable intent/upload recovery state |\n| `runtime/output/progress.py` | Append-only liveness evidence and fail-closed current-attempt START reconstruction for GitHub partial reruns |\n| `runtime/output/verify.py` | Exact remote publication-state verification |',
          )
          replace_once(
              'docs/private/runtime-map.md',
              'A manual recovery batch ID hashes the immutable item identities together with `github.run_id`. A new manual trigger therefore gets a new immutable completion namespace, while reruns of the same workflow run retain the same batch ID. Durable per-item upload records remain the duplicate-publication authority.',
              'A manual recovery batch ID hashes the immutable item identities together with `github.run_id`. A new manual trigger therefore gets a new immutable completion namespace, while reruns of the same workflow run retain the same batch ID. GitHub partial reruns get a new run-attempt identity; when prepare is not rerun, `runtime/output/progress.py` may create the missing current-attempt START only from exactly one prior matching START plus the unchanged immutable dispatch intent. Durable per-item upload records remain the duplicate-publication authority.',
          )

          # Verify the private render assets are truly unreferenced before removing them.
          maintenance = Path('.github/workflows/repo-hygiene-once.yml')
          needles = ('channel-avatar.png', 'verified-blue.png', 'assets/ui/comment.png', 'assets/ui/like.png', 'assets/ui/share.png')
          references = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or p == maintenance or 'youtube-shorts-bot/assets' in p.as_posix():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for needle in needles:
                  if needle in text:
                      references.append(f'{p}: {needle}')
          if references:
              raise SystemExit('retired private runtime asset still referenced: ' + '; '.join(references))

          for path in (
              'youtube-shorts-bot/assets/channel-avatar.png',
              'youtube-shorts-bot/assets/ui/comment.png',
              'youtube-shorts-bot/assets/ui/like.png',
              'youtube-shorts-bot/assets/ui/share.png',
              'youtube-shorts-bot/assets/ui/verified-blue.png',
              'youtube-shorts-bot/content/recovery/.gitkeep',
              'youtube-shorts-bot/content/requests/.gitkeep',
              'youtube-shorts-bot/content/results/.gitkeep',
          ):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f'expected cleanup target missing: {path}')
              p.unlink()

          # The one-shot workflow must leave no maintenance surface behind.
          maintenance.unlink()
          PY

          git diff --check
          python -m py_compile $(find youtube-shorts-bot -type f -name '*.py')
          PYTHONPATH=youtube-shorts-bot python -m unittest discover -s youtube-shorts-bot/tests -v

      - name: Commit cleanup atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'skyfremen'
          git config user.email 'skyfremen@me.com'
          git add -A
          git commit -m 'Clean repository drift and retired private assets'
          git pull --rebase origin main
          git diff HEAD^ --check
          PYTHONPATH=youtube-shorts-bot python -m unittest discover -s youtube-shorts-bot/tests -v
          git push origin HEAD:main
