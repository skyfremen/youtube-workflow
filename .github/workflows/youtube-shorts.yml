name: Build and upload YouTube Short

on:
  push:
    paths:
      - 'youtube-shorts-bot/content/latest.json'
      - 'youtube-shorts-bot/render.py'
      - 'youtube-shorts-bot/upload.py'
      - 'youtube-shorts-bot/workflow_common.py'
      - 'youtube-shorts-bot/validate_content.py'
      - 'youtube-shorts-bot/verify_render.py'
      - 'youtube-shorts-bot/publish.py'
      - 'youtube-shorts-bot/finalize.py'
      - 'youtube-shorts-bot/media_preflight.py'
      - 'youtube-shorts-bot/auth_check.py'
      - '.github/workflows/youtube-shorts.yml'
  workflow_dispatch:

concurrency:
  group: youtube-short-publish
  cancel-in-progress: false

jobs:
  build-upload:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip upload]') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate YouTube credentials and OAuth
        run: python youtube-shorts-bot/auth_check.py

      - name: Preflight media URLs
        run: python youtube-shorts-bot/media_preflight.py

      - name: Validate content and duplicate protection
        run: python youtube-shorts-bot/validate_content.py

      - name: Render Short
        run: python youtube-shorts-bot/render.py

      - name: Verify rendered video and audio
        run: python youtube-shorts-bot/verify_render.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_id }}
          path: youtube-shorts-bot/output/short.mp4
          retention-days: 3

      - name: Upload to YouTube and capture video ID
        run: python youtube-shorts-bot/publish.py

      - name: Archive successful upload
        run: python youtube-shorts-bot/finalize.py

      - name: Upload publish metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-metadata-${{ github.run_id }}
          path: youtube-shorts-bot/output/upload_result.json
          retention-days: 3

      - name: Commit successful archive
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" config user.name "github-actions[bot]"
          git -C "${GITHUB_WORKSPACE}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${GITHUB_WORKSPACE}" add youtube-shorts-bot/content/archive/

          if git -C "${GITHUB_WORKSPACE}" diff --cached --quiet; then
            echo "Archive already up to date."
            exit 0
          fi

          git -C "${GITHUB_WORKSPACE}" commit -m "[skip upload] archive successful YouTube Short ${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5; do
            git -C "${GITHUB_WORKSPACE}" pull --rebase origin "${GITHUB_REF_NAME}"
            if git -C "${GITHUB_WORKSPACE}" push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase..."
            sleep $((attempt * 2))
          done
          echo "Failed to persist archive state after 5 attempts."
          exit 1
