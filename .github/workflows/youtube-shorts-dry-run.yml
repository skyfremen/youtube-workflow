name: Wacky Dramas Dry Run

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'youtube-shorts-bot/Dockerfile'
      - 'youtube-shorts-bot/requirements.txt'
      - 'youtube-shorts-bot/*.py'
      - 'youtube-shorts-bot/tests/**'
      - 'youtube-shorts-bot/planner/**'
      - 'youtube-shorts-bot/*.md'
      - 'youtube-shorts-bot/media-library/backgrounds.json'
  workflow_dispatch:

concurrency:
  group: wacky-dramas-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      VIDEO_WIDTH: '720'
      VIDEO_HEIGHT: '1280'
      VIDEO_FPS: '30'
      STORY_TEST_MODE: 'true'
      STORY_RENDER_MAX_SECONDS: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lightweight static-test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'numpy>=2.0.2,<2.3' \
            'Pillow>=10,<12'

      - name: Compile production Python
        shell: bash
        run: |
          python -m py_compile youtube-shorts-bot/*.py

      - name: Verify retired architecture cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden_paths = [
              'youtube-story-bot','youtube-shorts-bot-backup','youtube-longform-bot',
              '.github/workflows/backup-shorts-once.yml','.github/workflows/build-story-image.yml',
              '.github/workflows/daily-plan-validate.yml','.github/workflows/daily-queue-publish.yml',
              '.github/workflows/media-library-validate.yml','.github/workflows/story-bot-test.yml',
              '.github/workflows/wacky-dramas-acceptance-recovery.yml','.github/workflows/youtube-longform-mvp.yml',
              '.github/workflows/post-cleanup-sweep.yml','youtube-shorts-bot/content/archive',
              'youtube-shorts-bot/content/latest.json','youtube-shorts-bot/content/plans',
              'youtube-shorts-bot/content/validation-triggers','youtube-shorts-bot/media-library/music.json',
              'youtube-shorts-bot/media_failover.py','youtube-shorts-bot/media_preflight.py',
              'youtube-shorts-bot/planner/PLANNER_INSTRUCTIONS.md','youtube-shorts-bot/queue_manager.py',
              'youtube-shorts-bot/schedule_guard.py','youtube-shorts-bot/schedule_utils.py',
              'youtube-shorts-bot/validate_backup_metadata.py','youtube-shorts-bot/validate_series_plan.py',
              'youtube-shorts-bot/verify_youtube_schedule.py',
          ]
          present = [p for p in forbidden_paths if Path(p).exists()]
          assert not present, 'retired paths still present: ' + ', '.join(present)
          expected_workflows = {
              'adhoc-story-private.yml','background-library-renditions.yml','build-shorts-image.yml',
              'daily-growth-batch.yml','youtube-analytics.yml','youtube-shorts-dry-run.yml',
          }
          actual_workflows = {p.name for p in Path('.github/workflows').glob('*.yml')}
          assert actual_workflows == expected_workflows, f'unexpected workflow set: {sorted(actual_workflows)}'
          active_files = [*Path('youtube-shorts-bot').glob('*.py'),*Path('youtube-shorts-bot/planner').glob('*.md'),
                          *Path('youtube-shorts-bot').glob('*.md'),*Path('.github/workflows').glob('*.yml')]
          forbidden_terms = ['Wacky Insights','@WACKYINSIGHTS','youtube-story-bot','youtube-shorts-bot-backup',
                             'content/latest.json','content/plans/','queue_manager.py','media-library/music.json']
          hits=[]
          # Cleanup workflow itself lists retired names intentionally; do not scan this file.
          for path in active_files:
              if path.name == 'youtube-shorts-dry-run.yml': continue
              text=path.read_text(encoding='utf-8')
              for term in forbidden_terms:
                  if term in text: hits.append(f'{path}: {term}')
          assert not hits, 'stale active references: ' + '; '.join(hits)
          print('Retired architecture remains absent; canonical Wacky Dramas paths preserved.')
          PY

      - name: Check immutable request result and recovery history
        if: github.event_name == 'push'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'youtube-shorts-bot')
          from request_guard import check_immutable_changes
          before=os.environ['PREVIOUS_SHA']
          if before and set(before) != {'0'}: check_immutable_changes(before, os.environ['GITHUB_SHA'])
          print('Immutable request/result/recovery/planning/background-sourcing history unchanged.')
          PY

      - name: Run unit and contract tests
        run: python -m unittest discover -s youtube-shorts-bot/tests -v

      - name: Validate satisfying-background registry
        run: python youtube-shorts-bot/validate_media_library.py

      - name: Exercise legacy ad-hoc schema v2 compatibility
        shell: bash
        run: |
          cat > /tmp/wd-20260908T161000-dry-run-abc123.json <<'JSON'
          {
            "schema_version": 2,
            "content_id": "wd-20260908T161000-dry-run-abc123",
            "channel": {"name": "Wacky Dramas", "handle": "@WACKYDRAMAS"},
            "story": {"category":"WORKPLACE","story_type":"BACKFIRE","hook":"My Boss Put It in Writing","script":"I asked for the new rule in writing. The reply reached the person who owned the policy.","card_emojis":["💼","📧","😤","😳","🔥"]},
            "narration": {"engine":"kokoro","voice":"af_heart","speed":1.75},
            "visual": {"background_primary_id":"satisfying-001","background_backup_id":"satisfying-002"},
            "youtube": {"title":"The Email Trail Changed Everything #Shorts","description":"An original Wacky Dramas story.","hashtags":["#shorts","#storytime","#wackydramas"],"category_id":"24","made_for_kids":false}
          }
          JSON
          python youtube-shorts-bot/validate_content.py --request /tmp/wd-20260908T161000-dry-run-abc123.json
          python youtube-shorts-bot/media_resolver.py --request /tmp/wd-20260908T161000-dry-run-abc123.json --no-download --skip-preflight

      - name: Run full 120 premise growth acceptance dry run
        shell: bash
        run: |
          python youtube-shorts-bot/growth_planner.py \
            --acceptance-dry-run --date 2026-09-10 --analytics-video-count 0 \
            --output /tmp/growth-dry-run.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/growth-dry-run.json'))
          assert d['raw_premises_generated'] >= 120
          assert d['final_selected'] == 24
          assert d['analytics_weight'] == 0
          assert d['exploit_selections'] == 19 and d['explore_selections'] == 5
          selected=d['selected']
          assert len({x['publication']['publish_at'] for x in selected}) == len(selected)
          assert all(x['publication']['timezone'] == 'Asia/Singapore' for x in selected)
          assert all(len(x['title_candidates']) >= 5 for x in selected)
          assert all(x['opening_line'] for x in selected)
          print('Growth acceptance: 120+ raw -> filtered/scored -> semifinal title/hook competition -> 19 exploit + 5 explore -> 24 unique hourly slots.')
          PY

      - name: Verify renderer production contracts statically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'youtube-shorts-bot')
          import render, tts_backend, workflow_common
          from background_policy import production_rendition_policy
          assert workflow_common.PRODUCTION_MAX_SECONDS == 178.0
          assert workflow_common.PRODUCTION_TARGET_MIN_SECONDS == 120.0
          assert workflow_common.PRODUCTION_TARGET_MAX_SECONDS == 175.0
          assert workflow_common.START_LEAD_SECONDS == 0.50
          assert workflow_common.END_TAIL_SECONDS == 0.35
          assert workflow_common.expected_video_config() == {'width':720,'height':1280,'fps':30}
          assert render.X264_PRESET == 'superfast' and render.X264_CRF == 19
          assert tts_backend.ONNX_BACKEND == 'onnx-fp32'
          policy=production_rendition_policy()
          assert policy['max_source_pixels'] == 1920 * 1080
          assert policy['uhd_downloads_allowed'] is False
          text=Path('youtube-shorts-bot/render.py').read_text(encoding='utf-8')
          for needle in ['OnnxKokoroSynthesizer','PytorchKokoroSynthesizer','narration_backend_used',
                         'inline_blackdetect_passed','"-map", "3:a:0"','lead_audio = np.zeros']:
              assert needle in text
          print('Rendering identity preserved; background production downloads are capped at 1080p-equivalent and UHD is forbidden.')
          PY

      - name: Verify workflow safety contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dry=Path('.github/workflows/youtube-shorts-dry-run.yml').read_text()
          adhoc=Path('.github/workflows/adhoc-story-private.yml').read_text()
          batch=Path('.github/workflows/daily-growth-batch.yml').read_text()
          maintenance=Path('.github/workflows/background-library-renditions.yml').read_text()
          # Build self-search tokens dynamically so the test does not match its own source.
          secret_names=[
              'YOUTUBE_' + 'CLIENT_ID',
              'YOUTUBE_' + 'CLIENT_SECRET',
              'YOUTUBE_' + 'REFRESH_TOKEN',
          ]
          for secret in secret_names:
              assert secret not in dry
          assert ('container' + ':') not in dry
          assert 'group: wacky-dramas-youtube-upload' in adhoc
          assert 'group: wacky-dramas-youtube-upload' in batch
          assert "[daily growth]" in adhoc and "[daily growth]" in batch
          assert 'schedule:' not in batch.split('jobs:')[0], 'batch must not wake hourly; YouTube scheduling owns cadence'
          assert 'for req in' not in adhoc and 'content/latest.json' not in adhoc
          assert 'queue_manager.py' not in batch and 'content/latest.json' not in batch
          # Cache ingestion must happen before any expensive media/TTS/render work.
          assert 'ingest-manifest' in batch and 'PEXELS_API_KEY' in batch
          assert batch.index('ingest-manifest') < batch.index('render_aligned.py')
          assert 'branches: [main]' in maintenance
          print('Dry-run has no production secrets/container; AI-sourced cache ingestion precedes rendering; upload paths serialize; no hourly render cron exists.')
          PY

      - name: Confirm zero expensive production side effects
        shell: bash
        run: |
          test ! -f youtube-shorts-bot/output/short.mp4
          test ! -f youtube-shorts-bot/output/narration.wav
          test ! -f youtube-shorts-bot/output/upload_result.json
          test ! -d youtube-shorts-bot/content/planning
          test ! -d youtube-shorts-bot/content/background-sourcing
          echo 'Dry run passed with no TTS execution, MP4 render, YouTube upload, false receipt, immutable planning mutation, or background-sourcing mutation.'


  render-transform-benchmark:
    if: ${{ contains(github.event.head_commit.message, '[render transform benchmark]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to production runner registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Benchmark pre-change and optimized production render
        shell: bash
        run: |
          set -euo pipefail
          benchmark_dir="$GITHUB_WORKSPACE/youtube-shorts-bot/benchmark-output"
          mkdir -p "$benchmark_dir"
          git show f6e3bdcbfd4368fde8e2e8b552d3915002727188:youtube-shorts-bot/content/requests/wd-20260909T004900-unpaid-overtime-c84f2a.json > "$benchmark_dir/request.json"
          cp youtube-shorts-bot/render.py "$benchmark_dir/render-optimized.py"
          git show 83ba45c17260acd56964a5405b024d6e61eee4cf:youtube-shorts-bot/render.py > "$benchmark_dir/render-baseline.py"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e VIDEO_WIDTH=720 \
            -e VIDEO_HEIGHT=1280 \
            -e VIDEO_FPS=30 \
            -e STORY_TEST_MODE=false \
            ghcr.io/skyfremen/youtube-shorts-runner:latest \
            bash -lc '
              set -euo pipefail
              benchmark_dir=/work/youtube-shorts-bot/benchmark-output
              request="$benchmark_dir/request.json"
              python youtube-shorts-bot/validate_content.py --request "$request"

              export STORY_OUTPUT_DIR="$benchmark_dir/source"
              python youtube-shorts-bot/media_resolver.py --request "$request"
              cp "$STORY_OUTPUT_DIR/background.asset" "$benchmark_dir/background.asset"
              cp "$STORY_OUTPUT_DIR/background_selection.json" "$benchmark_dir/background_selection.json"

              render_variant() {
                variant="$1"
                renderer="$2"
                output="$benchmark_dir/$variant"
                mkdir -p "$output"
                cp "$benchmark_dir/background.asset" "$output/background.asset"
                cp "$benchmark_dir/background_selection.json" "$output/background_selection.json"
                cp "$renderer" youtube-shorts-bot/render.py
                STORY_OUTPUT_DIR="$output" python youtube-shorts-bot/render_aligned.py --request "$request"
                STORY_OUTPUT_DIR="$output" python youtube-shorts-bot/verify_render.py --request "$request"
              }

              # Run optimized first so model/page-cache warm-up cannot make the
              # optimized timing look artificially better than the baseline.
              render_variant optimized "$benchmark_dir/render-optimized.py"
              render_variant baseline "$benchmark_dir/render-baseline.py"
              cp "$benchmark_dir/render-optimized.py" youtube-shorts-bot/render.py

              ffmpeg -hide_banner -v info \
                -i "$benchmark_dir/baseline/short.mp4" \
                -i "$benchmark_dir/optimized/short.mp4" \
                -lavfi "[0:v][1:v]ssim=stats_file=$benchmark_dir/ssim.log" \
                -an -f null - 2> "$benchmark_dir/ssim-output.txt"

              python - <<"PY"
              import hashlib
              import json
              import re
              from pathlib import Path

              root = Path("/work/youtube-shorts-bot/benchmark-output")
              baseline = json.loads((root / "baseline/render-metadata.json").read_text())
              optimized = json.loads((root / "optimized/render-metadata.json").read_text())
              ssim_text = (root / "ssim-output.txt").read_text()
              match = re.search(r"All:([0-9.]+)", ssim_text)
              if not match:
                  raise SystemExit("Could not parse FFmpeg SSIM result")

              def sha(path):
                  return hashlib.sha256(path.read_bytes()).hexdigest()

              before = float(baseline["ffmpeg_duration_seconds"])
              after = float(optimized["ffmpeg_duration_seconds"])
              result = {
                  "benchmark_request_content_id": "wd-20260909T004900-unpaid-overtime-c84f2a",
                  "baseline_renderer_commit": "83ba45c17260acd56964a5405b024d6e61eee4cf",
                  "optimized_renderer_commit": "15ecde00b2de3d5d4d51aeaec1c8bf39bc00fb63",
                  "execution_order": ["optimized_cold_first", "baseline_warm_second"],
                  "baseline": baseline,
                  "optimized": optimized,
                  "ffmpeg_seconds_saved_per_short": round(before - after, 6),
                  "ffmpeg_improvement_percent": round((before - after) / before * 100, 4),
                  "projected_seconds_saved_per_24": round((before - after) * 24, 6),
                  "projected_minutes_saved_per_30_day_month": round((before - after) * 24 * 30 / 60, 6),
                  "video_ssim": float(match.group(1)),
                  "baseline_narration_sha256": sha(root / "baseline/narration.wav"),
                  "optimized_narration_sha256": sha(root / "optimized/narration.wav"),
              }
              (root / "benchmark-results.json").write_text(
                  json.dumps(result, indent=2) + "\n", encoding="utf-8"
              )
              print(json.dumps(result, indent=2))
              PY
            '

      - name: Preserve benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: shorts-render-transform-${{ github.run_id }}
          path: |
            youtube-shorts-bot/benchmark-output/benchmark-results.json
            youtube-shorts-bot/benchmark-output/ssim-output.txt
          retention-days: 7
          if-no-files-found: error
