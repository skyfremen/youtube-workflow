name: Wacky Dramas Dry Run

on:
  push:
    paths:
      - '.github/workflows/youtube-shorts-dry-run.yml'
      - '.github/workflows/adhoc-story-private.yml'
      - 'youtube-shorts-bot/*.py'
      - 'youtube-shorts-bot/tests/**'
      - 'youtube-shorts-bot/planner/**'
      - 'youtube-shorts-bot/RECOVERY.md'
      - 'youtube-shorts-bot/media-library/backgrounds.json'
  workflow_dispatch:

concurrency:
  group: wacky-dramas-dry-run
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      VIDEO_WIDTH: '720'
      VIDEO_HEIGHT: '1280'
      VIDEO_FPS: '30'
      STORY_TEST_MODE: 'true'
      STORY_RENDER_MAX_SECONDS: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile production Python
        shell: bash
        run: |
          python -m py_compile \
            youtube-shorts-bot/workflow_common.py \
            youtube-shorts-bot/recovery_state.py \
            youtube-shorts-bot/request_guard.py \
            youtube-shorts-bot/validate_content.py \
            youtube-shorts-bot/validate_media_library.py \
            youtube-shorts-bot/media_resolver.py \
            youtube-shorts-bot/render.py \
            youtube-shorts-bot/verify_render.py \
            youtube-shorts-bot/auth_check.py \
            youtube-shorts-bot/upload.py \
            youtube-shorts-bot/publish.py \
            youtube-shorts-bot/verify_youtube_private.py \
            youtube-shorts-bot/finalize.py \
            youtube-shorts-bot/analytics.py

      - name: Verify legacy migration cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden_paths = [
              'youtube-story-bot',
              'youtube-shorts-bot-backup',
              'youtube-longform-bot',
              '.github/workflows/backup-shorts-once.yml',
              '.github/workflows/build-story-image.yml',
              '.github/workflows/daily-plan-validate.yml',
              '.github/workflows/daily-queue-publish.yml',
              '.github/workflows/media-library-validate.yml',
              '.github/workflows/story-bot-test.yml',
              '.github/workflows/wacky-dramas-acceptance-recovery.yml',
              '.github/workflows/youtube-longform-mvp.yml',
              'youtube-shorts-bot/content/archive',
              'youtube-shorts-bot/content/latest.json',
              'youtube-shorts-bot/content/plans',
              'youtube-shorts-bot/content/validation-triggers',
              'youtube-shorts-bot/media-library/music.json',
              'youtube-shorts-bot/media_failover.py',
              'youtube-shorts-bot/media_preflight.py',
              'youtube-shorts-bot/planner/PLANNER_INSTRUCTIONS.md',
              'youtube-shorts-bot/queue_manager.py',
              'youtube-shorts-bot/schedule_guard.py',
              'youtube-shorts-bot/schedule_utils.py',
              'youtube-shorts-bot/validate_backup_metadata.py',
              'youtube-shorts-bot/validate_series_plan.py',
              'youtube-shorts-bot/verify_youtube_schedule.py',
              'youtube-shorts-bot/analytics',
          ]
          present = [p for p in forbidden_paths if Path(p).exists()]
          assert not present, 'legacy paths still present: ' + ', '.join(present)

          expected_workflows = {
              'adhoc-story-private.yml',
              'build-shorts-image.yml',
              'youtube-analytics.yml',
              'youtube-shorts-dry-run.yml',
          }
          actual_workflows = {p.name for p in Path('.github/workflows').glob('*.yml')}
          assert actual_workflows == expected_workflows, (
              f'unexpected workflow set: {sorted(actual_workflows)}'
          )

          active_files = [
              *Path('youtube-shorts-bot').glob('*.py'),
              *Path('youtube-shorts-bot/planner').glob('*.md'),
              Path('youtube-shorts-bot/RECOVERY.md'),
              Path('.github/workflows/adhoc-story-private.yml'),
              Path('.github/workflows/build-shorts-image.yml'),
              Path('.github/workflows/youtube-analytics.yml'),
          ]
          forbidden_terms = [
              'Wacky Insights',
              '@WACKYINSIGHTS',
              'youtube-story-bot',
              'youtube-shorts-bot-backup',
              'youtube-longform-bot',
              'content/latest.json',
              'content/plans/',
              'queue_manager.py',
              'media-library/music.json',
              'verify_youtube_schedule.py',
          ]
          hits = []
          for path in active_files:
              text = path.read_text(encoding='utf-8')
              for term in forbidden_terms:
                  if term in text:
                      hits.append(f'{path}: {term}')
          assert not hits, 'stale active references: ' + '; '.join(hits)
          print('Legacy Shorts/story/longform architectures removed; immutable Shorts evidence preserved.')
          PY

      - name: Check immutable request result and recovery history
        if: github.event_name == 'push'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'youtube-shorts-bot')
          from request_guard import check_immutable_changes
          before = os.environ['PREVIOUS_SHA']
          if before and set(before) != {'0'}:
              check_immutable_changes(before, os.environ['GITHUB_SHA'])
          print('Immutable history unchanged; only new evidence may be added.')
          PYCODE

      - name: Run cheap unit and contract tests
        run: python -m unittest discover -s youtube-shorts-bot/tests -v

      - name: Validate satisfying-background registry
        run: python youtube-shorts-bot/validate_media_library.py

      - name: Create temporary request and exercise validator
        shell: bash
        run: |
          cat > /tmp/wd-20260908T161000-dry-run-abc123.json <<'JSON'
          {
            "schema_version": 2,
            "content_id": "wd-20260908T161000-dry-run-abc123",
            "channel": {"name": "Wacky Dramas", "handle": "@WACKYDRAMAS"},
            "story": {
              "category": "WORKPLACE",
              "story_type": "BACKFIRE",
              "hook": "My boss changed the rules. The email trail changed them back.",
              "script": "I asked for the new rule in writing. The reply reached the person who owned the policy.",
              "card_emojis": ["💼", "📧", "😤", "😳", "🔥"]
            },
            "narration": {"engine": "kokoro", "voice": "af_heart", "speed": 1.75},
            "visual": {
              "background_primary_id": "satisfying-001",
              "background_backup_id": "satisfying-002"
            },
            "youtube": {
              "title": "The Email Trail Changed Everything #Shorts",
              "description": "An original Wacky Dramas story.",
              "hashtags": ["#shorts", "#storytime", "#wackydramas"],
              "category_id": "24",
              "made_for_kids": false
            }
          }
          JSON

          python youtube-shorts-bot/validate_content.py \
            --request /tmp/wd-20260908T161000-dry-run-abc123.json

          cp /tmp/wd-20260908T161000-dry-run-abc123.json /tmp/invalid.json
          python - <<'PY'
          import json
          p='/tmp/invalid.json'
          d=json.load(open(p))
          d['channel']['handle']='@WACKYINSIGHTS'
          json.dump(d,open(p,'w'))
          PY
          if python youtube-shorts-bot/validate_content.py --request /tmp/invalid.json; then
            echo "::error::Invalid legacy channel request unexpectedly passed."
            exit 1
          fi

      - name: Resolve media IDs without downloading media
        run: |
          python youtube-shorts-bot/media_resolver.py \
            --request /tmp/wd-20260908T161000-dry-run-abc123.json \
            --no-download \
            --skip-preflight

      - name: Verify renderer and duration policy statically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'youtube-shorts-bot')
          import workflow_common
          assert workflow_common.PRODUCTION_MAX_SECONDS == 178.0
          assert workflow_common.END_TAIL_SECONDS == 0.35
          assert workflow_common.expected_video_config() == {'width':720,'height':1280,'fps':30}
          text=Path('youtube-shorts-bot/render.py').read_text()
          assert 'KPipeline' in text
          assert 'STORY_TEST_MODE' in text
          assert 'STORY_RENDER_MAX_SECONDS' in text
          assert 'PRODUCTION_MAX_SECONDS' in text
          assert 'END_TAIL_SECONDS' in text
          assert '"-map", "3:a:0"' in text
          print('Renderer policy contract present without executing Kokoro or FFmpeg.')
          PY

      - name: Verify workflow safety contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dry=Path('.github/workflows/youtube-shorts-dry-run.yml').read_text()
          prod=Path('.github/workflows/adhoc-story-private.yml').read_text()

          secret_names = [
              'YOUTUBE_' + 'CLIENT_ID',
              'YOUTUBE_' + 'CLIENT_SECRET',
              'YOUTUBE_' + 'REFRESH_TOKEN',
          ]
          forbidden_exec = [
              'python youtube-shorts-bot/' + 'render.py',
              'python youtube-shorts-bot/' + 'publish.py',
              'python youtube-shorts-bot/' + 'verify_youtube_private.py',
          ]
          for secret in secret_names:
              assert secret not in dry, f'dry run must not expose {secret}'
          for command in forbidden_exec:
              assert command not in dry, f'dry run must not execute {command}'

          assert 'apt install' not in prod and 'apt-get' not in prod
          assert 'pip install' not in prod
          assert 'ghcr.io/skyfremen/youtube-shorts-runner:latest' in prod
          assert 'group: wacky-dramas-youtube-upload' in prod
          assert "YOUTUBE_SCHEDULED_UPLOAD: 'false'" in prod
          assert "YOUTUBE_PRIVACY: private" in prod
          assert 'for slot in' not in prod
          assert 'content/latest.json' not in prod
          assert 'publishAt' not in prod
          assert 'music' not in prod.lower()
          assert '${GITHUB_RUN_ATTEMPT:-1}' in prod
          assert '--recovery-only' in prod
          print('Workflow contracts prove dry run cannot upload and production is private, unscheduled, queue-free and rerun-safe.')
          PY

      - name: Confirm zero media/render/upload side effects
        shell: bash
        run: |
          test ! -f youtube-shorts-bot/output/short.mp4
          test ! -f youtube-shorts-bot/output/narration.wav
          test ! -f youtube-shorts-bot/output/upload_result.json
          echo 'Dry run passed with no TTS, WAV, MP4 render, upload, schedule, queue mutation, or publication artifact.'
