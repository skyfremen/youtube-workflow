name: Dry run YouTube Short pipeline

on:
  push:
    paths:
      - '.github/workflows/youtube-shorts-dry-run.yml'
      - 'youtube-shorts-bot/queue_manager.py'
      - 'youtube-shorts-bot/schedule_utils.py'
      - 'youtube-shorts-bot/validate_backup_metadata.py'
  workflow_dispatch:

concurrency:
  group: youtube-short-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Compile queue and scheduling helpers
        run: |
          python -m py_compile \
            youtube-shorts-bot/queue_manager.py \
            youtube-shorts-bot/schedule_utils.py \
            youtube-shorts-bot/schedule_guard.py \
            youtube-shorts-bot/validate_backup_metadata.py \
            youtube-shorts-bot/validate_media_library.py

      - name: Validate reusable media cache
        run: python youtube-shorts-bot/validate_media_library.py

      - name: Create temporary 24-Short plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          concepts = [
              ('PHONE','Autocorrect betrayal','TYPES ONE NORMAL WORD.','AUTOCORRECT STARTS A NEW LANGUAGE.'),
              ('WORK','Printer panic','PRINTS ONE PAGE BEFORE A MEETING.','PRINTER CHOOSES THIS MOMENT FOR A LIFE CRISIS.'),
              ('SLEEP','Blanket temperature war','TOO HOT WITH THE BLANKET.','TOO COLD WITHOUT IT.'),
              ('FOOD','Fries tax','ORDERS OWN MEAL.','STILL TAKES MY FRIES.'),
              ('SHOPPING','Receipt shock','CART LOOKS REASONABLE.','TOTAL HAS OTHER PLANS.'),
              ('FRIENDS','Late friend physics','SAYS FIVE MINUTES AWAY.','HAS NOT LEFT HOME.'),
              ('TRAVEL','Gate change sprint','FINALLY SITS AT THE GATE.','BOARD CHANGES TO THE OTHER END.'),
              ('SCHOOL','Pen disappears','HAS THREE PENS BEFORE CLASS.','TEST STARTS WITH ZERO.'),
              ('PARENTS','Remote control mystery','PARENT CANNOT FIND THE REMOTE.','IT IS IN THEIR HAND.'),
              ('PETS','Door decision','PET BEGS TO GO OUT.','DOOR OPENS AND PET RECONSIDERS LIFE.'),
              ('DATING','Reply timing strategy','WAITS TEN MINUTES TO REPLY CASUALLY.','SPENDS ALL TEN MINUTES STARING AT THE CHAT.'),
              ('COUPLE','Thermostat diplomacy','ONE PERSON FEELS FREEZING.','THE OTHER IS LIVING IN A VOLCANO.'),
              ('EVERYDAY LIFE','Sock disappearance','PUTS TWO SOCKS IN THE WASH.','DRYER RETURNS A SINGLE WITNESS.'),
              ('HUMAN BEHAVIOR','Queue selection regret','CHOOSES THE SHORTEST LINE.','EVERY OTHER LINE MOVES FIRST.'),
              ('MARRIAGE','Dishwasher geometry','LOADS DISHWASHER ONE WAY.','PARTNER REBUILDS IT LIKE TETRIS.'),
              ('KIDS','Bedtime thirst','NOT THIRSTY ALL EVENING.','BEDTIME CREATES AN OCEAN EMERGENCY.'),
              ('MEN','Instruction manual confidence','SEES THE INSTRUCTION MANUAL.','DECIDES EXPERIENCE WILL APPEAR AUTOMATICALLY.'),
              ('WOMEN','Pocket disappointment','FINDS A PERFECT DRESS.','POCKETS ARE FAKE.'),
              ('CHORES','Vacuum cable math','OUTLET LOOKS CLOSE ENOUGH.','CABLE STOPS FIVE CENTIMETERS SHORT.'),
              ('SOCIAL HABITS','Elevator small talk','ENTERS ELEVATOR WITH A STRANGER.','SUDDENLY THE FLOOR NUMBERS ARE FASCINATING.'),
              ('MORNING','Alarm confidence','SETS ONE ALARM LIKE A RESPONSIBLE ADULT.','MORNING ME HAS LEGAL APPEAL RIGHTS.'),
              ('OFFICE','Meeting snack timing','OPENS A CRUNCHY SNACK QUIETLY.','THE ROOM BECOMES A RECORDING STUDIO.'),
              ('HOME','Package delivery timing','WAITS HOME ALL DAY.','DELIVERY ARRIVES DURING A TWO-MINUTE SHOWER.'),
              ('SOCIAL','Name memory failure','HEARS A NAME DURING INTRODUCTION.','BRAIN DELETES IT BEFORE THE HANDSHAKE ENDS.'),
          ]

          base = Path('youtube-shorts-bot')
          plans = base / 'content' / 'plans'
          plans.mkdir(parents=True, exist_ok=True)
          plan_date = (datetime.now(ZoneInfo('Asia/Singapore')).date() + timedelta(days=1)).isoformat()
          items = []

          for i, (category, topic, setup, payoff) in enumerate(concepts, 1):
              content = {
                  'topic': topic,
                  'category': category,
                  'setup': setup,
                  'payoff': payoff,
                  'cta': 'DOUBLE TAP TO AGREE',
                  'handle': '@WACKYINSIGHTS',
                  'title': f'{topic} 😂 #Shorts',
                  'description': f'{topic}. Synthetic CI dry-run content only.',
                  'hashtags': ['#shorts','#funny','#relatable','#humor','#wackyinsights'],
                  'background_url': f'https://primary.example.invalid/video-{i}.mp4',
                  'background_source_url': f'https://primary.example.invalid/video-source-{i}',
                  'background_creator': f'Dry Run Creator {i}',
                  'background_license': 'Synthetic dry-run license',
                  'background_credit': 'Synthetic dry-run asset.',
                  'background_backup_url': f'https://backup.example.invalid/video-{i}.mp4',
                  'background_backup_source_url': f'https://backup.example.invalid/video-source-{i}',
                  'background_backup_creator': f'Dry Run Backup Creator {i}',
                  'background_backup_license': 'Synthetic dry-run backup license',
                  'background_backup_credit': 'Synthetic dry-run backup asset.',
                  'music_url': f'https://primary.example.invalid/music-{i}.mp3',
                  'music_source_url': f'https://primary.example.invalid/music-source-{i}',
                  'music_title': f'Dry Run Track {i}',
                  'music_artist': f'Dry Run Artist {i}',
                  'music_license': 'Synthetic dry-run music license',
                  'music_credit': 'Synthetic dry-run music.',
                  'music_backup_url': f'https://backup.example.invalid/music-{i}.mp3',
                  'music_backup_source_url': f'https://backup.example.invalid/music-source-{i}',
                  'music_backup_title': f'Dry Run Backup Track {i}',
                  'music_backup_artist': f'Dry Run Backup Artist {i}',
                  'music_backup_license': 'Synthetic dry-run backup music license',
                  'music_backup_credit': 'Synthetic dry-run backup music.',
                  'background_scene': f'Exact synthetic visual scene for topic {topic}',
                  'background_match_reason': f'The primary visual directly depicts the distinct dry-run scenario for {topic} and its main action.',
                  'background_match_score': 95,
                  'background_backup_scene': f'Alternate synthetic visual scene for topic {topic}',
                  'background_backup_match_reason': f'The backup visual independently depicts the same dry-run scenario for {topic} without reusing the primary.',
                  'background_backup_match_score': 91,
                  'music_mood': f'Quirky light comedic mood tailored to {topic}',
                  'music_match_reason': f'The primary track supports the timing and light comedic mechanism of {topic} without overpowering the joke.',
                  'music_match_score': 94,
                  'music_backup_mood': f'Alternate playful comedic mood for {topic}',
                  'music_backup_match_reason': f'The backup track independently supports the pacing and comedic tone of {topic} while remaining distinct.',
                  'music_backup_match_score': 90,
              }
              items.append({
                  'slot': i,
                  'status': 'pending',
                  'comedy_mechanism': ['misdirection','escalation','expectation-vs-reality','instant regret'][i % 4],
                  'quality': {
                      'relatability': 90,'funny': 90,'hook': 90,
                      'originality': 90,'clarity': 90,'visual_potential': 90,'total': 90,
                  },
                  'content': content,
              })

          plan = {
              'plan_date': plan_date,
              'target_count': 24,
              'candidates_generated': 60,
              'media_backups_required': True,
              'strategy_notes': 'Synthetic CI plan used only to test 24-slot validation and scheduling.',
              'items': items,
          }
          path = plans / f'{plan_date}.json'
          path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('youtube-shorts-bot/output').mkdir(exist_ok=True)
          Path('youtube-shorts-bot/output/dry_run_plan_date.txt').write_text(plan_date + '\n')
          print(f'Created temporary 24-slot dry-run plan {path}.')
          PY

      - name: Validate full 24-Short plan and strict backup metadata
        shell: bash
        run: |
          PLAN_DATE="$(cat youtube-shorts-bot/output/dry_run_plan_date.txt)"
          python youtube-shorts-bot/queue_manager.py validate --date "${PLAN_DATE}"
          python youtube-shorts-bot/validate_backup_metadata.py --date "${PLAN_DATE}"

      - name: Verify all 24 hourly release mappings
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import sys

          sys.path.insert(0, 'youtube-shorts-bot')
          from schedule_utils import ensure_publish_at_is_safe, scheduled_publish_at

          plan_date = Path('youtube-shorts-bot/output/dry_run_plan_date.txt').read_text().strip()
          for slot in range(1, 25):
              value = scheduled_publish_at(plan_date, slot)
              dt = datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(ZoneInfo('Asia/Singapore'))
              assert dt.date().isoformat() == plan_date, (slot, dt)
              assert dt.hour == slot - 1 and dt.minute == 0, (slot, dt)

          first = scheduled_publish_at(plan_date, 1)
          last = scheduled_publish_at(plan_date, 24)
          first_dt = datetime.fromisoformat(first.replace('Z', '+00:00'))
          assert ensure_publish_at_is_safe(first, now=first_dt - timedelta(hours=2)) == first
          try:
              ensure_publish_at_is_safe(first, now=first_dt - timedelta(minutes=5))
          except ValueError as exc:
              assert 'MISSED_SCHEDULE_WINDOW' in str(exc), exc
          else:
              raise AssertionError('10-minute schedule guard did not fail closed.')

          print('24 hourly mappings verified: slot 1 = 00:00 SGT through slot 24 = 23:00 SGT.')
          PY

      - name: Verify slot selection without publication
        shell: bash
        run: |
          PLAN_DATE="$(cat youtube-shorts-bot/output/dry_run_plan_date.txt)"
          python youtube-shorts-bot/queue_manager.py select --date "${PLAN_DATE}" --slot 24 --skip-validation
          python - <<'PY'
          import json
          from pathlib import Path
          selection = json.loads(Path('youtube-shorts-bot/output/queue_selection.json').read_text())
          assert selection['slot'] == 24, selection
          plan = json.loads(Path(selection['plan_path']).read_text())
          assert len(plan['items']) == 24
          assert all(item['status'] == 'pending' for item in plan['items'])
          assert not Path('youtube-shorts-bot/output/upload_result.json').exists()
          print('Slot 24 selection verified; no upload, queue mark, archive change or publication occurred.')
          PY

      - name: Confirm no publication
        run: echo '24-HOUR DRY RUN PASSED - 24 plan items, 60 candidates, strict semantic backups, unique media, 00:00-23:00 mapping and fail-closed timing verified. No YouTube upload occurred.'
