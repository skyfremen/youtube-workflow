name: Harden Background Seeder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/background-seed-harden.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Apply focused hardening patches
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('background_seed.py')
          text=path.read_text(encoding='utf-8')
          old='''def valid_source_url(url: str) -> bool:\n    host = _https_host(url)\n    return host == "www.pexels.com" or host == "pexels.com"\n'''
          new='''def valid_source_url(url: str) -> bool:\n    host = _https_host(url)\n    try:\n        source_path = urllib.parse.urlparse(str(url)).path\n    except ValueError:\n        return False\n    return (host == "www.pexels.com" or host == "pexels.com") and source_path.startswith("/video/")\n'''
          if old not in text:
              raise SystemExit('source URL validation block not found')
          text=text.replace(old,new,1)
          old='''    ordered = []\n    indexes = {category: 0 for category in categories}\n    while len(ordered) < request["max_candidates"]:\n'''
          new='''    ordered = []\n    indexes = {category: 0 for category in categories}\n    attempt_limit = min(request["max_candidates"] * 2, 24)\n    while len(ordered) < attempt_limit:\n'''
          if old not in text:
              raise SystemExit('candidate attempt block not found')
          text=text.replace(old,new,1)
          old='''            if len(ordered) >= request["max_candidates"]:\n                break\n'''
          new='''            if len(ordered) >= attempt_limit:\n                break\n'''
          if old not in text:
              raise SystemExit('candidate attempt break not found')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Remove one-shot hardener
        run: rm .github/workflows/background-seed-harden.yml

      - name: Validate hardened subsystem
        run: |
          set -euo pipefail
          python -m py_compile background_seed.py tests/test_background_seed.py
          python background_seed.py validate-registry
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import background_seed as bs
          assert not bs.valid_source_url('https://www.pexels.com/')
          assert bs.valid_source_url('https://www.pexels.com/video/example-123/')
          print('SOURCE_PAGE_VALIDATION_PASS')
          PY

      - name: Commit hardening and self-delete
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background_seed.py .github/workflows/background-seed-harden.yml
          git commit -m "Harden background seeding validation"
          git pull --rebase origin main
          git push origin HEAD:main
