name: Collect YouTube Shorts analytics

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install analytics-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            google-api-python-client==2.187.0 \
            google-auth-httplib2==0.2.0 \
            google-auth-oauthlib==1.2.2
      - name: Collect 90-day video analytics
        run: python youtube-shorts-bot/analytics.py
      - name: Commit analytics snapshot
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/analytics/
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git commit -m "[skip upload] update YouTube analytics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
