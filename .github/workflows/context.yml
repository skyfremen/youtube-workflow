name: Rebuild Planner Context

on:
  push:
    branches: [main]
    paths:
      - 'data/backgrounds.json'
      - 'pipeline.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Rebuild latest compact context and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          merge_analytics() {
            if [[ ! -f content/analytics-summary.json ]]; then
              return 0
            fi
            python - <<'PY'
          import json
          from pathlib import Path

          context_path = Path("content/context.json")
          summary_path = Path("content/analytics-summary.json")
          context = json.loads(context_path.read_text(encoding="utf-8"))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if not isinstance(context, dict) or not isinstance(summary, dict):
              raise SystemExit("ANALYTICS_CONTEXT_INVALID expected JSON objects")
          context["context_version"] = max(int(context.get("context_version", 1)), 2)
          context["analytics_summary"] = summary
          raw = json.dumps(context, ensure_ascii=False, sort_keys=True, indent=2) + "\n"
          if len(raw.encode()) > 80000:
              raise SystemExit("ANALYTICS_CONTEXT_TOO_LARGE expected <=80000 bytes")
          context_path.write_text(raw, encoding="utf-8")
          PY
          }

          for attempt in 1 2 3; do
            echo "Context rebuild attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            python pipeline.py context
            python pipeline.py self-test
            merge_analytics
            git add content/context.json

            if git diff --cached --quiet; then
              echo "Context already current."
              exit 0
            fi

            git commit -m "[state] rebuild compact planner context"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::main advanced before context could be pushed; rebuilding from latest main"
          done

          echo "::error::CONTEXT_PUSH_RETRY_EXHAUSTED after 3 attempts"
          exit 1
