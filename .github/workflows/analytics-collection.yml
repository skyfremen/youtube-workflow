name: Analytics Collection

env:
  PYTHONPATH: youtube-shorts-bot

on:
  schedule:
    # 19:45 Asia/Singapore (UTC+8), before the 20:00 planning run
    - cron: '45 11 * * *'
  workflow_dispatch:

concurrency:
  group: analytics-collection
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Process private analytics state
        run: python youtube-shorts-bot/analytics/analytics_collection.py
      - name: Commit analytics snapshot and learning model
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/analytics/
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git commit -m "[skip upload] update analytics model"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
