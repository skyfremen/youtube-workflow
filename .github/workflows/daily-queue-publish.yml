name: Publish daily Shorts queue

on:
  workflow_run:
    workflows:
      - 'Validate daily Shorts plan'
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: youtube-short-publish
  cancel-in-progress: false

jobs:
  publish-batch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: private
      YOUTUBE_SCHEDULED_UPLOAD: 'true'
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate daily plan
        run: python youtube-shorts-bot/queue_manager.py validate

      - name: Validate YouTube credentials and OAuth once
        run: python youtube-shorts-bot/auth_check.py

      - name: Render, verify, upload, and schedule all 20 Shorts
        id: batch
        shell: bash
        run: |
          mkdir -p youtube-shorts-bot/output/batch-metadata
          rm -f youtube-shorts-bot/output/batch-metadata/*.json

          failures=0
          scheduled=0
          skipped=0

          process_slot() {
            slot="$1"
            echo "========== Processing queue slot ${slot} =========="

            rm -f \
              youtube-shorts-bot/output/queue_selection.json \
              youtube-shorts-bot/output/upload_result.json \
              youtube-shorts-bot/output/content_id.txt \
              youtube-shorts-bot/output/short.mp4

            python youtube-shorts-bot/queue_manager.py select --slot "${slot}" || return 1

            if [ ! -f youtube-shorts-bot/output/queue_selection.json ]; then
              echo "Slot ${slot} has no pending item; skipping."
              skipped=$((skipped + 1))
              return 0
            fi

            python youtube-shorts-bot/media_preflight.py || return 1
            python youtube-shorts-bot/validate_content.py || return 1
            python youtube-shorts-bot/render.py || return 1
            python youtube-shorts-bot/verify_render.py || return 1
            python youtube-shorts-bot/publish.py || return 1
            python youtube-shorts-bot/finalize.py || return 1
            python youtube-shorts-bot/queue_manager.py mark || return 1

            cp \
              youtube-shorts-bot/output/upload_result.json \
              "youtube-shorts-bot/output/batch-metadata/slot-${slot}.json"
            scheduled=$((scheduled + 1))
            echo "Slot ${slot} successfully uploaded and scheduled."
          }

          for slot in $(seq 1 20); do
            if ! process_slot "${slot}"; then
              failures=$((failures + 1))
              echo "::error::Queue slot ${slot} failed. Later slots will continue processing."
            fi
          done

          echo "scheduled=${scheduled}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"
          echo "failures=${failures}" >> "$GITHUB_OUTPUT"
          echo "Batch result: ${scheduled} scheduled, ${skipped} already complete, ${failures} failed."

      - name: Upload batch publish metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-metadata-${{ github.run_id }}
          path: youtube-shorts-bot/output/batch-metadata/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit queue state and archive once
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/content/plans/ youtube-shorts-bot/content/archive/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "[skip upload] persist scheduled daily Shorts batch"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase..."
            sleep $((attempt * 2))
          done
          echo "Failed to persist queue/archive state after 5 attempts."
          exit 1

      - name: Fail batch if any slot failed
        if: ${{ always() && steps.batch.outputs.failures != '0' }}
        run: |
          echo "${{ steps.batch.outputs.failures }} queue slot(s) failed. Successful slots were preserved and scheduled; rerun this workflow to retry only pending slots."
          exit 1
