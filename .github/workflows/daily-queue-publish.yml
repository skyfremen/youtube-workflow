name: Publish daily Shorts queue

on:
  workflow_run:
    workflows:
      - 'Validate daily Shorts plan'
    types:
      - completed
  workflow_dispatch:
    inputs:
      plan_date:
        description: 'Singapore plan date to process (YYYY-MM-DD). Leave blank for tomorrow.'
        required: false
        type: string

concurrency:
  group: youtube-short-publish
  cancel-in-progress: false

jobs:
  publish-batch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[skip upload]')) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: private
      YOUTUBE_SCHEDULED_UPLOAD: 'true'
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PLAN_DATE: ${{ github.event.inputs.plan_date || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Mark repository safe for container Git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve and validate exact daily plan once
        id: plan
        shell: bash
        run: |
          if [ -n "${PLAN_DATE}" ]; then
            resolved_date="${PLAN_DATE}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            mapfile -t changed_plans < <(git show --pretty='' --name-only "${SOURCE_COMMIT_SHA}" -- 'youtube-shorts-bot/content/plans/*.json' | sed '/^$/d')
            if [ "${#changed_plans[@]}" -ne 1 ]; then
              echo "::error::Validated source commit must contain exactly one changed plan; found ${#changed_plans[@]}."
              printf '%s\n' "${changed_plans[@]}"
              exit 1
            fi
            resolved_date="$(basename "${changed_plans[0]}" .json)"
          else
            resolved_date="$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          print((datetime.now(ZoneInfo('Asia/Singapore')).date() + timedelta(days=1)).isoformat())
          PY
          )"
          fi

          if [[ ! "${resolved_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Resolved invalid plan date: ${resolved_date}"
            exit 1
          fi

          echo "plan_date=${resolved_date}" >> "$GITHUB_OUTPUT"
          echo "Processing exact Singapore plan date ${resolved_date} from source commit ${SOURCE_COMMIT_SHA}."
          python youtube-shorts-bot/queue_manager.py validate --date "${resolved_date}"
          python youtube-shorts-bot/validate_backup_metadata.py --date "${resolved_date}"
          python youtube-shorts-bot/validate_media_library.py

      - name: Validate YouTube credentials and OAuth once
        run: python youtube-shorts-bot/auth_check.py

      - name: Process all 24 Shorts with early schedule guard and smart retries
        id: batch
        shell: bash
        env:
          RESOLVED_PLAN_DATE: ${{ steps.plan.outputs.plan_date }}
        run: |
          mkdir -p youtube-shorts-bot/output/batch-metadata
          rm -f youtube-shorts-bot/output/batch-metadata/*.json

          failures=0
          scheduled=0
          skipped=0
          missed=0

          process_slot() {
            slot="$1"
            uploaded=0
            echo "========== Processing queue slot ${slot} =========="

            for attempt in 1 2 3; do
              echo "---- Slot ${slot} attempt ${attempt}/3 ----"

              if [ "${uploaded}" -eq 0 ]; then
                if python youtube-shorts-bot/schedule_guard.py \
                  --date "${RESOLVED_PLAN_DATE}" --slot "${slot}"; then
                  :
                else
                  guard_rc=$?
                  if [ "${guard_rc}" -eq 20 ]; then
                    echo "::warning::Queue slot ${slot} missed its safe publish window; skipping before media download/render."
                    return 20
                  fi
                  echo "::error::Queue slot ${slot} schedule guard failed unexpectedly."
                  return 1
                fi

                rm -f \
                  youtube-shorts-bot/output/queue_selection.json \
                  youtube-shorts-bot/output/upload_result.json \
                  youtube-shorts-bot/output/content_id.txt \
                  youtube-shorts-bot/output/short.mp4 \
                  youtube-shorts-bot/output/background.asset \
                  youtube-shorts-bot/output/music.asset

                if ! python youtube-shorts-bot/queue_manager.py select \
                  --date "${RESOLVED_PLAN_DATE}" \
                  --slot "${slot}" \
                  --skip-validation; then
                  echo "::error::Queue slot ${slot} selection failed."
                  return 1
                fi

                if [ ! -f youtube-shorts-bot/output/queue_selection.json ]; then
                  echo "Slot ${slot} is already complete or unavailable; skipping."
                  return 10
                fi

                if ! python youtube-shorts-bot/media_failover.py; then
                  echo "::warning::Slot ${slot} media preparation failed on attempt ${attempt}."
                  if [ "${attempt}" -lt 3 ]; then
                    sleep $((attempt * 2))
                    continue
                  fi
                  return 1
                fi

                if ! python youtube-shorts-bot/validate_content.py; then
                  echo "::error::Slot ${slot} content validation is a permanent failure; not retrying blindly."
                  return 1
                fi

                if ! python youtube-shorts-bot/render.py; then
                  echo "::warning::Slot ${slot} render failed on attempt ${attempt}; clean render retry will be attempted if time remains."
                  if [ "${attempt}" -lt 3 ]; then
                    sleep $((attempt * 2))
                    continue
                  fi
                  return 1
                fi

                if ! python youtube-shorts-bot/verify_render.py; then
                  echo "::warning::Slot ${slot} render verification failed on attempt ${attempt}; rerendering if time remains."
                  if [ "${attempt}" -lt 3 ]; then
                    sleep $((attempt * 2))
                    continue
                  fi
                  return 1
                fi

                if ! python youtube-shorts-bot/publish.py; then
                  echo "::error::Slot ${slot} upload failed without a confirmed reusable video ID; refusing blind re-upload to avoid duplicates."
                  return 1
                fi

                uploaded=1
                cp youtube-shorts-bot/output/upload_result.json \
                  "youtube-shorts-bot/output/batch-metadata/slot-${slot}.json" || true
                echo "Slot ${slot} upload checkpoint saved; all further retries will reuse this YouTube video ID."
              fi

              if ! python youtube-shorts-bot/verify_youtube_schedule.py; then
                echo "::warning::Slot ${slot} YouTube schedule verification failed on attempt ${attempt}; retrying existing video only."
                if [ "${attempt}" -lt 3 ]; then
                  sleep $((attempt * 2))
                  continue
                fi
                return 1
              fi

              if ! python youtube-shorts-bot/finalize.py; then
                echo "::warning::Slot ${slot} finalization failed on attempt ${attempt}; retrying existing video only."
                if [ "${attempt}" -lt 3 ]; then
                  sleep $((attempt * 2))
                  continue
                fi
                return 1
              fi

              if ! python youtube-shorts-bot/queue_manager.py mark; then
                echo "::warning::Slot ${slot} queue-state mark failed on attempt ${attempt}; retrying state recovery only."
                if [ "${attempt}" -lt 3 ]; then
                  sleep $((attempt * 2))
                  continue
                fi
                return 1
              fi

              cp youtube-shorts-bot/output/upload_result.json \
                "youtube-shorts-bot/output/batch-metadata/slot-${slot}.json" || true
              echo "Slot ${slot} successfully uploaded, YouTube-verified, finalized, and scheduled."
              return 0
            done

            return 1
          }

          for slot in $(seq 1 24); do
            if process_slot "${slot}"; then
              scheduled=$((scheduled + 1))
            else
              rc=$?
              if [ "${rc}" -eq 10 ]; then
                skipped=$((skipped + 1))
              elif [ "${rc}" -eq 20 ]; then
                missed=$((missed + 1))
              else
                failures=$((failures + 1))
                echo "::error::Queue slot ${slot} failed after safe recovery attempts. Later slots will continue processing."
              fi
            fi
          done

          echo "scheduled=${scheduled}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"
          echo "missed=${missed}" >> "$GITHUB_OUTPUT"
          echo "failures=${failures}" >> "$GITHUB_OUTPUT"
          echo "Batch result: ${scheduled} scheduled, ${skipped} already complete, ${missed} missed-window warnings, ${failures} genuine failures."

      - name: Upload batch publish metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-metadata-${{ github.run_id }}
          path: youtube-shorts-bot/output/batch-metadata/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit queue state and archive once
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git restore youtube-shorts-bot/content/latest.json || true
          git add youtube-shorts-bot/content/plans/ youtube-shorts-bot/content/archive/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "[skip upload] persist scheduled daily Shorts batch"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase..."
            sleep $((attempt * 2))
          done
          echo "Failed to persist queue/archive state after 5 attempts."
          exit 1

      - name: Report missed schedule windows
        if: ${{ always() && steps.batch.outputs.missed != '0' }}
        run: |
          echo "::warning::${{ steps.batch.outputs.missed }} queue slot(s) were already outside the safe scheduling window and were skipped before expensive media/render work."

      - name: Fail batch only for genuine unresolved failures
        if: ${{ always() && steps.batch.outputs.failures != '0' }}
        run: |
          echo "${{ steps.batch.outputs.failures }} queue slot(s) still failed after safe recovery attempts. Successful slots were preserved; missed schedule windows are warnings only."
          exit 1
