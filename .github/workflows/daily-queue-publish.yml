name: Publish daily Shorts queue

on:
  schedule:
    - cron: '0 0-15 * * *'
    - cron: '0 20-23 * * *'
  workflow_dispatch:

concurrency:
  group: youtube-short-publish
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select next approved Short
        id: select
        shell: bash
        run: |
          rm -f youtube-shorts-bot/output/queue_selection.json
          python youtube-shorts-bot/queue_manager.py select
          if [ -f youtube-shorts-bot/output/queue_selection.json ]; then
            echo "has_short=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_short=false" >> "$GITHUB_OUTPUT"
            echo "No Short selected; publisher exits successfully without rendering or uploading."
          fi

      - name: Validate YouTube credentials
        if: steps.select.outputs.has_short == 'true'
        shell: bash
        run: |
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Preflight media URLs
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/media_preflight.py

      - name: Validate content and duplicate protection
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/validate_content.py

      - name: Render Short
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/render.py

      - name: Verify rendered video and audio
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/verify_render.py

      - name: Upload video artifact
        if: steps.select.outputs.has_short == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_id }}
          path: youtube-shorts-bot/output/short.mp4
          retention-days: 3

      - name: Upload to YouTube and capture video ID
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/publish.py

      - name: Archive successful upload
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/finalize.py

      - name: Mark queue item published
        if: steps.select.outputs.has_short == 'true'
        run: python youtube-shorts-bot/queue_manager.py mark

      - name: Upload publish metadata artifact
        if: steps.select.outputs.has_short == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-metadata-${{ github.run_id }}
          path: youtube-shorts-bot/output/upload_result.json
          retention-days: 3

      - name: Commit queue state and archive
        if: steps.select.outputs.has_short == 'true'
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/content/plans/ youtube-shorts-bot/content/archive/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "[skip upload] publish next daily Short"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase..."
            sleep $((attempt * 2))
          done
          echo "Failed to persist queue/archive state after 5 attempts."
          exit 1
