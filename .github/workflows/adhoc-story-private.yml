name: Wacky Dramas Ad-hoc Private Publish

on:
  push:
    branches:
      - main
    paths:
      - 'youtube-shorts-bot/content/requests/*.json'
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Existing immutable Wacky Dramas content_id to recover/process'
        required: true
        type: string

concurrency:
  group: wacky-dramas-youtube-upload
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  private-story:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: private
      YOUTUBE_SCHEDULED_UPLOAD: 'false'
      STORY_TEST_MODE: 'true'
      STORY_RENDER_MAX_SECONDS: '5'
      VIDEO_WIDTH: '720'
      VIDEO_HEIGHT: '1280'
      VIDEO_FPS: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Configure container Git safety
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main

      - name: Resolve exactly one immutable request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python youtube-shorts-bot/request_guard.py \
              --event push \
              --commit "$GITHUB_SHA"
          else
            python youtube-shorts-bot/request_guard.py \
              --event manual \
              --content-id "${{ github.event.inputs.content_id }}"
          fi

      - name: Pin immutable request source commit
        if: steps.request.outputs.already_complete != 'true'
        shell: bash
        run: echo "SOURCE_COMMIT_SHA=${{ steps.request.outputs.source_commit_sha }}" >> "$GITHUB_ENV"

      - name: Report already-complete recovery
        if: steps.request.outputs.already_complete == 'true'
        run: |
          echo "Request ${{ steps.request.outputs.content_id }} already has an immutable result receipt on main."
          echo "No render or YouTube API mutation is needed; duplicate upload prevention passed."

      - name: Validate request and background registry
        if: steps.request.outputs.already_complete != 'true'
        shell: bash
        run: |
          python youtube-shorts-bot/validate_content.py \
            --request "${{ steps.request.outputs.request_path }}"
          python youtube-shorts-bot/validate_media_library.py

      - name: Validate YouTube credentials once
        if: steps.request.outputs.already_complete != 'true'
        run: python youtube-shorts-bot/auth_check.py

      - name: Resolve and preflight satisfying background
        if: steps.request.outputs.already_complete != 'true'
        run: |
          python youtube-shorts-bot/media_resolver.py \
            --request "${{ steps.request.outputs.request_path }}"

      - name: Generate Kokoro narration and render
        if: steps.request.outputs.already_complete != 'true'
        run: |
          python youtube-shorts-bot/render.py \
            --request "${{ steps.request.outputs.request_path }}"

      - name: Verify rendered Short
        if: steps.request.outputs.already_complete != 'true'
        run: |
          python youtube-shorts-bot/verify_render.py \
            --request "${{ steps.request.outputs.request_path }}"

      - name: Duplicate-safe private upload
        if: steps.request.outputs.already_complete != 'true'
        run: |
          python youtube-shorts-bot/publish.py \
            --request "${{ steps.request.outputs.request_path }}"

      - name: Verify YouTube privacy and recovery marker
        if: steps.request.outputs.already_complete != 'true'
        run: |
          python youtube-shorts-bot/verify_youtube_private.py \
            --request "${{ steps.request.outputs.request_path }}"

      - name: Create immutable result receipt
        if: steps.request.outputs.already_complete != 'true'
        run: |
          python youtube-shorts-bot/finalize.py \
            --request "${{ steps.request.outputs.request_path }}"

      - name: Persist result receipt only
        if: steps.request.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          RESULT="youtube-shorts-bot/content/results/${{ steps.request.outputs.content_id }}.json"
          test -f "$RESULT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"

          CHANGED="$(git diff --cached --name-only)"
          if [ "$CHANGED" != "$RESULT" ]; then
            echo "::error::Only the immutable result receipt may be committed after production."
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          git commit -m "[skip upload] result ${{ steps.request.outputs.content_id }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload lightweight failure diagnostics
        if: failure() && steps.request.outputs.already_complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wacky-dramas-diagnostics-${{ github.run_id }}
          path: |
            youtube-shorts-bot/output/story-card.png
            youtube-shorts-bot/output/captions.ass
            youtube-shorts-bot/output/render-metadata.json
            youtube-shorts-bot/output/background_selection.json
            youtube-shorts-bot/output/upload_result.json
          if-no-files-found: ignore
          retention-days: 3
