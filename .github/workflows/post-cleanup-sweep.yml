name: One-time migration branch prune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-cleanup-sweep.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch is fully merged and delete it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main wacky-dramas-migration
          branch_sha="$(git rev-parse origin/wacky-dramas-migration)"
          merge_base="$(git merge-base origin/main origin/wacky-dramas-migration)"
          test "$branch_sha" = "$merge_base"
          git push origin --delete wacky-dramas-migration
