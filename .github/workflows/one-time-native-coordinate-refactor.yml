name: One-time native-coordinate refactor

on:
  push:
    paths:
      - '.github/workflows/one-time-native-coordinate-refactor.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native-coordinate refactor
        shell: sh
        run: |
          set -eu
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/one_time_native_coordinate_refactor.py')
          text = path.read_text(encoding='utf-8')
          old = "for forbidden in ('W / 1080.0', 'H / 1920.0', 'scaled(', 'sx', 'sy', 'scale = min('):\n    assert forbidden not in text, forbidden\n"
          new = "for forbidden in ('W / 1080.0', 'H / 1920.0', 'scaled(', 'scale = min('):\n    assert forbidden not in text, forbidden\n"
          assert old in text
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/one_time_native_coordinate_refactor.py

      - name: Validate refactor
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m py_compile youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_layout.py
          python -m unittest discover -s youtube-shorts-bot/tests -p 'test_layout.py' -v
          git diff --check
          ! grep -nE '1080\.0|1920\.0|scaled\(|\bsx\b|\bsy\b' youtube-shorts-bot/render.py
          grep -n 'CAPTION_MARGIN_X = 85' youtube-shorts-bot/render.py
          grep -n 'CAPTION_MAX_WIDTH = VIDEO_WIDTH - (2 \* CAPTION_MARGIN_X)' youtube-shorts-bot/render.py

      - name: Commit renderer refactor
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore tools/one_time_native_coordinate_refactor.py
          git add youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_layout.py
          git commit -m "use native 720p Shorts layout coordinates"
          git pull --rebase origin main
          git push origin HEAD:main
