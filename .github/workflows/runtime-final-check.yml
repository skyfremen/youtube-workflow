name: Runtime Final Check
run-name: Dispatch final sanitized acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/runtime-final-check.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch public check
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLIC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/check.yml/dispatches \
            --data '{"ref":"main"}'
          echo "Public check dispatch PASS"
