name: Automatic Recovery

env:
  PYTHONPATH: youtube-shorts-bot
  RECOVERY_ACTIVE_GRACE_MINUTES: '210'
  RECOVERY_SCHEDULE_BUFFER_MINUTES: '10'
  RECOVERY_MAX_AUTOMATIC_ATTEMPTS: '3'
  RECOVERY_BACKOFF_MINUTES: '0,120,240'

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/diagnostics/**/*.json'
  workflow_run:
    workflows: ['Daily Production', 'Ad-hoc Production']
    types: [completed]
  schedule:
    # Reconciliation backstop: every 2 hours at minute 17 UTC.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Reconcile only, or write/dispatch safe recovery work
        required: false
        default: plan
        type: choice
        options:
          - plan
          - execute

concurrency:
  group: private-automatic-recovery-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.conclusion != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Load canonical private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reconcile recovery state
        id: recovery
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          FAILED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main

          mode="execute"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${MANUAL_MODE:-plan}"
          fi

          args=(--output /tmp/recovery-plan.json)
          if [ "${mode}" = "execute" ]; then
            args+=(--write)
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ -n "${FAILED_SOURCE_SHA:-}" ]; then
            args+=(--failed-source-sha "${FAILED_SOURCE_SHA}")
          fi

          python youtube-shorts-bot/recovery/controller.py "${args[@]}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

          python - <<'PY'
          import json
          import os

          data = json.load(open('/tmp/recovery-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"dispatch={'true' if data['dispatch'] else 'false'}\n")
              output.write(f"batch_id={data.get('batch_id') or ''}\n")
              output.write(f"item_count={data['item_count']}\n")
          PY

      - name: Persist recovery decision
        if: ${{ steps.recovery.outputs.mode == 'execute' }}
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/content/recovery/batches/
          if [ -d youtube-shorts-bot/content/recovery/terminal ]; then
            git add youtube-shorts-bot/content/recovery/terminal/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[skip upload] record automatic recovery state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve compatibility contract
        if: >-
          ${{ steps.recovery.outputs.mode == 'execute' &&
              steps.recovery.outputs.dispatch == 'true' }}
        id: contract
        working-directory: youtube-shorts-bot
        shell: bash
        run: |
          set -euo pipefail
          contract_hash="$(python -m common.runtime_contract)"
          if [[ ! "${contract_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid compatibility fingerprint"
            exit 1
          fi
          echo "contract_hash=${contract_hash}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch canonical recovery batch
        if: >-
          ${{ steps.recovery.outputs.mode == 'execute' &&
              steps.recovery.outputs.dispatch == 'true' }}
        env:
          PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
          BATCH_ID: ${{ steps.recovery.outputs.batch_id }}
          SOURCE_SHA: ${{ steps.persist.outputs.source_sha }}
          CONTRACT_HASH: ${{ steps.contract.outputs.contract_hash }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${BATCH_ID}" =~ ^r_[0-9a-f]{30}$ ]]; then
            echo "::error::Automatic recovery batch identity is invalid"
            exit 1
          fi
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'batch_id': os.environ['BATCH_ID'],
                  'source_sha': os.environ['SOURCE_SHA'],
                  'contract_hash': os.environ['CONTRACT_HASH'],
              },
          }, separators=(',', ':')))
          PY
          )"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PUBLIC_PRODUCTION_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/run.yml/dispatches \
            -d "${payload}"
          echo "Automatic recovery batch dispatched: items=${{ steps.recovery.outputs.item_count }}"
