name: Automatic Recovery

env:
  PYTHONPATH: youtube-shorts-bot
  RECOVERY_ACTIVE_GRACE_MINUTES: '240'
  RECOVERY_STARTUP_GRACE_MINUTES: '25'
  RECOVERY_SCHEDULE_BUFFER_MINUTES: '10'
  RECOVERY_MAX_AUTOMATIC_ATTEMPTS: '3'
  RECOVERY_BACKOFF_MINUTES: '0,5,120'

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/diagnostics/**/*.json'
      - '.github/workflows/automatic-recovery.yml'
  workflow_run:
    workflows: ['Daily Production', 'Ad-hoc Production']
    types: [completed]
  schedule:
    # Previous cadence retained as an audit marker: cron: '17 */2 * * *'
    # Lightweight reconciliation every 30 minutes; STARTED batches retain the 240-minute grace.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Reconcile only, or write/dispatch safe recovery work
        required: false
        default: plan
        type: choice
        options:
          - plan
          - execute

concurrency:
  group: private-automatic-recovery-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.conclusion != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Load canonical private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reconcile recovery state
        id: recovery
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          FAILED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main

          mode="execute"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${MANUAL_MODE:-plan}"
          fi

          args=(--output /tmp/recovery-plan.json)
          if [ "${mode}" = "execute" ]; then
            args+=(--write)
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ -n "${FAILED_SOURCE_SHA:-}" ]; then
            args+=(--failed-source-sha "${FAILED_SOURCE_SHA}")
          fi

          python youtube-shorts-bot/recovery/controller.py "${args[@]}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

          python - <<'PY'
          import json
          import os

          data = json.load(open('/tmp/recovery-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"dispatch={'true' if data['dispatch'] else 'false'}\n")
              output.write(f"dispatch_mode={data.get('dispatch_mode') or ''}\n")
              output.write(f"batch_id={data.get('batch_id') or ''}\n")
              output.write(f"dispatch_source_sha={data.get('dispatch_source_sha') or ''}\n")
              output.write(f"dispatch_contract_hash={data.get('dispatch_contract_hash') or ''}\n")
              output.write(f"item_count={data['item_count']}\n")
          PY

      - name: Persist recovery decision
        if: ${{ steps.recovery.outputs.mode == 'execute' }}
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d youtube-shorts-bot/content/recovery/batches ]; then
            git add youtube-shorts-bot/content/recovery/batches/
          fi
          if [ -d youtube-shorts-bot/content/recovery/terminal ]; then
            git add youtube-shorts-bot/content/recovery/terminal/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[skip upload] record automatic recovery state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve compatibility contract
        if: >-
          ${{ steps.recovery.outputs.mode == 'execute' &&
              steps.recovery.outputs.dispatch == 'true' &&
              steps.recovery.outputs.dispatch_mode != 'same_batch' }}
        id: contract
        working-directory: youtube-shorts-bot
        shell: bash
        run: |
          set -euo pipefail
          contract_hash="$(python -m common.runtime_contract)"
          if [[ ! "${contract_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid compatibility fingerprint"
            exit 1
          fi
          echo "contract_hash=${contract_hash}" >> "${GITHUB_OUTPUT}"

      - name: Resolve exact dispatch identity
        if: >-
          ${{ steps.recovery.outputs.mode == 'execute' &&
              steps.recovery.outputs.dispatch == 'true' }}
        id: identity
        env:
          DISPATCH_MODE: ${{ steps.recovery.outputs.dispatch_mode }}
          SAME_SOURCE_SHA: ${{ steps.recovery.outputs.dispatch_source_sha }}
          SAME_CONTRACT_HASH: ${{ steps.recovery.outputs.dispatch_contract_hash }}
          NEW_SOURCE_SHA: ${{ steps.persist.outputs.source_sha }}
          NEW_CONTRACT_HASH: ${{ steps.contract.outputs.contract_hash }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DISPATCH_MODE}" = "same_batch" ]; then
            source_sha="${SAME_SOURCE_SHA}"
            contract_hash="${SAME_CONTRACT_HASH}"
            dispatch_kind="no-start-retry"
          else
            source_sha="${NEW_SOURCE_SHA}"
            contract_hash="${NEW_CONTRACT_HASH}"
            dispatch_kind="automatic"
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || [[ ! "${contract_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Automatic recovery dispatch identity is invalid"
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "contract_hash=${contract_hash}" >> "${GITHUB_OUTPUT}"
          echo "dispatch_kind=${dispatch_kind}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch canonical recovery batch
        if: >-
          ${{ steps.recovery.outputs.mode == 'execute' &&
              steps.recovery.outputs.dispatch == 'true' }}
        env:
          PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
          BATCH_ID: ${{ steps.recovery.outputs.batch_id }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          CONTRACT_HASH: ${{ steps.identity.outputs.contract_hash }}
          DISPATCH_KIND: ${{ steps.identity.outputs.dispatch_kind }}
          PRIVATE_RUN_ID: ${{ github.run_id }}
          PRIVATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${BATCH_ID}" =~ ^[br]_[0-9a-f]{30}$ ]]; then
            echo "::error::Automatic recovery batch identity is invalid"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist_evidence() {
            for path in \
              youtube-shorts-bot/content/recovery/dispatch-intents \
              youtube-shorts-bot/content/recovery/dispatches \
              youtube-shorts-bot/content/recovery/dispatch-failures; do
              if [ -d "${path}" ]; then
                git add "${path}"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "[skip upload] record automatic dispatch evidence"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          dispatch_id="$(python youtube-shorts-bot/recovery/evidence.py prepare \
            --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
            --contract-hash "${CONTRACT_HASH}" --dispatch-kind "${DISPATCH_KIND}" \
            --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}")"
          persist_evidence

          payload="$(DISPATCH_ID="${dispatch_id}" python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'batch_id': os.environ['BATCH_ID'],
                  'source_sha': os.environ['SOURCE_SHA'],
                  'contract_hash': os.environ['CONTRACT_HASH'],
                  'dispatch_id': os.environ['DISPATCH_ID'],
              },
          }, separators=(',', ':')))
          PY
          )"
          if ! curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PUBLIC_PRODUCTION_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/run.yml/dispatches \
            -d "${payload}"; then
            python youtube-shorts-bot/recovery/evidence.py fail \
              --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
              --contract-hash "${CONTRACT_HASH}" --dispatch-kind "${DISPATCH_KIND}" \
              --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}" \
              --dispatch-id "${dispatch_id}"
            persist_evidence
            exit 1
          fi

          python youtube-shorts-bot/recovery/evidence.py accept \
            --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
            --contract-hash "${CONTRACT_HASH}" --dispatch-kind "${DISPATCH_KIND}" \
            --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}" \
            --dispatch-id "${dispatch_id}"
          persist_evidence
          echo "Automatic recovery batch dispatched: items=${{ steps.recovery.outputs.item_count }}"
