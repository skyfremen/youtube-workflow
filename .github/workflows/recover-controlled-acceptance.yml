name: Recover Controlled Acceptance
run-name: Confirm idempotent recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-controlled-acceptance.yml]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact recovery rerun
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLIC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/run.yml/dispatches \
            --data '{"ref":"main","inputs":{"batch_id":"b_691e2ab7264133d1ca07995ca49b7e","source_sha":"ba7bc60c50f47c2f820be67ababb1cfaea6ddfd1"}}'
          echo "Idempotent recovery dispatched"
