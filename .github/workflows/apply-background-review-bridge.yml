                        Path(tmp) / 'evidence',
                        include_motion_evidence=True,
                        contact_sheets_only=True,
                    )

        self.assertTrue(result['contact_sheets_only'])
        self.assertFalse(result['motion_sample_requested'])
        self.assertEqual(result['motion_evidence_count'], 1)

