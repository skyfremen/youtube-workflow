name: Apply Background Review Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-background-review-bridge.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply patch
        run: python tools/apply_background_review_bridge.py

      - name: Validate changed surfaces
        shell: bash
        env:
          PYTHONPATH: youtube-shorts-bot
        run: |
          set -euo pipefail
          python -m py_compile \
            youtube-shorts-bot/media/preview_review_materializer.py \
            youtube-shorts-bot/media/pexels_discovery.py \
            youtube-shorts-bot/tests/test_background_review_transport.py \
            youtube-shorts-bot/tests/test_pexels_discovery.py
          python -m unittest discover -s youtube-shorts-bot/tests -p 'test_background_review_transport.py' -v
          python - <<'PY'
          from media import pexels_discovery as d
          video = {
              'id': 1, 'duration': 90, 'width': 3840, 'height': 2160,
              'url': 'https://www.pexels.com/video/example-1/',
              'image': 'https://images.pexels.com/videos/1/preview.jpg',
              'user': {'name': 'Tester'},
              'video_files': [
                  {'id': 11, 'width': 640, 'height': 360, 'fps': 30, 'file_type': 'video/mp4', 'quality': 'sd', 'link': 'https://videos.pexels.com/video-files/1/small.mp4'},
                  {'id': 12, 'width': 3840, 'height': 2160, 'fps': 30, 'file_type': 'video/mp4', 'quality': 'uhd', 'link': 'https://videos.pexels.com/video-files/1/large.mp4'},
              ],
          }
          candidate = d._eligible_candidate(video, 'city_motion', 'city traffic')
          assert candidate['preview_video_width'] == 640
          assert candidate['preview_video_height'] == 360
          assert candidate['production_suitable_rendition_count'] == 1
          print('Low-bandwidth exact review rendition PASS')
          PY

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          # The job token cannot update workflow files. The connected GitHub tool
          # applies background-management.yml separately after this validated commit.
          git checkout HEAD -- .github/workflows/background-management.yml
          git config user.name skyfremen
          git config user.email skyfremen@me.com
          git add \
            docs/private/PLANNER_PROMPT.md \
            youtube-shorts-bot/docs/background-media-strategy.md \
            youtube-shorts-bot/media/preview_review_materializer.py \
            youtube-shorts-bot/media/pexels_discovery.py \
            youtube-shorts-bot/planning/ADHOC_PLANNER_PROMPT.md \
            youtube-shorts-bot/planning/DAILY_PLANNER_PROMPT.md \
            youtube-shorts-bot/tests/test_background_review_transport.py \
            youtube-shorts-bot/tests/test_pexels_discovery.py
          git commit -m '[media review] add artifact review transport contract'
          git pull --rebase origin main
          git push origin HEAD:main
