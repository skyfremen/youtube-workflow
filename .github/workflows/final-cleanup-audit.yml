name: Final Cleanup Audit

on:
  push:
    branches: ['cleanup/schema-v3-only']
    paths:
      - '.github/workflows/final-cleanup-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/schema-v3-only
          fetch-depth: 0

      - name: Apply proven cleanup and scan repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          ROOT = Path('.')
          BOT = Path('youtube-shorts-bot')

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected cleanup target not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Planning: one canonical analytics input and no unused strategy knobs.
          replace(
              'youtube-shorts-bot/planning_config.py',
              'QUALIFIED_TARGET = 60\n',
              '',
          )
          replace(
              'youtube-shorts-bot/planning_config.py',
              '# Candidate analytics enters planning only through the normalized historical\n# attribute-fit score produced by analytics_learning.py.\nPERFORMANCE_WEIGHTS = {"historical_attribute_fit": 100}\n\n',
              '# Candidate analytics enters planning only through the normalized historical\n# attribute-fit score produced by analytics_learning.py.\n\n',
          )
          replace(
              'youtube-shorts-bot/planning_config.py',
              'SOFT_SIMILARITY_THRESHOLD = 0.62\n',
              '',
          )
          replace(
              'youtube-shorts-bot/planning_engine.py',
              '    MIN_TITLE_SCORE, NEAR_DUPLICATE_THRESHOLD, PERFORMANCE_WEIGHTS,\n',
              '    MIN_TITLE_SCORE, NEAR_DUPLICATE_THRESHOLD,\n',
          )

          # Caption alignment: the only active source rate is derived from audio input.
          replace(
              'youtube-shorts-bot/caption_alignment.py',
              'SOURCE_SAMPLE_RATE = 24000\n',
              '',
          )

          # Shared paths/helpers no longer used by the daily-only architecture.
          replace(
              'youtube-shorts-bot/workflow_common.py',
              'PLANNING_DIR = BASE / "content" / "planning"\n',
              '',
          )
          replace(
              'youtube-shorts-bot/workflow_common.py',
              '''\ndef result_path_for_id(content_id):\n    validate_content_id(content_id)\n    return RESULTS_DIR / f"{content_id}.json"\n''',
              '',
          )

          # Remove duplicate timing alias. Keep the real ONNX and PyTorch fallback
          # init timings, which are distinct and may legitimately be zero.
          replace(
              'youtube-shorts-bot/render.py',
              '        "kokoro_pipeline_init_duration_seconds": pytorch_fallback_init_duration_seconds,\n',
              '',
          )
          replace(
              'youtube-shorts-bot/finalize_receipt.py',
              '            "kokoro_pipeline_init_duration_seconds": render_meta.get(\n                "kokoro_pipeline_init_duration_seconds"\n            ),\n',
              '',
          )
          replace(
              'youtube-shorts-bot/tests/test_result_receipt.py',
              '                "kokoro_pipeline_init_duration_seconds": 1.2,\n',
              '',
          )

          # Describe the live architecture positively instead of carrying migration history.
          replace(
              'README.md',
              'The dry-run workflow also asserts that retired Wacky Insights, queue, music, story-bot, long-form, backup, migration, stale pre-refactor naming, and removed one-off production entry points do not reappear in active files.',
              'The dry-run workflow also asserts the exact supported workflow and planner surface and prevents retired project roots or removed production entry points from reappearing.',
          )
          replace(
              'youtube-shorts-bot/SYSTEM_OVERVIEW.md',
              'The schedule is bound to the same immutable request bytes and source commit as the story. A missing or non-scheduled publication contract is invalid; there is no unscheduled or immediate-public production fallback.',
              'The schedule is bound to the same immutable request bytes and source commit as the story. Production requires a complete scheduled publication contract.',
          )
          replace(
              'youtube-shorts-bot/SYSTEM_OVERVIEW.md',
              'The production render writes inline black-detection evidence during the render pass. `verify_render.py` requires that evidence and fails closed if it is missing or failed. It does not run a compatibility full-video black-detection pass.',
              'The production render writes inline black-detection evidence during the render pass. `verify_render.py` requires that evidence and fails closed if it is missing or failed.',
          )

          # Report only candidates that can indicate actual dead code or retired architecture.
          text_paths = [
              *BOT.glob('*.py'),
              *(BOT / 'tests').glob('*.py'),
              *(BOT / 'planner').glob('*.md'),
              *BOT.glob('*.md'),
              Path('README.md'),
          ]
          corpus = '\n'.join(p.read_text(encoding='utf-8') for p in text_paths if p.exists())
          candidates = []

          for path in sorted(BOT.glob('*.py')):
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              used = {n.id for n in ast.walk(tree) if isinstance(n, ast.Name)}
              for node in tree.body:
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      if isinstance(node, ast.ImportFrom) and node.module == '__future__':
                          continue
                      for alias in node.names:
                          local = alias.asname or alias.name.split('.')[0]
                          if local not in used:
                              candidates.append(f'UNUSED_IMPORT {path}:{node.lineno} {local}')
                  elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      refs = len(re.findall(rf'\b{re.escape(node.name)}\b', corpus))
                      if refs <= 1:
                          candidates.append(f'ORPHAN_SYMBOL {path}:{node.lineno} {node.name} refs={refs}')
                  elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Name) and target.id.isupper():
                              refs = len(re.findall(rf'\b{re.escape(target.id)}\b', corpus))
                              if refs <= 1:
                                  candidates.append(f'ORPHAN_CONSTANT {path}:{node.lineno} {target.id} refs={refs}')

          stale_patterns = {
              'BACKWARD_COMPAT': r'backward[- ]compat',
              'MIGRATION_TERM': r'\bmigration\b',
              'FRESH_START_TERM': r'fresh-start|fresh start',
              'ADHOC_TERM': r'\bad[- ]hoc\b|\badhoc\b',
              'TODO': r'\bTODO\b|\bFIXME\b',
              'SCHEMA_V2': r'schema[_ -]?version[^\n]{0,25}\b2\b|schema-v2',
              'REMOVED_METRIC_ALIAS': r'kokoro_pipeline_init_duration_seconds',
              'REMOVED_ANALYTICS_WEIGHTS': r'PERFORMANCE_WEIGHTS',
          }
          for path in text_paths:
              if not path.exists():
                  continue
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  for name, pattern in stale_patterns.items():
                      if re.search(pattern, line, flags=re.I):
                          candidates.append(f'{name} {path}:{line_no} {line.strip()}')

          print('FINAL_CLEANUP_CANDIDATES_BEGIN')
          if candidates:
              for item in sorted(set(candidates)):
                  print(item)
          else:
              print('NONE')
          print('FINAL_CLEANUP_CANDIDATES_END')
          PY

          git diff --check
          python -m py_compile youtube-shorts-bot/*.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md youtube-shorts-bot
          if ! git diff --cached --quiet; then
            git commit -m "cleanup: remove final dead aliases"
            git push origin HEAD:cleanup/schema-v3-only
          fi
