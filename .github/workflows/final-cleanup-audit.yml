name: Final Cleanup Audit

on:
  push:
    branches: ['cleanup/schema-v3-only']
    paths:
      - '.github/workflows/final-cleanup-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/schema-v3-only
          fetch-depth: 0

      - name: Remove final proven aliases and scan repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          ROOT = Path('.')
          BOT = Path('youtube-shorts-bot')

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected cleanup target not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # One canonical analytics input; the old weights map is now definition-only.
          replace(
              'youtube-shorts-bot/planning_config.py',
              '# Candidate analytics enters planning only through the normalized historical\n# attribute-fit score produced by analytics_learning.py.\nPERFORMANCE_WEIGHTS = {"historical_attribute_fit": 100}\n\n',
              '# Candidate analytics enters planning only through the normalized historical\n# attribute-fit score produced by analytics_learning.py.\n\n',
          )
          replace(
              'youtube-shorts-bot/planning_engine.py',
              '    MIN_TITLE_SCORE, NEAR_DUPLICATE_THRESHOLD, PERFORMANCE_WEIGHTS,\n',
              '    MIN_TITLE_SCORE, NEAR_DUPLICATE_THRESHOLD,\n',
          )

          # This was a duplicate alias of pytorch_fallback_init_duration_seconds and
          # therefore misleadingly stayed at 0 on the normal ONNX path.
          replace(
              'youtube-shorts-bot/render.py',
              '        "kokoro_pipeline_init_duration_seconds": pytorch_fallback_init_duration_seconds,\n',
              '',
          )
          replace(
              'youtube-shorts-bot/finalize_receipt.py',
              '            "kokoro_pipeline_init_duration_seconds": render_meta.get(\n                "kokoro_pipeline_init_duration_seconds"\n            ),\n',
              '',
          )

          # Current-language cleanup only; no behavior change.
          replace(
              '.github/workflows/analytics-collection.yml',
              '- name: Collect fresh-start age-matched video analytics',
              '- name: Collect age-matched video analytics',
          )
          replace(
              '.github/workflows/daily-production.yml',
              'Request-to-background compatibility is per-video below.',
              'Request-to-background validity is per-video below.',
          )
          replace(
              '.github/workflows/daily-production.yml',
              'background IDs/status/rendition compatibility is',
              'background IDs/status/rendition validity is',
          )

          git_text_paths = [
              *BOT.glob('*.py'),
              *(BOT / 'tests').glob('*.py'),
              *(BOT / 'planner').glob('*.md'),
              *BOT.glob('*.md'),
              *(ROOT / '.github' / 'workflows').glob('*.yml'),
              Path('README.md'),
          ]
          text_paths = [p for p in git_text_paths if p.exists() and p.name != 'final-cleanup-audit.yml']
          corpus = '\n'.join(p.read_text(encoding='utf-8') for p in text_paths)

          candidates = []
          for path in sorted(BOT.glob('*.py')):
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              used = {n.id for n in ast.walk(tree) if isinstance(n, ast.Name)}
              for node in tree.body:
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      if isinstance(node, ast.ImportFrom) and node.module == '__future__':
                          continue
                      for alias in node.names:
                          local = alias.asname or alias.name.split('.')[0]
                          if local not in used:
                              candidates.append(f'UNUSED_IMPORT {path}:{node.lineno} {local}')
                  elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      refs = len(re.findall(rf'\b{re.escape(node.name)}\b', corpus))
                      if refs <= 1:
                          candidates.append(f'ORPHAN_SYMBOL {path}:{node.lineno} {node.name} refs={refs}')
                  elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Name) and target.id.isupper():
                              refs = len(re.findall(rf'\b{re.escape(target.id)}\b', corpus))
                              if refs <= 1:
                                  candidates.append(f'ORPHAN_CONSTANT {path}:{node.lineno} {target.id} refs={refs}')

              # Detect two output keys in the same literal dict carrying exactly the
              # same expression. This catches accidental metric aliases.
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Dict):
                      continue
                  seen = {}
                  for key, value in zip(node.keys, node.values):
                      if not isinstance(key, ast.Constant) or not isinstance(key.value, str):
                          continue
                      expr = ast.dump(value, include_attributes=False)
                      if expr in seen and key.value != seen[expr]:
                          candidates.append(
                              f'DUPLICATE_VALUE_EXPR {path}:{getattr(node, "lineno", 0)} '
                              f'{seen[expr]} == {key.value}'
                          )
                      else:
                          seen[expr] = key.value

          stale_patterns = {
              'BACKWARD_COMPAT': r'backward[- ]compat',
              'LEGACY_TERM': r'\blegacy\b',
              'MIGRATION_TERM': r'\bmigration\b',
              'FRESH_START_TERM': r'fresh-start|fresh start',
              'ADHOC_TERM': r'\bad[- ]hoc\b|\badhoc\b',
              'UNSCHEDULED_TERM': r'\bunscheduled\b',
              'TODO': r'\bTODO\b|\bFIXME\b',
              'SCHEMA_V2': r'schema[_ -]?version[^\n]{0,25}\b2\b|schema-v2',
              'OLD_METRIC_ALIAS': r'kokoro_pipeline_init_duration_seconds',
              'OLD_ANALYTICS_WEIGHTS': r'PERFORMANCE_WEIGHTS',
          }
          for path in text_paths:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  for name, pattern in stale_patterns.items():
                      if re.search(pattern, line, flags=re.I):
                          candidates.append(f'{name} {path}:{line_no} {line.strip()}')

          print('FINAL_CLEANUP_CANDIDATES_BEGIN')
          if candidates:
              for item in sorted(set(candidates)):
                  print(item)
          else:
              print('NONE')
          print('FINAL_CLEANUP_CANDIDATES_END')
          PY

          git diff --check
          python -m py_compile youtube-shorts-bot/*.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot .github/workflows/analytics-collection.yml .github/workflows/daily-production.yml
          if ! git diff --cached --quiet; then
            git commit -m "cleanup: remove final dead aliases"
            git push origin HEAD:cleanup/schema-v3-only
          fi
