name: Wacky Dramas Story Bot Test

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Build Story runner image'
    types:
      - completed
  push:
    paths:
      - 'youtube-story-bot/render.py'
      - 'youtube-story-bot/validate_content.py'
      - 'youtube-story-bot/content/**'
      - 'youtube-story-bot/assets/**'

permissions:
  contents: read
  packages: read

jobs:
  render-test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-story-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate test story
        run: python youtube-story-bot/validate_content.py

      - name: Render Kokoro story test
        run: python youtube-story-bot/render.py

      - name: Verify narration-driven duration
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base = Path('youtube-story-bot')
          planned = float(json.loads((base / 'content/latest.json').read_text())['duration_seconds'])
          video = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',
              str(base / 'output/short.mp4')
          ], text=True).strip())
          narration = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',
              str(base / 'output/narration.wav')
          ], text=True).strip())
          expected = min(planned, narration + 0.35)
          assert abs(video - expected) <= 0.20, (video, narration, expected)
          assert video <= planned + 0.10, (video, planned)
          print(f'Verified video={video:.3f}s narration={narration:.3f}s expected={expected:.3f}s')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wacky-dramas-10s-test
          path: |
            youtube-story-bot/output/short.mp4
            youtube-story-bot/output/story-card.png
            youtube-story-bot/output/branding.png
            youtube-story-bot/output/captions.ass
            youtube-story-bot/output/narration.wav
          retention-days: 7
