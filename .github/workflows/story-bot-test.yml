name: Wacky Dramas Story Bot Test

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Build Story runner image'
    types:
      - completed
  push:
    paths:
      - 'youtube-story-bot/render.py'
      - 'youtube-story-bot/validate_content.py'
      - 'youtube-story-bot/content/**'
      - 'youtube-story-bot/assets/**'

permissions:
  contents: read
  packages: read

jobs:
  render-test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-story-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate test story
        run: python youtube-story-bot/validate_content.py

      - name: Render 10-second Kokoro test
        run: python youtube-story-bot/render.py

      - name: Verify duration
        run: |
          python - <<'PY'
          import subprocess
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','youtube-story-bot/output/short.mp4'], text=True).strip())
          assert 9.85 <= d <= 10.15, d
          print(f'Verified duration: {d:.3f}s')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wacky-dramas-10s-test
          path: |
            youtube-story-bot/output/short.mp4
            youtube-story-bot/output/story-card.png
            youtube-story-bot/output/branding.png
            youtube-story-bot/output/captions.ass
          retention-days: 7
