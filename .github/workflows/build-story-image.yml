name: Build Story runner image

on:
  push:
    paths:
      - 'youtube-story-bot/Dockerfile'
      - 'youtube-story-bot/requirements.txt'
      - '.github/workflows/build-story-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push story runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: youtube-story-bot/Dockerfile
          push: true
          tags: |
            ghcr.io/skyfremen/youtube-story-runner:latest
            ghcr.io/skyfremen/youtube-story-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
