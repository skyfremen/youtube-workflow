name: Runtime Finalization
run-name: Dispatch cleaned public acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/runtime-finalize.yml

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch public acceptance
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLIC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/check.yml/dispatches \
            --data '{"ref":"main"}'
          echo "Public acceptance dispatch PASS"
      - name: Remove obsolete migration runs
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
        run: |
          for run_id in 34508861955 34509147225 34509679090 34509874077 34510113716 34510307422; do
            if curl --fail --silent --show-error --output /dev/null --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${PUBLIC_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/skyfremen/production-runtime/actions/runs/${run_id}"; then
              echo "Migration run cleanup PASS"
            else
              echo "::warning::Migration run cleanup unavailable"
            fi
          done
