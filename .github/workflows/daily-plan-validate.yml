name: Validate daily Shorts plan

on:
  push:
    paths:
      - 'youtube-shorts-bot/content/plans/*.json'
      - 'youtube-shorts-bot/content/validation-triggers/*.txt'
  workflow_dispatch:
    inputs:
      plan_date:
        description: 'Singapore plan date to validate (YYYY-MM-DD). Leave blank for tomorrow.'
        required: false
        type: string

jobs:
  validate-plan:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip upload]') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mark repository safe for container Git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve exact plan date from triggering change
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.plan_date }}" ]; then
              plan_date="${{ github.event.inputs.plan_date }}"
            else
              plan_date="$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          print((datetime.now(ZoneInfo('Asia/Singapore')).date() + timedelta(days=1)).isoformat())
          PY
          )"
            fi
          else
            mapfile -t changed_plans < <(git show --pretty='' --name-only "${GITHUB_SHA}" -- 'youtube-shorts-bot/content/plans/*.json' | sed '/^$/d')
            mapfile -t validation_triggers < <(git show --pretty='' --name-only "${GITHUB_SHA}" -- 'youtube-shorts-bot/content/validation-triggers/*.txt' | sed '/^$/d')
            if [ "${#changed_plans[@]}" -eq 1 ] && [ "${#validation_triggers[@]}" -eq 0 ]; then
              plan_file="${changed_plans[0]}"
              plan_date="$(basename "${plan_file}" .json)"
            elif [ "${#changed_plans[@]}" -eq 0 ] && [ "${#validation_triggers[@]}" -eq 1 ]; then
              trigger_file="${validation_triggers[0]}"
              plan_date="$(basename "${trigger_file}" .txt)"
            else
              echo "::error::Expected exactly one changed daily plan or one validation trigger in this commit; found ${#changed_plans[@]} plan files and ${#validation_triggers[@]} triggers."
              exit 1
            fi
          fi

          if [[ ! "${plan_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Resolved invalid plan date: ${plan_date}"
            exit 1
          fi
          echo "plan_date=${plan_date}" >> "$GITHUB_OUTPUT"
          echo "Validating exact Singapore plan date ${plan_date}."

      - name: Validate exact daily plan
        run: |
          python youtube-shorts-bot/queue_manager.py validate --date "${{ steps.plan.outputs.plan_date }}"
          python youtube-shorts-bot/validate_backup_metadata.py --date "${{ steps.plan.outputs.plan_date }}"

      - name: Validate reusable media cache
        run: python youtube-shorts-bot/validate_media_library.py
