name: Validate daily Shorts plan

on:
  push:
    paths:
      - 'youtube-shorts-bot/content/plans/*.json'
  workflow_dispatch:

jobs:
  validate-plan:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip upload]') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Singapore-date plan
        run: |
          plan_date="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Singapore')).date().isoformat())
          PY
          )"
          python youtube-shorts-bot/queue_manager.py validate --date "${plan_date}"
          python youtube-shorts-bot/validate_backup_metadata.py --date "${plan_date}"
