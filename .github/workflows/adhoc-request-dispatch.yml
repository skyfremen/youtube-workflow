name: Ad-hoc Request Dispatch

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/requests/wd-*-adhoc-*.json'

concurrency:
  group: adhoc-request-dispatch-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ contains(github.event.head_commit.message, '[adhoc production]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exactly one new ad-hoc request
        id: request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Resolve content identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | awk '$1 == "A" && $2 ~ /^youtube-shorts-bot\/content\/requests\/wd-[A-Za-z0-9-]*-adhoc-[A-Za-z0-9-]*\.json$/ {print $2}')
          if [ "${#paths[@]}" -ne 1 ]; then
            echo "::error::Ad-hoc production commit must add exactly one ad-hoc request"
            exit 1
          fi
          path="${paths[0]}"
          content_id="$(basename "${path}" .json)"
          python - "${path}" "${content_id}" <<'PY'
          import json, sys
          path, content_id = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          if data.get('content_id') != content_id:
              raise SystemExit('request filename/content_id mismatch')
          publication = data.get('publication') or {}
          if publication != {
              'mode': 'immediate',
              'timezone': 'Asia/Singapore',
              'publish_at': None,
          }:
              raise SystemExit('ad-hoc request is not immediate-public')
          PY
          echo "content_id=${content_id}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch private ad-hoc production
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ID: ${{ steps.identity.outputs.content_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {'content_id': os.environ['CONTENT_ID']},
          }, separators=(',', ':')))
          PY
          )"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/adhoc-production.yml/dispatches \
            -d "${payload}"
          echo "Dispatched private Ad-hoc Production for ${CONTENT_ID}."
