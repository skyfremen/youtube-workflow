name: One-off Shorts Timing Buffer Migration

on:
  push:
    paths:
      - '.github/workflows/oneoff-timing-buffer-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply timing buffer migration
        shell: python
        run: |
          from pathlib import Path

          common = Path('youtube-shorts-bot/workflow_common.py')
          text = common.read_text()
          replacements = {
              'PRODUCTION_MAX_SECONDS = 178.0\n': 'PRODUCTION_MAX_SECONDS = 179.0  # hard YouTube Shorts ceiling: 2:59\n',
              'PRODUCTION_TARGET_MAX_SECONDS = 175.0\n': 'PRODUCTION_TARGET_MAX_SECONDS = 170.0  # preserve headroom for TTS variance and timing buffers\n',
              'END_TAIL_SECONDS = 0.35\n': 'START_LEAD_SECONDS = 0.50\nEND_TAIL_SECONDS = 0.50\nPRODUCTION_ENCODE_SAFETY_SECONDS = 0.10\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected workflow_common snippet: {old!r}')
              text = text.replace(old, new, 1)
          common.write_text(text)

          render = Path('youtube-shorts-bot/render.py')
          text = render.read_text()
          replacements = {
              '    END_TAIL_SECONDS, OUTPUT_DIR, PRODUCTION_MAX_SECONDS, atomic_write_json,\n':
                  '    END_TAIL_SECONDS, START_LEAD_SECONDS, PRODUCTION_ENCODE_SAFETY_SECONDS, OUTPUT_DIR,\n    PRODUCTION_MAX_SECONDS, atomic_write_json,\n',
              '    story_budget = test_max - intro_duration - CARD_TRANSITION_SECONDS if test_mode else None\n':
                  '    story_budget = test_max - START_LEAD_SECONDS - intro_duration - CARD_TRANSITION_SECONDS if test_mode else None\n',
              '    transition_samples = int(round(CARD_TRANSITION_SECONDS * 24000))\n    transition_audio = np.zeros(max(1, transition_samples), dtype=np.float32)\n    speech_audio = np.concatenate([intro_audio, transition_audio, story_audio])\n    story_start = intro_duration + CARD_TRANSITION_SECONDS\n':
                  '    lead_samples = int(round(START_LEAD_SECONDS * 24000))\n    lead_audio = np.zeros(max(1, lead_samples), dtype=np.float32)\n    transition_samples = int(round(CARD_TRANSITION_SECONDS * 24000))\n    transition_audio = np.zeros(max(1, transition_samples), dtype=np.float32)\n    speech_audio = np.concatenate([lead_audio, intro_audio, transition_audio, story_audio])\n    story_start = START_LEAD_SECONDS + intro_duration + CARD_TRANSITION_SECONDS\n',
              '    elif final_duration > PRODUCTION_MAX_SECONDS:\n':
                  '    elif final_duration > PRODUCTION_MAX_SECONDS - PRODUCTION_ENCODE_SAFETY_SECONDS:\n',
              '            f"Production duration {final_duration:.3f}s exceeds hard ceiling {PRODUCTION_MAX_SECONDS:.0f}s. "\n':
                  '            f"Production duration {final_duration:.3f}s exceeds safe render limit "\n            f"{PRODUCTION_MAX_SECONDS - PRODUCTION_ENCODE_SAFETY_SECONDS:.2f}s for the hard {PRODUCTION_MAX_SECONDS:.0f}s ceiling. "\n',
              '    card_fade_start = intro_duration\n':
                  '    card_fade_start = START_LEAD_SECONDS + intro_duration\n',
              '        "card_title_seconds": round(intro_duration, 6),\n':
                  '        "start_lead_seconds": START_LEAD_SECONDS,\n        "card_title_seconds": round(intro_duration, 6),\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected render snippet: {old!r}')
              text = text.replace(old, new, 1)
          render.write_text(text)

          # Static safety assertions: beginning/end are exactly 0.5s and the encoded file is independently hard-verified <=179s.
          common_text = common.read_text()
          render_text = render.read_text()
          verifier_text = Path('youtube-shorts-bot/verify_render.py').read_text()
          assert 'START_LEAD_SECONDS = 0.50' in common_text
          assert 'END_TAIL_SECONDS = 0.50' in common_text
          assert 'PRODUCTION_MAX_SECONDS = 179.0' in common_text
          assert 'PRODUCTION_ENCODE_SAFETY_SECONDS = 0.10' in common_text
          assert 'speech_audio = np.concatenate([lead_audio, intro_audio, transition_audio, story_audio])' in render_text
          assert 'card_fade_start = START_LEAD_SECONDS + intro_duration' in render_text
          assert 'elif duration > PRODUCTION_MAX_SECONDS:' in verifier_text
      - name: Compile changed Python
        run: python -m py_compile youtube-shorts-bot/render.py youtube-shorts-bot/workflow_common.py youtube-shorts-bot/verify_render.py
      - name: Run Shorts unit tests
        run: python -m unittest discover -s youtube-shorts-bot/tests -p 'test_*.py'
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-shorts-bot/render.py youtube-shorts-bot/workflow_common.py
          git diff --cached --check
          git commit -m 'feat: add 0.5s Shorts lead and end buffers'
          git push origin HEAD:main
