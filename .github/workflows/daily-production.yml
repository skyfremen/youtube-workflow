name: Daily Production

env:
  PYTHONPATH: youtube-shorts-bot

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/requests/*.json'
      - 'youtube-shorts-bot/content/planning/*.json'
      - 'youtube-shorts-bot/content/background-sourcing/*.json'
  workflow_dispatch:
    inputs:
      content_ids:
        description: Comma-separated immutable content IDs to recover/process
        required: true
        type: string

concurrency:
  group: wacky-dramas-youtube-upload
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  daily-production:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[daily production]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      VIDEO_WIDTH: '720'
      VIDEO_HEIGHT: '1280'
      VIDEO_FPS: '30'
      STORY_TEST_MODE: 'false'
      # Keep 1 until production-equivalent benchmark evidence supports promotion.
      # Supported bounded values are 1, 2, 3 and 4.
      SHORTS_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Start job telemetry
        shell: bash
        run: |
          python -c 'import time; print(f"{time.time():.6f}")' > /tmp/daily-job-started-at.txt
          echo "logical_cpu_count=$(nproc)"
          if command -v free >/dev/null 2>&1; then
            free -h
          else
            sed -n '1,5p' /proc/meminfo
          fi
          cat /proc/loadavg

      - name: Validate global batch integrity and shared dependencies
        id: batch
        shell: bash
        env:
          MANUAL_CONTENT_IDS: ${{ inputs.content_ids }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Analytics uses this tri-state result later. If production fails before
          # reaching YouTube, analytics may perform its own cheap preflight. A known
          # YouTube preflight failure is never repeated.
          echo "youtube_preflight_status=not_run" >> "$GITHUB_OUTPUT"

          # Canonical shared batch orchestration. Dry Run executes this same module
          # against a production-shaped 24-item fixture. It owns request discovery,
          # planning payload.get('content_ids') / payload.get('final_selected') checks,
          # sourcing-manifest integrity, deterministic ordering, and the
          # "Duplicate publication slot in daily batch" fail-closed contract.
          python youtube-shorts-bot/production/batch.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --source-sha "$GITHUB_SHA" \
            --manual-content-ids "${MANUAL_CONTENT_IDS:-}" \
            --request-output /tmp/batch-requests.txt \
            --sourcing-output /tmp/background-sourcing-manifests.txt

          # GLOBAL / LOCAL: the shared registry itself must be sound before any
          # external call. Request-to-background compatibility is per-video below.
          python youtube-shorts-bot/media/validate_media_library.py

          # GLOBAL / LOCAL: a sourcing batch cannot succeed without its shared key.
          if [ -s /tmp/background-sourcing-manifests.txt ] && [ -z "${PEXELS_API_KEY:-}" ]; then
            echo "::error title=Global failure::PEXELS_API_KEY is required because this batch contains new AI-sourced backgrounds."
            exit 1
          fi

          # GLOBAL / NETWORK: one read-only OAuth/Data API/channel readiness check
          # protects the entire batch before Pexels ingestion or any rendering.
          if python youtube-shorts-bot/publishing/auth_preflight.py; then
            echo "youtube_preflight_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "youtube_preflight_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # GLOBAL / SHARED STATE: source-manifest/cache ingestion is atomic shared
          # state. If it fails, do not render against an incomplete common registry.
          if [ -s /tmp/background-sourcing-manifests.txt ]; then
            while IFS= read -r manifest; do
              [ -n "$manifest" ] || continue
              python youtube-shorts-bot/media/pexels_registry.py ingest-manifest --manifest "$manifest"
            done < /tmp/background-sourcing-manifests.txt
            python youtube-shorts-bot/media/validate_media_library.py

            if ! git diff --quiet -- youtube-shorts-bot/media-library/backgrounds.json; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add youtube-shorts-bot/media-library/backgrounds.json
              git commit -m "cache AI-sourced Wacky Dramas backgrounds"
              # Fail closed on a concurrent cache update rather than silently losing
              # a source or rendering against an unpersisted library state.
              git push origin HEAD:main
            fi
          fi

          echo "Global batch preflight passed. Individual request failures will be isolated per video."

      - name: Process videos with isolated per-video failures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # The Python coordinator converts per-video failures into deterministic
          # batch evidence, so shell fail-fast remains safe for global failures.
          set -euo pipefail
          success=0

          epoch_seconds() {
            python -c 'import time; print(f"{time.time():.6f}")'
          }

          source_for_request() {
            local req="$1"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then echo "$GITHUB_SHA"; return; fi
            git log --diff-filter=A --format=%H -- "$req" | tail -1
          }

          set_request_context() {
            local req="$1"
            local cid
            cid="$(basename "$req" .json)"
            export SOURCE_COMMIT_SHA="$(source_for_request "$req")"
            export STORY_OUTPUT_DIR="youtube-shorts-bot/output/$cid"
          }

          verify_one() {
            set -euo pipefail
            local req="$1"
            local deferred_at="$2"
            local cid started_at completed_at
            cid="$(basename "$req" .json)"
            set_request_context "$req"
            started_at="$(epoch_seconds)"
            printf '%s\tverification_started\t%s\n' "$cid" "$started_at" >> /tmp/batch-pipeline-metrics.tsv
            python youtube-shorts-bot/publishing/verify_publication.py --request "$req"
            python youtube-shorts-bot/publishing/finalize_receipt.py --request "$req"
            completed_at="$(epoch_seconds)"
            printf '%s\tverification_completed\t%s\n' "$cid" "$completed_at" >> /tmp/batch-pipeline-metrics.tsv
            python - "$cid" "$deferred_at" "$started_at" "$completed_at" <<'PY'
          import sys
          cid, deferred_at, started_at, completed_at = sys.argv[1], *map(float, sys.argv[2:])
          print(
              f"PERF_METRIC content_id={cid} "
              f"youtube_processing_overlap_seconds={started_at - deferred_at:.3f} "
              f"verification_finalize_seconds={completed_at - started_at:.3f}"
          )
          PY
          }

          # Phase 1: the coordinator keeps validation/recovery authorization,
          # upload intent creation, YouTube insertion and GitHub writes serialized.
          # Only isolated media/TTS/alignment/render/verify work uses the bounded
          # internal worker pool. Uploads retain canonical request/schedule order.
          python youtube-shorts-bot/production/pipeline.py \
            --request-list /tmp/batch-requests.txt \
            --concurrency "${SHORTS_CONCURRENCY:-1}"

          read -r batch_started_at skipped failed < <(
            python - <<'PY'
          import json
          summary = json.load(open('/tmp/batch-production-summary.json'))
          print(summary['production_started_at'], summary['skipped'], summary['failed'])
          PY
          )

          verification_started_at="$(epoch_seconds)"
          printf -- '-\tverification_phase_started\t%s\n' "$verification_started_at" >> /tmp/batch-pipeline-metrics.tsv

          # Phase 2: every successfully uploaded or recovered request still receives
          # the identical bounded exact-state verification and immutable receipt.
          while IFS=$'\t' read -r req deferred_at; do
            [ -n "$req" ] || continue
            echo "::group::$(basename "$req" .json) — verification"
            if verify_one "$req" "$deferred_at"; then
              success=$((success+1))
              echo "Completed: $req"
            else
              rc=$?
              failed=$((failed+1))
              echo "$req | verification/finalization failure | exit_code=$rc" >> /tmp/batch-failures.txt
              echo "::error title=Per-video verification failure::Failed: $req — continuing remaining receipts; rerun recovery remains authoritative"
            fi
            echo "::endgroup::"
          done < /tmp/batch-pending-verification.txt

          batch_completed_at="$(epoch_seconds)"
          printf -- '-\tbatch_completed\t%s\n' "$batch_completed_at" >> /tmp/batch-pipeline-metrics.tsv
          python - "$batch_started_at" "$verification_started_at" "$batch_completed_at" <<'PY'
          import sys
          started, verification_started, completed = map(float, sys.argv[1:])
          print(
              f"PERF_METRIC production_phase_seconds={verification_started - started:.3f} "
              f"verification_phase_seconds={completed - verification_started:.3f} "
              f"batch_process_seconds={completed - started:.3f}"
          )
          PY

          echo "Batch complete: success=$success skipped=$skipped failed=$failed total=$((success+skipped+failed))"
          if [ "$skipped" -gt 0 ]; then
            echo "Schedule-skipped fresh requests (past or <=10 minutes remaining):"
            cat /tmp/batch-skipped.txt
          fi
          if [ "$failed" -gt 0 ]; then
            echo "Per-video failed requests (other valid Shorts were allowed to continue):"
            cat /tmp/batch-failures.txt
            # Surface partial failures after every processable upload and receipt had
            # a chance to complete. This keeps alerting visible without sacrificing
            # the day or weakening immutable recovery.
            exit 1
          fi

      - name: Preserve lightweight per-story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wacky-dramas-planning-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            youtube-shorts-bot/output/**/*.json
            /tmp/batch-failures.txt
            /tmp/batch-skipped.txt
            /tmp/batch-pipeline-metrics.tsv
            /tmp/batch-worker-metrics.tsv
            /tmp/batch-resource-metrics.tsv
            /tmp/batch-production-summary.json
            /tmp/wacky-dramas-workers/**/result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect analytics for next planning cycle
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRODUCTION_YOUTUBE_PREFLIGHT_STATUS: ${{ steps.batch.outputs.youtube_preflight_status }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ANALYTICS FAIL-FIRST 1: credentials are required. Do this before any
          # fetch, API call or analytics computation.
          missing_credentials=0
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::warning title=Analytics skipped::Missing required credential: $name"
              missing_credentials=1
            fi
          done
          if [ "$missing_credentials" -ne 0 ]; then
            exit 0
          fi

          # Decouple analytics from any partial production workspace state and pull
          # receipts/cache commits that may have been persisted during this run.
          git fetch origin main
          git reset --hard origin/main

          # ANALYTICS FAIL-FIRST 2: do not collect twice when the same Actions run
          # is rerun. GITHUB_RUN_ID is stable across run attempts.
          analytics_marker="[analytics run ${GITHUB_RUN_ID}]"
          if git log -1 --fixed-strings --grep="$analytics_marker" --format=%H -- youtube-shorts-bot/analytics/ | grep -q .; then
            echo "Analytics already collected for Actions run ${GITHUB_RUN_ID}; skipping duplicate collection."
            exit 0
          fi

          # ANALYTICS FAIL-FIRST 3: reuse the production YouTube preflight whenever
          # it passed. If production already proved auth broken, do not repeat the
          # same network call. If production failed before reaching auth, analytics
          # independently performs the cheap read-only preflight.
          case "${PRODUCTION_YOUTUBE_PREFLIGHT_STATUS:-not_run}" in
            passed)
              echo "Reusing successful production YouTube preflight for analytics."
              ;;
            failed)
              echo "::warning title=Analytics skipped::Production already proved YouTube authentication/readiness failed."
              exit 0
              ;;
            *)
              echo "Production did not reach YouTube preflight; checking analytics prerequisite independently."
              if ! python youtube-shorts-bot/publishing/auth_preflight.py; then
                echo "::warning title=Analytics skipped::Independent YouTube readiness preflight failed."
                exit 0
              fi
              ;;
          esac

          # ANALYTICS FAIL-FIRST 4: with no already-published canonical receipts
          # there is nothing useful to query or learn from yet.
          published_receipt_count="$(python - <<'PY'
          import sys
          sys.path.insert(0, 'youtube-shorts-bot')
          from analytics.analytics_collection import load_receipts, public_age_hours

          count = 0
          for receipt in load_receipts().values():
              age = public_age_hours(receipt)
              if age is not None and age >= 0:
                  count += 1
          print(count)
          PY
          )"
          if [ "$published_receipt_count" -eq 0 ]; then
            echo "No published canonical receipts are eligible for analytics; skipping API collection."
            exit 0
          fi
          echo "Analytics preflight found ${published_receipt_count} published canonical receipt(s)."

          python youtube-shorts-bot/analytics/analytics_collection.py

          # ANALYTICS FAIL-CLOSED: validate every planner-facing output before it
          # can replace the last known-good committed model.
          if ! python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sys.path.insert(0, 'youtube-shorts-bot')
          from analytics.analytics_learning import DIMENSION_WEIGHTS, MODEL_VERSION

          base = Path('youtube-shorts-bot/analytics')
          latest = json.loads((base / 'latest.json').read_text(encoding='utf-8'))
          model = json.loads((base / 'model.json').read_text(encoding='utf-8'))
          milestones = json.loads((base / 'milestones.json').read_text(encoding='utf-8'))

          if latest.get('analytics_model') != model:
              raise SystemExit('analytics/latest.json embedded model differs from model.json')

          captured_raw = str(latest.get('captured_at') or '')
          captured = datetime.fromisoformat(captured_raw.replace('Z', '+00:00'))
          if captured.tzinfo is None:
              raise SystemExit('analytics captured_at is not timezone-aware')
          if captured > datetime.now(timezone.utc):
              raise SystemExit('analytics captured_at is unexpectedly in the future')

          count_fields = (
              'result_receipt_video_count', 'video_count', 'published_video_count',
              'mature_video_count', 'analytics_evidence_count', 'analytics_evidence_views',
          )
          for key in count_fields:
              value = latest.get(key)
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit(f'invalid analytics count field: {key}={value!r}')
          if not isinstance(latest.get('videos'), list):
              raise SystemExit('analytics videos must be a list')

          if model.get('model_version') != MODEL_VERSION:
              raise SystemExit('unexpected analytics model version')
          if model.get('active_cohort') not in (None, '24h', '72h', '7d'):
              raise SystemExit('invalid active analytics cohort')
          if not isinstance(model.get('analytics_enabled'), bool):
              raise SystemExit('analytics_enabled must be boolean')
          if model.get('analytics_evidence_count') != latest.get('analytics_evidence_count'):
              raise SystemExit('analytics evidence count differs between snapshot and model')

          cohorts = model.get('cohorts')
          if not isinstance(cohorts, dict) or set(cohorts) != {'24h', '72h', '7d'}:
              raise SystemExit('analytics model must contain exactly 24h/72h/7d cohorts')
          for label, cohort in cohorts.items():
              if not isinstance(cohort, dict):
                  raise SystemExit(f'invalid cohort payload: {label}')
              count = cohort.get('video_count')
              if not isinstance(count, int) or isinstance(count, bool) or count < 0:
                  raise SystemExit(f'invalid cohort video_count: {label}')
              if cohort.get('dimension_weights') != DIMENSION_WEIGHTS:
                  raise SystemExit(f'analytics dimension weights changed unexpectedly: {label}')
              dimensions = cohort.get('dimensions')
              if not isinstance(dimensions, dict) or set(dimensions) != set(DIMENSION_WEIGHTS):
                  raise SystemExit(f'invalid analytics dimensions: {label}')

          if not isinstance(milestones, dict) or not isinstance(milestones.get('videos'), dict):
              raise SystemExit('analytics milestones must contain a videos object')

          sg_date = datetime.now(timezone.utc).astimezone(ZoneInfo('Asia/Singapore')).date().isoformat()
          dated_path = base / f'{sg_date}.json'
          if not dated_path.exists():
              raise SystemExit(f'missing dated analytics snapshot: {dated_path}')
          dated = json.loads(dated_path.read_text(encoding='utf-8'))
          if dated != latest:
              raise SystemExit('dated analytics snapshot differs from latest.json')

          print('Analytics output validation passed; new model is safe to persist.')
          PY
          then
            echo "::error title=Analytics rejected::Generated analytics state failed validation; retaining previous committed model."
            git restore --source=HEAD --staged --worktree -- youtube-shorts-bot/analytics/
            exit 1
          fi

          git add youtube-shorts-bot/analytics/
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi

          git commit -m "[skip upload] update YouTube analytics ${analytics_marker}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report elapsed runner time
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import math
          import time
          from pathlib import Path

          path = Path('/tmp/daily-job-started-at.txt')
          if path.exists():
              elapsed = time.time() - float(path.read_text().strip())
              print(
                  f"PERF_METRIC measured_workflow_steps_seconds={elapsed:.3f} "
                  f"job_level_billable_minute_proxy={math.ceil(elapsed / 60.0)}"
              )
          PY
