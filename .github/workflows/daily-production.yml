name: Daily Production

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/planning-pools/daily/**/*.json'
  workflow_dispatch:
    inputs:
      content_ids:
        description: Comma-separated immutable content IDs to recover/process
        required: true
        type: string

concurrency:
  group: private-production-dispatch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[daily pool]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Load private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Private promotion preflight and promote first valid candidates
        if: ${{ github.event_name == 'push' }}
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pools < <(git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | awk '$1 == "A" && $2 ~ /^youtube-shorts-bot\/content\/planning-pools\/daily\/[0-9]{4}-[0-9]{2}-[0-9]{2}\/dp-[A-Za-z0-9-]{8,96}\.json$/ {print $2}')
          if [ "${#pools[@]}" -ne 1 ]; then
            echo "::error::Daily pool commit must add exactly one immutable ranked-pool attempt"
            exit 1
          fi
          pool="${pools[0]}"
          PYTHONPATH=youtube-shorts-bot python -m planning.ranked_promotion daily \
            --pool "${pool}" \
            --source-sha "${GITHUB_SHA}" \
            --summary /tmp/ranked-promotion.json

          plan_date="$(python - <<'PY'
          import json
          data = json.load(open('/tmp/ranked-promotion.json', encoding='utf-8'))
          print(data['plan_path'].rsplit('/', 1)[-1].removesuffix('.json'))
          PY
          )"
          selected_count="$(python - <<'PY'
          import json
          data = json.load(open('/tmp/ranked-promotion.json', encoding='utf-8'))
          print(len(data['selected_content_ids']))
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/content/planning/ youtube-shorts-bot/content/requests/
          if git diff --cached --quiet; then
            echo "::error::Ranked pool promotion produced no canonical production state"
            exit 1
          fi
          git commit -m "[daily production] ${plan_date}"

          # Rebase before final validation. If main changed incompatibly, stop here.
          git pull --rebase origin main
          source_sha="$(git rev-parse HEAD)"
          batch_id="b_$(printf '%s' "${source_sha}" | sha256sum | cut -c1-30)"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "batch_id=${batch_id}" >> "${GITHUB_OUTPUT}"
          echo "plan_date=${plan_date}" >> "${GITHUB_OUTPUT}"
          echo "selected_count=${selected_count}" >> "${GITHUB_OUTPUT}"

      - name: Validate rebased canonical Daily production commit
        if: ${{ github.event_name == 'push' }}
        working-directory: youtube-shorts-bot
        env:
          PROMOTED_SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.planning_audit --source-sha "${PROMOTED_SOURCE_SHA}"

      - name: Publish validated Daily production state
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          # A concurrent main update after validation makes this non-fast-forward and
          # therefore fails closed rather than publishing unvalidated rebased state.
          git push origin HEAD:main

      - name: Resolve opaque dispatch
        id: batch
        shell: bash
        env:
          MANUAL_CONTENT_IDS: ${{ inputs.content_ids }}
          RECOVERY_RUN_ID: ${{ github.run_id }}
          PROMOTED_BATCH_ID: ${{ steps.promotion.outputs.batch_id }}
          PROMOTED_SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            batch_id="${PROMOTED_BATCH_ID}"
            source_sha="${PROMOTED_SOURCE_SHA}"
            if [[ ! "${batch_id}" =~ ^b_[0-9a-f]{30}$ ]] || [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Promoted Daily dispatch identity is invalid"
              exit 1
            fi
          else
            python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          raw = [item.strip() for item in os.environ.get('MANUAL_CONTENT_IDS', '').split(',') if item.strip()]
          if not 1 <= len(raw) <= 24 or len(raw) != len(set(raw)):
              raise SystemExit('Manual recovery requires 1-24 unique content IDs')
          items = []
          for content_id in raw:
              if not re.fullmatch(r'wd-[A-Za-z0-9-]+', content_id):
                  raise SystemExit('Invalid recovery content ID')
              path = Path(f'youtube-shorts-bot/content/requests/{content_id}.json')
              if not path.is_file():
                  raise SystemExit('Recovery request is not present in canonical state')
              commits = subprocess.check_output(
                  ['git', 'log', '--diff-filter=A', '--format=%H', '--', str(path)], text=True
              ).splitlines()
              if not commits:
                  raise SystemExit('Cannot resolve immutable request source')
              items.append({'content_id': content_id, 'source_commit_sha': commits[-1]})

          recovery_run_id = os.environ.get('RECOVERY_RUN_ID', '')
          if not recovery_run_id.isdigit():
              raise SystemExit('Cannot resolve stable recovery run identity')
          canonical = json.dumps(
              {'items': items, 'workflow_run_id': recovery_run_id},
              sort_keys=True,
              separators=(',', ':'),
          ).encode()
          batch_id = 'r_' + hashlib.sha256(canonical).hexdigest()[:30]
          target = Path(f'youtube-shorts-bot/content/recovery/batches/{batch_id}.json')
          payload = {'schema_version': 1, 'batch_id': batch_id, 'items': items}
          rendered = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          if target.exists() and target.read_text(encoding='utf-8') != rendered:
              raise SystemExit('Existing immutable recovery manifest differs')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(rendered, encoding='utf-8')
          Path('/tmp/private-batch-id').write_text(batch_id)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add youtube-shorts-bot/content/recovery/batches/
            if ! git diff --cached --quiet; then
              git commit -m "[skip upload] add immutable recovery batch"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            batch_id="$(cat /tmp/private-batch-id)"
            source_sha="$(git rev-parse HEAD)"
          fi
          echo "batch_id=${batch_id}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Resolve compatibility contract
        id: contract
        working-directory: youtube-shorts-bot
        shell: bash
        run: |
          set -euo pipefail
          contract_hash="$(python -m common.runtime_contract)"
          if [[ ! "${contract_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid compatibility fingerprint"
            exit 1
          fi
          echo "contract_hash=${contract_hash}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch public execution
        env:
          PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          SOURCE_SHA: ${{ steps.batch.outputs.source_sha }}
          CONTRACT_HASH: ${{ steps.contract.outputs.contract_hash }}
          PRIVATE_RUN_ID: ${{ github.run_id }}
          PRIVATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist_evidence() {
            for path in \
              youtube-shorts-bot/content/recovery/dispatch-intents \
              youtube-shorts-bot/content/recovery/dispatches \
              youtube-shorts-bot/content/recovery/dispatch-failures; do
              if [ -d "${path}" ]; then
                git add "${path}"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "[skip upload] record opaque dispatch evidence"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          dispatch_id="$(python youtube-shorts-bot/recovery/evidence.py prepare \
            --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
            --contract-hash "${CONTRACT_HASH}" --dispatch-kind initial \
            --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}")"
          persist_evidence

          payload="$(DISPATCH_ID="${dispatch_id}" python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'batch_id': os.environ['BATCH_ID'],
                  'source_sha': os.environ['SOURCE_SHA'],
                  'contract_hash': os.environ['CONTRACT_HASH'],
                  'dispatch_id': os.environ['DISPATCH_ID'],
              },
          }, separators=(',', ':')))
          PY
          )"
          if ! curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PUBLIC_PRODUCTION_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/run.yml/dispatches \
            -d "${payload}"; then
            python youtube-shorts-bot/recovery/evidence.py fail \
              --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
              --contract-hash "${CONTRACT_HASH}" --dispatch-kind initial \
              --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}" \
              --dispatch-id "${dispatch_id}"
            persist_evidence
            exit 1
          fi

          python youtube-shorts-bot/recovery/evidence.py accept \
            --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
            --contract-hash "${CONTRACT_HASH}" --dispatch-kind initial \
            --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}" \
            --dispatch-id "${dispatch_id}"
          persist_evidence
          echo "One opaque production batch dispatched."
