name: Rerender Failed Production

on:
  push:
    branches: [main]
    paths:
      - 'content/rerender/rerender-*.json'

permissions:
  contents: read

jobs:
  rerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Dispatch selected immutable executions
        env:
          PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | awk '$1 == "A" && $2 ~ /^content\/rerender\/rerender-[A-Za-z0-9-]+\.json$/ {print $2}')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::RERENDER_REQUEST_INVALID expected exactly one new rerender request"
            exit 1
          fi
          python - "${files[0]}" <<'PY'
          import json, os, re, subprocess, sys
          path=sys.argv[1]
          data=json.load(open(path,encoding="utf-8"))
          source=data.get("source_sha")
          ids=data.get("execution_ids")
          if not isinstance(source,str) or not re.fullmatch(r"[0-9a-f]{40}",source):
              raise SystemExit("invalid source_sha")
          if not isinstance(ids,list) or not ids or any(not isinstance(x,str) or not re.fullmatch(r"ex-[0-9a-f]{24}",x) for x in ids):
              raise SystemExit("invalid execution_ids")
          if len(set(ids)) != len(ids):
              raise SystemExit("duplicate execution_ids")
          token=os.environ["PUBLIC_PRODUCTION_TOKEN"]
          for execution_id in ids:
              payload=json.dumps({"ref":"main","inputs":{"execution_id":execution_id,"source_sha":source}},separators=(",",":"))
              subprocess.run([
                  "curl","--fail","--silent","--show-error","-X","POST",
                  "-H","Accept: application/vnd.github+json",
                  "-H",f"Authorization: Bearer {token}",
                  "-H","X-GitHub-Api-Version: 2022-11-28",
                  "https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/single.yml/dispatches",
                  "-d",payload
              ],check=True)
              print(f"Dispatched {execution_id}")
          PY
