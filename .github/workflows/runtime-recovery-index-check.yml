name: Runtime Recovery Index Check

on:
  push:
    branches: [work/recovery-index-20260912]
    paths:
      - '.github/workflows/runtime-recovery-index-check.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public branch
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://api.github.com/repos/skyfremen/production-runtime/tarball/work%2Frecovery-index-20260912'
          request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response, open('/tmp/runtime.tgz', 'wb') as out:
              out.write(response.read())
          PY
          mkdir -p /tmp/runtime
          tar --extract --gzip --file /tmp/runtime.tgz --strip-components 1 --directory /tmp/runtime
      - name: Compile changed runtime
        working-directory: /tmp/runtime
        run: python -m py_compile runtime/output/state.py runtime/output/transfer.py tests/test_state.py tests/test_transfer_recovery.py
      - name: Run recovery tests
        working-directory: /tmp/runtime
        env:
          PYTHONPATH: runtime:tests
        run: |
          python -m unittest discover -s tests -p 'test_state.py' -v
          python -m unittest discover -s tests -p 'test_transfer_recovery.py' -v
