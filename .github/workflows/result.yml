name: Ingest Production Result

on:
  push:
    branches: [main]
    paths:
      - 'content/results/*.json'

permissions:
  contents: write

concurrency:
  group: editorial-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Identify one immutable result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t results < <(
            git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" |
            awk '$1 == "A" && $2 ~ /^content\/results\/wd-[0-9a-f]{24}\.json$/ {print $2}'
          )
          if [ "${#results[@]}" -ne 1 ]; then
            echo "::error::RESULT_COMMIT_INVALID expected exactly one newly added immutable result"
            exit 1
          fi
          echo "path=${results[0]}" >> "${GITHUB_OUTPUT}"

      - name: Ingest from latest state and commit derived editorial state
        shell: bash
        env:
          RESULT_PATH: ${{ steps.result.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Editorial-state ingest attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            if [[ ! -f "${RESULT_PATH}" ]]; then
              echo "::error::RESULT_MISSING_FROM_MAIN ${RESULT_PATH}"
              exit 1
            fi

            python pipeline.py ingest-result --result "${RESULT_PATH}"
            git add data/history.json content/context.json

            if git diff --cached --quiet; then
              echo "Result was already ingested and context is current."
              exit 0
            fi

            git commit -m "[state] ingest verified scheduled result"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::main advanced before result state could be pushed; recomputing from latest main"
          done

          echo "::error::RESULT_STATE_PUSH_RETRY_EXHAUSTED after 3 attempts"
          exit 1
