name: Ingest Production Result

on:
  push:
    branches: [main]
    paths:
      - 'content/results/*.json'
      - 'content/result-reconciliations/*.json'

permissions:
  contents: write

concurrency:
  group: result-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Identify immutable result input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t results < <(
            git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" |
            awk '$1 == "A" && $2 ~ /^content\/results\/wd-[0-9a-f]{24}\.json$/ {print $2}'
          )
          mapfile -t reconciliations < <(
            git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" |
            awk '$1 == "A" && $2 ~ /^content\/result-reconciliations\/reconcile-[A-Za-z0-9-]{8,96}\.json$/ {print $2}'
          )

          if [[ "${#results[@]}" -eq 1 && "${#reconciliations[@]}" -eq 0 ]]; then
            echo "mode=result" >> "${GITHUB_OUTPUT}"
            echo "path=${results[0]}" >> "${GITHUB_OUTPUT}"
          elif [[ "${#results[@]}" -eq 0 && "${#reconciliations[@]}" -eq 1 ]]; then
            echo "mode=reconcile" >> "${GITHUB_OUTPUT}"
            echo "path=${reconciliations[0]}" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::RESULT_COMMIT_INVALID expected exactly one newly added immutable result or reconciliation request"
            exit 1
          fi

      - name: Reconcile latest result state and commit derived editorial state
        shell: bash
        env:
          INPUT_MODE: ${{ steps.input.outputs.mode }}
          INPUT_PATH: ${{ steps.input.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          resolve_missing_results() {
            python - "${INPUT_MODE}" "${INPUT_PATH}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          mode, input_path = sys.argv[1], Path(sys.argv[2])
          if mode == "reconcile":
              with input_path.open(encoding="utf-8") as f:
                  request = json.load(f)
              if not isinstance(request, dict) or set(request) != {"content_ids"}:
                  raise SystemExit("RECONCILIATION_INVALID expected exactly the content_ids field")
              content_ids = request["content_ids"]
              if not isinstance(content_ids, list) or not content_ids or len(content_ids) > 100:
                  raise SystemExit("RECONCILIATION_INVALID content_ids must contain 1..100 items")
              if len(content_ids) != len(set(content_ids)):
                  raise SystemExit("RECONCILIATION_INVALID duplicate content_ids")
              for content_id in content_ids:
                  if not isinstance(content_id, str) or not re.fullmatch(r"wd-[0-9a-f]{24}", content_id):
                      raise SystemExit(f"RECONCILIATION_INVALID content_id={content_id!r}")
                  if not (Path("content/results") / f"{content_id}.json").is_file():
                      raise SystemExit(f"RECONCILIATION_RESULT_MISSING content/results/{content_id}.json")

          with Path("data/history.json").open(encoding="utf-8") as f:
              history = json.load(f)
          if not isinstance(history, list):
              raise SystemExit("INVALID_HISTORY expected array")
          ingested = {
              item.get("content_id")
              for item in history
              if isinstance(item, dict) and isinstance(item.get("content_id"), str)
          }

          missing = []
          for path in sorted(Path("content/results").glob("wd-*.json")):
              with path.open(encoding="utf-8") as f:
                  result = json.load(f)
              content_id = result.get("content_id") if isinstance(result, dict) else None
              if content_id not in ingested:
                  missing.append((str(result.get("publish_at", "")), str(content_id), path.as_posix()))

          for _, _, path in sorted(missing):
              print(path)
          PY
          }

          for attempt in 1 2 3; do
            echo "Editorial-state reconciliation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            if [[ ! -f "${INPUT_PATH}" ]]; then
              echo "::error::RESULT_INPUT_MISSING_FROM_MAIN ${INPUT_PATH}"
              exit 1
            fi

            mapfile -t result_paths < <(resolve_missing_results)
            if [[ "${#result_paths[@]}" -eq 0 ]]; then
              echo "No missing result history entries; rebuilding context only."
              python pipeline.py context
            else
              echo "Reconciling ${#result_paths[@]} missing result(s)."
              for result_path in "${result_paths[@]}"; do
                echo "Ingesting ${result_path}"
                python pipeline.py ingest-result --result "${result_path}"
              done
            fi

            git add data/history.json content/context.json
            if git diff --cached --quiet; then
              echo "Result history and context are already current."
              exit 0
            fi

            if [[ "${INPUT_MODE}" == "reconcile" ]]; then
              git commit -m "[state] reconcile verified scheduled results"
            else
              git commit -m "[state] ingest verified scheduled results"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::main advanced before result state could be pushed; recomputing from latest main"
          done

          echo "::error::RESULT_STATE_PUSH_RETRY_EXHAUSTED after 3 attempts"
          exit 1
