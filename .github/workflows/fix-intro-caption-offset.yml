name: Fix Intro Caption Offset

on:
  push:
    paths:
      - '.github/workflows/fix-intro-caption-offset.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git safety
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Correct fallback caption start and extend regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          render = Path('youtube-shorts-bot/render.py')
          text = render.read_text()
          old = 'events.append(f"Dialogue: 0,{ass_time(cursor)},{ass_time(start_offset + end)},Main,,0,0,0,,{escape_ass(wrap_caption(chunk.upper()))}")'
          new = 'events.append(f"Dialogue: 0,{ass_time(start_offset + cursor)},{ass_time(start_offset + end)},Main,,0,0,0,,{escape_ass(wrap_caption(chunk.upper()))}")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one fallback caption timing match, found {text.count(old)}')
          render.write_text(text.replace(old, new, 1))

          test = Path('youtube-shorts-bot/tests/test_intro_sequence.py')
          t = test.read_text()
          marker = '    def test_renderer_fades_card_after_intro_and_offsets_captions(self):\n'
          addition = '''    def test_fallback_subtitles_also_start_after_card_transition(self):\n        story_start = 2.50 + CARD_TRANSITION_SECONDS\n        events = caption_events(\n            "Then payroll saw it",\n            [],\n            1.0,\n            start_offset=story_start,\n        )\n        self.assertTrue(events)\n        self.assertIn("0:00:02.80", events[0])\n        self.assertNotIn("0:00:00.00", "\\n".join(events))\n\n'''
          if addition not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker missing')
              t = t.replace(marker, addition + marker, 1)
          test.write_text(t)
          PY
          python -m py_compile youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_intro_sequence.py
          python -m unittest youtube-shorts-bot/tests/test_intro_sequence.py -v
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-intro-caption-offset.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_intro_sequence.py .github/workflows/fix-intro-caption-offset.yml
          git commit -m 'fix story caption offset after card intro'
          git push origin HEAD:main
