name: Background Management

env:
  PYTHONPATH: youtube-shorts-bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/background-sourcing/readiness/*.json'
      - 'youtube-shorts-bot/media/media_readiness.py'
      - 'youtube-shorts-bot/media/pexels_registry.py'
      - 'youtube-shorts-bot/media/pexels_resilient_ingest.py'
      - 'youtube-shorts-bot/media/background_policy.py'
      - '.github/workflows/background-management.yml'

concurrency:
  group: wacky-dramas-background-registry-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve maintenance action
        id: action
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          action=refresh
          manifest=''
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [[ ! "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              echo '::error::Push-triggered background maintenance requires a concrete previous main SHA.'
              exit 1
            fi
            changed="$(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")"
            mapfile -t readiness_files < <(printf '%s\n' "${changed}" | awk '$1 == "A" && $2 ~ /^youtube-shorts-bot\/content\/background-sourcing\/readiness\/[A-Za-z0-9._-]+\.json$/ {print $2}')
            if [ "${#readiness_files[@]}" -gt 1 ]; then
              echo '::error::One push may add at most one readiness manifest.'
              exit 1
            fi
            if [ "${#readiness_files[@]}" -eq 1 ]; then
              action=replenish
              manifest="${readiness_files[0]}"
            fi
          fi
          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Require planning-only Pexels API key
        if: steps.action.outputs.action == 'replenish' || steps.action.outputs.action == 'refresh'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PEXELS_API_KEY}" ]; then
            echo '::error::PEXELS_API_KEY is required for background replenishment/refresh.'
            exit 1
          fi

      - name: Ingest reviewed readiness manifest with reserve fallback
        if: steps.action.outputs.action == 'replenish'
        env:
          MANIFEST: ${{ steps.action.outputs.manifest }}
        run: python -m media.pexels_resilient_ingest --manifest "${MANIFEST}"

      - name: Refresh exact rendition metadata
        if: steps.action.outputs.action == 'refresh'
        run: python youtube-shorts-bot/media/pexels_registry.py enrich-existing --require-any

      - name: Validate registry structure
        run: python youtube-shorts-bot/media/validate_media_library.py

      - name: Enforce shared media readiness after replenishment
        if: steps.action.outputs.action == 'replenish'
        run: python -m media.media_readiness audit

      - name: Commit registry maintenance
        shell: bash
        env:
          ACTION: ${{ steps.action.outputs.action }}
        run: |
          set -euo pipefail
          if git diff --quiet -- youtube-shorts-bot/media-library/backgrounds.json; then
            echo 'Registry is already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add youtube-shorts-bot/media-library/backgrounds.json
          case "${ACTION}" in
            replenish) message='[media readiness] replenish background registry' ;;
            *) message='refresh Pexels background rendition metadata' ;;
          esac
          git commit -m "${message}"
          git pull --rebase origin main
          git push origin HEAD:main
