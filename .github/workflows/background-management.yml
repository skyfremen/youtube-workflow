name: Background Management

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/pexels_registry.py'
      - 'youtube-shorts-bot/background_policy.py'
      - '.github/workflows/background-management.yml'

concurrency:
  group: wacky-dramas-background-registry-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich-existing:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check planning-only Pexels API key
        id: pexels-key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "::warning::PEXELS_API_KEY is absent; rendition metadata refresh was not attempted."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh exact rendition metadata
        if: steps.pexels-key.outputs.available == 'true'
        run: python youtube-shorts-bot/pexels_registry.py enrich-existing --require-any

      - name: Validate registry
        if: steps.pexels-key.outputs.available == 'true'
        run: python youtube-shorts-bot/validate_media_library.py

      - name: Commit metadata refresh
        if: steps.pexels-key.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- youtube-shorts-bot/media-library/backgrounds.json; then
            echo "Registry rendition metadata is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add youtube-shorts-bot/media-library/backgrounds.json
          git commit -m "refresh Pexels background rendition metadata"
          git push origin HEAD:main
