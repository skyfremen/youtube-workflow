name: Post-hardening Shorts dry run

on:
  push:
    paths:
      - '.github/workflows/post-hardening-dry-run.yml'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            youtube-shorts-bot/workflow_common.py \
            youtube-shorts-bot/validate_content.py \
            youtube-shorts-bot/upload.py

      - name: Verify production workflow safety guards
        shell: bash
        run: |
          grep -F "github.event.workflow_run.head_branch == 'main'" .github/workflows/daily-queue-publish.yml
          grep -F "!contains(github.event.workflow_run.head_commit.message, '[skip upload]')" .github/workflows/daily-queue-publish.yml
          grep -F "batch-metadata/slot-\${slot}.json" .github/workflows/daily-queue-publish.yml
          if grep -q '^  push:' .github/workflows/youtube-shorts.yml; then
            echo 'Legacy publisher still has a push trigger.'
            exit 1
          fi
          grep -F 'workflow_dispatch:' .github/workflows/youtube-shorts.yml
          echo 'Production trigger guards and immediate upload-evidence persistence are present.'

      - name: Exercise exact archive recovery rules
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, 'youtube-shorts-bot')
          from workflow_common import content_id, recoverable_archive_match

          content = {
              'topic': 'Dry run recovery topic',
              'category': 'EVERYDAY LIFE',
              'setup': 'DRY RUN SETUP',
              'payoff': 'DRY RUN PAYOFF',
          }
          cid = content_id(content)

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              archive = root / 'archive'
              archive.mkdir()
              plan_path = root / 'plan.json'
              selection_path = root / 'queue_selection.json'

              plan = {
                  'items': [{
                      'slot': 1,
                      'status': 'pending',
                      'content': content,
                  }]
              }
              plan_path.write_text(json.dumps(plan), encoding='utf-8')
              selection_path.write_text(json.dumps({
                  'plan_path': str(plan_path),
                  'item_index': 0,
                  'slot': 1,
              }), encoding='utf-8')
              (archive / '2026-09-07.json').write_text(json.dumps({
                  'shorts': [{
                      'content_id': cid,
                      'youtube_video_id': 'DRYRUN_VIDEO_ID',
                  }]
              }), encoding='utf-8')

              match = recoverable_archive_match(archive, selection_path, content)
              assert match is not None, 'Expected exact pending queue recovery match.'
              assert match[1]['youtube_video_id'] == 'DRYRUN_VIDEO_ID'

              plan['items'][0]['status'] = 'scheduled'
              plan_path.write_text(json.dumps(plan), encoding='utf-8')
              assert recoverable_archive_match(archive, selection_path, content) is None, \
                  'Completed queue item must not be treated as recoverable.'

              plan['items'][0]['status'] = 'pending'
              plan_path.write_text(json.dumps(plan), encoding='utf-8')
              different = dict(content)
              different['payoff'] = 'DIFFERENT PAYOFF'
              assert recoverable_archive_match(archive, selection_path, different) is None, \
                  'Different content must not reuse an archived video.'

              duplicate_archive = archive / '2026-09-08.json'
              duplicate_archive.write_text(json.dumps({
                  'shorts': [{
                      'content_id': cid,
                      'youtube_video_id': 'SECOND_VIDEO_ID',
                  }]
              }), encoding='utf-8')
              assert recoverable_archive_match(archive, selection_path, content) is None, \
                  'Ambiguous multiple archived uploads must fail closed.'

          print('Exact archived queue recovery is narrow, deterministic, and fail-closed.')
          PY

      - name: Real YouTube OAuth preflight
        run: python youtube-shorts-bot/auth_check.py

      - name: Confirm no publication
        run: echo 'POST-HARDENING DRY RUN PASSED - no render, YouTube upload, archive mutation, queue mutation, or Git persistence was performed.'
