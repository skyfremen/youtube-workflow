name: Ad-hoc Production

on:
  push:
    branches: [main]
    paths:
      - 'youtube-shorts-bot/content/planning-pools/adhoc/*.json'
  workflow_dispatch:
    inputs:
      content_id:
        description: One immutable content ID
        required: true
        type: string

concurrency:
  group: private-adhoc-${{ inputs.content_id || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[adhoc pool]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Load private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Global preflight, validate ranked pool, and promote first valid candidate
        if: ${{ github.event_name == 'push' }}
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pools < <(git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | awk '$1 == "A" && $2 ~ /^youtube-shorts-bot\/content\/planning-pools\/adhoc\/ap-[A-Za-z0-9-]{8,96}\.json$/ {print $2}')
          if [ "${#pools[@]}" -ne 1 ]; then
            echo "::error::Ad-hoc pool commit must add exactly one immutable ranked pool"
            exit 1
          fi
          pool="${pools[0]}"
          PYTHONPATH=youtube-shorts-bot python -m planning.ranked_promotion adhoc \
            --pool "${pool}" \
            --source-sha "${GITHUB_SHA}" \
            --summary /tmp/ranked-promotion.json

          content_id="$(python - <<'PY'
          import json
          data = json.load(open('/tmp/ranked-promotion.json', encoding='utf-8'))
          print(data['selected_content_id'])
          PY
          )"
          request_path="youtube-shorts-bot/content/requests/${content_id}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${request_path}"
          if git diff --cached --quiet; then
            echo "::error::Ranked Ad-hoc promotion produced no immutable request"
            exit 1
          fi
          commit_date="$(date -u +%F)"
          git commit -m "[adhoc production] ${commit_date}"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "content_id=${content_id}" >> "${GITHUB_OUTPUT}"
          echo "request_source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve exactly one immutable Ad-hoc request
        id: identity
        env:
          MANUAL_CONTENT_ID: ${{ inputs.content_id }}
          PROMOTED_CONTENT_ID: ${{ steps.promotion.outputs.content_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            content_id="${PROMOTED_CONTENT_ID}"
          else
            content_id="${MANUAL_CONTENT_ID:-}"
          fi
          if [[ ! "${content_id}" =~ ^wd-[A-Za-z0-9-]+$ ]]; then
            echo "::error::Invalid immutable content ID"
            exit 1
          fi
          path="youtube-shorts-bot/content/requests/${content_id}.json"
          if [ ! -f "${path}" ]; then
            echo "::error::Request is not present in canonical state"
            exit 1
          fi

          PYTHONPATH=youtube-shorts-bot python -m validation.validate_content --request "${path}"
          python - "${path}" "${content_id}" <<'PY'
          import json, sys
          path, content_id = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          if data.get('content_id') != content_id:
              raise SystemExit('request filename/content_id mismatch')
          publication = data.get('publication') or {}
          if publication != {
              'mode': 'immediate',
              'timezone': 'Asia/Singapore',
              'publish_at': None,
          }:
              raise SystemExit('ad-hoc request is not immediate-public')
          PY
          echo "content_id=${content_id}" >> "${GITHUB_OUTPUT}"

      - name: Create opaque execution
        id: batch
        env:
          CONTENT_ID: ${{ steps.identity.outputs.content_id }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
          EXECUTION_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          content_id = os.environ.get('CONTENT_ID', '').strip()
          if not re.fullmatch(r'wd-[A-Za-z0-9-]+', content_id):
              raise SystemExit('Invalid immutable content ID')
          path = Path(f'youtube-shorts-bot/content/requests/{content_id}.json')
          if not path.is_file():
              raise SystemExit('Request is not present in canonical state')
          commits = subprocess.check_output(
              ['git', 'log', '--diff-filter=A', '--format=%H', '--', str(path)], text=True
          ).splitlines()
          if not commits:
              raise SystemExit('Cannot resolve immutable request source')
          item = {'content_id': content_id, 'source_commit_sha': commits[-1]}
          execution = {
              'item': item,
              'workflow_run_id': os.environ.get('EXECUTION_RUN_ID', ''),
              'workflow_run_attempt': os.environ.get('EXECUTION_ATTEMPT', ''),
          }
          if not execution['workflow_run_id'].isdigit() or not execution['workflow_run_attempt'].isdigit():
              raise SystemExit('Cannot resolve unique execution identity')
          canonical = json.dumps(execution, sort_keys=True, separators=(',', ':')).encode()
          batch_id = 'r_' + hashlib.sha256(canonical).hexdigest()[:30]
          target = Path(f'youtube-shorts-bot/content/recovery/batches/{batch_id}.json')
          rendered = json.dumps({
              'schema_version': 1,
              'batch_id': batch_id,
              'items': [item],
          }, indent=2, sort_keys=True) + '\n'
          if target.exists() and target.read_text(encoding='utf-8') != rendered:
              raise SystemExit('Existing immutable execution manifest differs')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(rendered, encoding='utf-8')
          Path('/tmp/private-batch-id').write_text(batch_id)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/content/recovery/batches/
          if ! git diff --cached --quiet; then
            git commit -m "[skip upload] add immutable single execution"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "batch_id=$(cat /tmp/private-batch-id)" >> "${GITHUB_OUTPUT}"
          echo "source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve compatibility contract
        id: contract
        working-directory: youtube-shorts-bot
        shell: bash
        run: |
          set -euo pipefail
          contract_hash="$(python -m common.runtime_contract)"
          if [[ ! "${contract_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid compatibility fingerprint"
            exit 1
          fi
          echo "contract_hash=${contract_hash}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch isolated execution
        env:
          PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          SOURCE_SHA: ${{ steps.batch.outputs.source_sha }}
          CONTRACT_HASH: ${{ steps.contract.outputs.contract_hash }}
          PRIVATE_RUN_ID: ${{ github.run_id }}
          PRIVATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist_evidence() {
            for path in \
              youtube-shorts-bot/content/recovery/dispatch-intents \
              youtube-shorts-bot/content/recovery/dispatches \
              youtube-shorts-bot/content/recovery/dispatch-failures; do
              if [ -d "${path}" ]; then
                git add "${path}"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "[skip upload] record opaque dispatch evidence"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          dispatch_id="$(python youtube-shorts-bot/recovery/evidence.py prepare \
            --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
            --contract-hash "${CONTRACT_HASH}" --dispatch-kind adhoc \
            --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}")"
          persist_evidence

          payload="$(DISPATCH_ID="${dispatch_id}" python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'batch_id': os.environ['BATCH_ID'],
                  'source_sha': os.environ['SOURCE_SHA'],
                  'contract_hash': os.environ['CONTRACT_HASH'],
                  'dispatch_id': os.environ['DISPATCH_ID'],
              },
          }, separators=(',', ':')))
          PY
          )"
          if ! curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PUBLIC_PRODUCTION_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyfremen/production-runtime/actions/workflows/single.yml/dispatches \
            -d "${payload}"; then
            python youtube-shorts-bot/recovery/evidence.py fail \
              --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
              --contract-hash "${CONTRACT_HASH}" --dispatch-kind adhoc \
              --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}" \
              --dispatch-id "${dispatch_id}"
            persist_evidence
            exit 1
          fi

          python youtube-shorts-bot/recovery/evidence.py accept \
            --batch-id "${BATCH_ID}" --source-sha "${SOURCE_SHA}" \
            --contract-hash "${CONTRACT_HASH}" --dispatch-kind adhoc \
            --run-id "${PRIVATE_RUN_ID}" --run-attempt "${PRIVATE_RUN_ATTEMPT}" \
            --dispatch-id "${dispatch_id}"
          persist_evidence
          echo "One opaque isolated execution dispatched."
