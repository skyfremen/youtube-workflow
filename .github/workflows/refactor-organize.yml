name: Organize Shorts Bot Folders

on:
  push:
    branches:
      - refactor/organize-shorts-bot-folders
    paths:
      - '.github/workflows/refactor-organize.yml'

permissions:
  contents: write

env:
  PYTHONPATH: youtube-shorts-bot

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/organize-shorts-bot-folders

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'numpy>=2.0.2,<2.3' \
            'Pillow>=10,<12' \
            'PyYAML>=6,<7'

      - name: Audit, reorganize, and rewrite references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          BOT = Path('youtube-shorts-bot')
          TEMP_WORKFLOW = Path('.github/workflows/refactor-organize.yml')

          moves = {
              'youtube-shorts-bot/SYSTEM_OVERVIEW.md': 'youtube-shorts-bot/docs/SYSTEM_OVERVIEW.md',
              'youtube-shorts-bot/RECOVERY.md': 'youtube-shorts-bot/docs/RECOVERY.md',
              'youtube-shorts-bot/planner/DAILY_PLANNER_PROMPT.md': 'youtube-shorts-bot/planning/DAILY_PLANNER_PROMPT.md',
              'youtube-shorts-bot/planner/STORY_RULES.md': 'youtube-shorts-bot/planning/STORY_RULES.md',
              'youtube-shorts-bot/planning_config.py': 'youtube-shorts-bot/planning/planning_config.py',
              'youtube-shorts-bot/planning_engine.py': 'youtube-shorts-bot/planning/planning_engine.py',
              'youtube-shorts-bot/background_policy.py': 'youtube-shorts-bot/media/background_policy.py',
              'youtube-shorts-bot/background_selector.py': 'youtube-shorts-bot/media/background_selector.py',
              'youtube-shorts-bot/media_resolver.py': 'youtube-shorts-bot/media/media_resolver.py',
              'youtube-shorts-bot/pexels_registry.py': 'youtube-shorts-bot/media/pexels_registry.py',
              'youtube-shorts-bot/validate_media_library.py': 'youtube-shorts-bot/media/validate_media_library.py',
              'youtube-shorts-bot/render.py': 'youtube-shorts-bot/rendering/render.py',
              'youtube-shorts-bot/render_aligned.py': 'youtube-shorts-bot/rendering/render_aligned.py',
              'youtube-shorts-bot/caption_alignment.py': 'youtube-shorts-bot/rendering/caption_alignment.py',
              'youtube-shorts-bot/tts_backend.py': 'youtube-shorts-bot/rendering/tts_backend.py',
              'youtube-shorts-bot/verify_render.py': 'youtube-shorts-bot/rendering/verify_render.py',
              'youtube-shorts-bot/auth_preflight.py': 'youtube-shorts-bot/publishing/auth_preflight.py',
              'youtube-shorts-bot/publish.py': 'youtube-shorts-bot/publishing/publish.py',
              'youtube-shorts-bot/upload.py': 'youtube-shorts-bot/publishing/upload.py',
              'youtube-shorts-bot/verify_publication.py': 'youtube-shorts-bot/publishing/verify_publication.py',
              'youtube-shorts-bot/finalize_receipt.py': 'youtube-shorts-bot/publishing/finalize_receipt.py',
              'youtube-shorts-bot/recovery_state.py': 'youtube-shorts-bot/publishing/recovery_state.py',
              'youtube-shorts-bot/validate_content.py': 'youtube-shorts-bot/validation/validate_content.py',
              'youtube-shorts-bot/request_guard.py': 'youtube-shorts-bot/validation/request_guard.py',
              'youtube-shorts-bot/workflow_common.py': 'youtube-shorts-bot/common/workflow_common.py',
              'youtube-shorts-bot/analytics_collection.py': 'youtube-shorts-bot/analytics/analytics_collection.py',
              'youtube-shorts-bot/analytics_learning.py': 'youtube-shorts-bot/analytics/analytics_learning.py',
          }

          module_map = {
              'planning_config': 'planning.planning_config',
              'planning_engine': 'planning.planning_engine',
              'background_policy': 'media.background_policy',
              'background_selector': 'media.background_selector',
              'media_resolver': 'media.media_resolver',
              'pexels_registry': 'media.pexels_registry',
              'validate_media_library': 'media.validate_media_library',
              'render': 'rendering.render',
              'render_aligned': 'rendering.render_aligned',
              'caption_alignment': 'rendering.caption_alignment',
              'tts_backend': 'rendering.tts_backend',
              'verify_render': 'rendering.verify_render',
              'auth_preflight': 'publishing.auth_preflight',
              'publish': 'publishing.publish',
              'upload': 'publishing.upload',
              'verify_publication': 'publishing.verify_publication',
              'finalize_receipt': 'publishing.finalize_receipt',
              'recovery_state': 'publishing.recovery_state',
              'validate_content': 'validation.validate_content',
              'request_guard': 'validation.request_guard',
              'workflow_common': 'common.workflow_common',
              'analytics_collection': 'analytics.analytics_collection',
              'analytics_learning': 'analytics.analytics_learning',
          }

          missing = [old for old in moves if not Path(old).exists()]
          occupied = [new for new in moves.values() if Path(new).exists()]
          if missing or occupied:
              raise SystemExit(f'Unsafe starting tree: missing={missing}, occupied={occupied}')

          def tracked_text_files():
              raw = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              for item in raw:
                  if not item:
                      continue
                  path = Path(item)
                  try:
                      path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError, IsADirectoryError):
                      continue
                  yield path

          print('=== PRE-REFACTOR DEPENDENCY MAP ===')
          source_files = list(tracked_text_files())
          for old, new in moves.items():
              refs = [str(p) for p in source_files if old in p.read_text(encoding='utf-8')]
              if refs:
                  print(f'{old} -> {new}: {refs}')
          for module in module_map:
              pattern = re.compile(rf'(?m)^\s*(?:from\s+{re.escape(module)}\s+import\b|import\s+{re.escape(module)}(?:\s|$))')
              refs = [str(p) for p in source_files if pattern.search(p.read_text(encoding='utf-8'))]
              if refs:
                  print(f'import {module}: {refs}')

          for target in moves.values():
              Path(target).parent.mkdir(parents=True, exist_ok=True)
          for old, new in moves.items():
              subprocess.run(['git', 'mv', old, new], check=True)

          planner = BOT / 'planner'
          if planner.exists():
              try:
                  planner.rmdir()
              except OSError as exc:
                  raise SystemExit('planner/ contains unexpected files') from exc

          packages = ('planning', 'media', 'rendering', 'publishing', 'validation', 'common', 'analytics')
          for package in packages:
              init = BOT / package / '__init__.py'
              if not init.exists():
                  init.write_text(f'"""Wacky Dramas {package} package."""\n', encoding='utf-8')

          # Every moved Python file is exactly one level deeper. Keep its former
          # application-root meaning for all __file__-relative calculations.
          for new in moves.values():
              if not new.endswith('.py'):
                  continue
              path = Path(new)
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'Path\(__file__\)\.resolve\(\)\.parents\[(\d+)\]',
                  lambda m: f'Path(__file__).resolve().parents[{int(m.group(1)) + 1}]',
                  text,
              )
              text = re.sub(
                  r'Path\(__file__\)\.parents\[(\d+)\]',
                  lambda m: f'Path(__file__).parents[{int(m.group(1)) + 1}]',
                  text,
              )
              text = text.replace('Path(__file__).resolve().parent', 'Path(__file__).resolve().parents[1]')
              text = text.replace('Path(__file__).parent', 'Path(__file__).resolve().parents[1]')
              path.write_text(text, encoding='utf-8')

          def rewrite_imports(text: str) -> str:
              for old_module, new_module in module_map.items():
                  text = re.sub(
                      rf'(?m)^(\s*)from\s+{re.escape(old_module)}\s+import\b',
                      rf'\1from {new_module} import',
                      text,
                  )
                  package, leaf = new_module.rsplit('.', 1)
                  pattern = re.compile(
                      rf'(?m)^(\s*)import\s+{re.escape(old_module)}'
                      rf'(\s+as\s+([A-Za-z_]\w*))?(\s*#.*)?$'
                  )
                  def replacement(match):
                      return f"{match.group(1)}from {package} import {leaf}{match.group(2) or ''}{match.group(4) or ''}"
                  text = pattern.sub(replacement, text)
              return text

          # Rewrite all callers, imports, workflow command paths and documentation.
          for path in list(tracked_text_files()):
              if path == TEMP_WORKFLOW:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('youtube-shorts-bot/planner/', 'youtube-shorts-bot/planning/')
              for old, new in moves.items():
                  text = text.replace(old, new)
              text = rewrite_imports(text)

              if path.suffix in {'.yml', '.yaml'}:
                  text = text.replace("'youtube-shorts-bot/*.py'", "'youtube-shorts-bot/**/*.py'")
                  text = text.replace("'youtube-shorts-bot/*.md'", "'youtube-shorts-bot/**/*.md'")

              if path.parent == BOT / 'tests':
                  # Tests use dynamic patch targets and source-file strings in
                  # addition to normal imports; those are real structural references.
                  for old_module, new_module in module_map.items():
                      text = text.replace(f'"{old_module}.', f'"{new_module}.')
                      text = text.replace(f"'{old_module}.", f"'{new_module}.")
                  for old, new in moves.items():
                      if old.endswith('.py'):
                          old_name = Path(old).name
                          new_rel = str(Path(new).relative_to(BOT))
                          text = text.replace(f'"{old_name}"', f'"{new_rel}"')
                          text = text.replace(f"'{old_name}'", f"'{new_rel}'")
                  text = text.replace('BOT_ROOT / "planner"', 'BOT_ROOT / "planning"')
                  text = text.replace("BOT_ROOT / 'planner'", "BOT_ROOT / 'planning'")
                  text = text.replace(
                      'BOT_ROOT / "SYSTEM_OVERVIEW.md"',
                      'BOT_ROOT / "docs" / "SYSTEM_OVERVIEW.md"',
                  )
                  text = text.replace(
                      "BOT_ROOT / 'SYSTEM_OVERVIEW.md'",
                      "BOT_ROOT / 'docs' / 'SYSTEM_OVERVIEW.md'",
                  )
                  text = text.replace(
                      'BOT_ROOT / "RECOVERY.md"',
                      'BOT_ROOT / "docs" / "RECOVERY.md"',
                  )
                  text = text.replace(
                      "BOT_ROOT / 'RECOVERY.md'",
                      "BOT_ROOT / 'docs' / 'RECOVERY.md'",
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')

          dry = Path('.github/workflows/dry-run.yml')
          text = dry.read_text(encoding='utf-8').replace(
              'run: python -m py_compile youtube-shorts-bot/*.py',
              "run: find youtube-shorts-bot -type f -name '*.py' -print0 | xargs -0 python -m py_compile",
          )
          dry.write_text(text, encoding='utf-8')

          # New absolute package imports need only the application root on sys.path.
          # This is a single process environment variable, not new jobs/subprocesses.
          for workflow in Path('.github/workflows').glob('*.yml'):
              if workflow == TEMP_WORKFLOW:
                  continue
              text = workflow.read_text(encoding='utf-8')
              if re.search(r'(?m)^env:\s*$', text):
                  if not re.search(r'(?m)^  PYTHONPATH:\s*youtube-shorts-bot\s*$', text):
                      text = re.sub(r'(?m)^env:\s*$', 'env:\n  PYTHONPATH: youtube-shorts-bot', text, count=1)
              else:
                  name = re.search(r'(?m)^name:.*$', text)
                  if not name:
                      raise SystemExit(f'Missing workflow name: {workflow}')
                  text = text[:name.end()] + '\n\nenv:\n  PYTHONPATH: youtube-shorts-bot' + text[name.end():]
              workflow.write_text(text, encoding='utf-8')

          # The temporary migration workflow is not part of the canonical surface.
          # Delete it before unit/architecture tests so those tests validate the real
          # post-refactor repository rather than a migration helper.
          TEMP_WORKFLOW.unlink()

          # Final static stale-reference audit excludes historical git data and the
          # now-deleted migration helper. No compatibility wrappers are permitted.
          stale = []
          for path in tracked_text_files():
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old in moves:
                  if old in text:
                      stale.append(f'{path}: {old}')
              if 'youtube-shorts-bot/planner/' in text:
                  stale.append(f'{path}: youtube-shorts-bot/planner/')
              for old_module in module_map:
                  if re.search(
                      rf'(?m)^\s*(?:from\s+{re.escape(old_module)}\s+import\b|import\s+{re.escape(old_module)}(?:\s|$))',
                      text,
                  ):
                      stale.append(f'{path}: bare import {old_module}')
          if stale:
              raise SystemExit('Stale structural references remain:\n' + '\n'.join(stale[:100]))

          for old in moves:
              assert not Path(old).exists(), old
          for new in moves.values():
              assert Path(new).exists(), new

          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          forbidden_prefixes = (
              'youtube-shorts-bot/content/',
              'youtube-shorts-bot/media-library/',
              'youtube-shorts-bot/assets/',
          )
          forbidden = [path for path in changed if path.startswith(forbidden_prefixes)]
          if forbidden:
              raise SystemExit('Runtime data/assets changed: ' + ', '.join(forbidden))

          print('=== FINAL ROOT ===')
          for path in sorted(BOT.iterdir()):
              print(path)
          print('=== CHANGED FILES ===')
          print('\n'.join(changed))
          PY

      - name: Validate static structure and imports
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          find youtube-shorts-bot -type f -name '*.py' -print0 | xargs -0 python -m py_compile
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML parsed: {path}')

          expected = {
              'Dockerfile', 'requirements.txt', 'analytics', 'assets', 'common', 'content',
              'docs', 'media', 'media-library', 'planning', 'publishing', 'rendering',
              'tests', 'validation',
          }
          actual = {p.name for p in Path('youtube-shorts-bot').iterdir() if p.name != '__pycache__'}
          assert actual == expected, (sorted(actual), sorted(expected))

          assert {p.name for p in Path('youtube-shorts-bot/planning').glob('*.md')} == {
              'DAILY_PLANNER_PROMPT.md', 'STORY_RULES.md'
          }
          assert len(list(Path('.github/workflows').glob('*.yml'))) == 5
          print('Canonical responsibility-based surface verified.')
          PY

          python - <<'PY'
          from common import workflow_common
          from media.background_policy import production_rendition_policy
          from media import validate_media_library
          from planning import planning_engine
          from publishing import auth_preflight, publish, recovery_state, upload
          from rendering import caption_alignment, render, tts_backend
          from validation import request_guard, validate_content

          assert workflow_common.PRODUCTION_MAX_SECONDS == 178.0
          assert workflow_common.PRODUCTION_TARGET_MIN_SECONDS == 120.0
          assert workflow_common.PRODUCTION_TARGET_MAX_SECONDS == 175.0
          assert workflow_common.expected_video_config() == {'width': 720, 'height': 1280, 'fps': 30}
          assert render.X264_PRESET == 'superfast'
          assert render.X264_CRF == 19
          assert tts_backend.ONNX_BACKEND == 'onnx-fp32'
          assert production_rendition_policy()['uhd_downloads_allowed'] is False
          print('Cross-package imports and production constants verified.')
          PY

      - name: Run complete unit and contract test suite
        run: python -m unittest discover -s youtube-shorts-bot/tests -v

      - name: Run registry and planning acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          python youtube-shorts-bot/media/validate_media_library.py
          python youtube-shorts-bot/planning/planning_engine.py \
            --acceptance-dry-run --date 2026-09-10 --analytics-video-count 0 \
            --output /tmp/planning-dry-run.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/planning-dry-run.json'))
          assert data['raw_premises_generated'] >= 120
          assert data['final_selected'] == 24
          assert data['analytics_weight'] == 0
          assert data['exploit_selections'] == 19
          assert data['explore_selections'] == 5
          selected = data['selected']
          assert len({x['publication']['publish_at'] for x in selected}) == 24
          assert all(x['publication']['timezone'] == 'Asia/Singapore' for x in selected)
          print('Planning acceptance preserved: 120+ premises -> 24 unique scheduled winners.')
          PY

      - name: Verify production path equivalence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          batch = Path('.github/workflows/daily-production.yml').read_text(encoding='utf-8')
          stages = [
              'media/validate_media_library.py',
              'publishing/auth_preflight.py',
              'media/pexels_registry.py',
              'validation/validate_content.py',
              'publishing/publish.py --stage prepare',
              'media/media_resolver.py',
              'rendering/render_aligned.py',
              'rendering/verify_render.py',
              'publishing/publish.py --stage upload',
              'publishing/verify_publication.py',
              'publishing/finalize_receipt.py',
          ]
          positions = []
          for stage in stages:
              position = batch.find(stage)
              assert position >= 0, f'Missing stage {stage}'
              positions.append(position)
          assert positions == sorted(positions), list(zip(stages, positions))
          assert 'group: wacky-dramas-youtube-upload' in batch
          assert '[daily production]' in batch
          assert 'schedule:' not in batch.split('jobs:')[0]

          dry = Path('.github/workflows/dry-run.yml').read_text(encoding='utf-8')
          assert "'youtube-shorts-bot/**/*.py'" in dry
          assert "Path('youtube-shorts-bot/planning')" in dry
          assert 'youtube-shorts-bot/media/validate_media_library.py' in dry
          assert 'youtube-shorts-bot/planning/planning_engine.py' in dry

          for path in ('content', 'media-library', 'assets'):
              assert Path('youtube-shorts-bot', path).exists()
          print('Production ordering, safety markers, dry-run coverage and runtime-data locations preserved.')
          PY

          test ! -f youtube-shorts-bot/output/short.mp4
          test ! -f youtube-shorts-bot/output/narration.wav
          test ! -f youtube-shorts-bot/output/upload_result.json

      - name: Commit validated refactor
        shell: bash
        run: |
          set -euo pipefail
          find youtube-shorts-bot -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m 'refactor: organize Wacky Dramas files by responsibility'
          git push origin HEAD:refactor/organize-shorts-bot-folders
