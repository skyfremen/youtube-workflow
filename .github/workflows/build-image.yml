name: Build Image

on:
  push:
    paths:
      - 'youtube-shorts-bot/Dockerfile'
      - 'youtube-shorts-bot/requirements.txt'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    # Only main is allowed to publish the canonical production runner tags.
    # Migration/experiment branches are validated by the lightweight dry run
    # and must never replace ghcr.io/...:latest before merge acceptance.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: youtube-shorts-bot/Dockerfile
          push: true
          tags: |
            ghcr.io/skyfremen/youtube-shorts-runner:latest
            ghcr.io/skyfremen/youtube-shorts-runner:${{ github.sha }}
          # Reuse the already-pushed image layers and embed compact cache
          # metadata in the image manifest. The former mode=max GHA cache
          # uploaded the large ML/model layer graph a second time and added
          # about 87 seconds to measured runner builds.
          cache-from: type=registry,ref=ghcr.io/skyfremen/youtube-shorts-runner:latest
          cache-to: type=inline

      - name: Report compressed production image layers
        shell: bash
        env:
          RUNNER_IMAGE: ghcr.io/skyfremen/youtube-shorts-runner:${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          image = os.environ['RUNNER_IMAGE']

          def manifest(reference):
              return json.loads(subprocess.check_output(
                  ['docker', 'buildx', 'imagetools', 'inspect', '--raw', reference],
                  text=True,
              ))

          data = manifest(image)
          if 'layers' not in data:
              candidates = [
                  item for item in data.get('manifests', [])
                  if item.get('platform', {}).get('os') == 'linux'
                  and item.get('platform', {}).get('architecture') == 'amd64'
              ]
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one linux/amd64 manifest, found {len(candidates)}')
              data = manifest(f"{image}@{candidates[0]['digest']}")

          layers = sorted(data.get('layers', []), key=lambda item: item['size'], reverse=True)
          if not layers:
              raise SystemExit('No runtime layers found in published image manifest')
          total = sum(item['size'] for item in layers)
          print(f'compressed_runtime_image_bytes={total}')
          print(f'compressed_runtime_image_mib={total / 1024 / 1024:.2f}')
          for rank, layer in enumerate(layers[:10], 1):
              print(f"layer_{rank}_mib={layer['size'] / 1024 / 1024:.2f} digest={layer['digest']}")
          PY
