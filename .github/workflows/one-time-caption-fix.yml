name: One-time caption safety patch

on:
  push:
    paths:
      - '.github/workflows/one-time-caption-fix.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyfremen/youtube-shorts-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply caption fix
        run: python tools/one_time_caption_fix.py
      - name: Validate caption fix
        run: |
          python -m py_compile youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_layout.py
          python -m unittest discover -s youtube-shorts-bot/tests -p 'test_layout.py' -v
          git diff --check
      - name: Commit caption fix
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-shorts-bot/render.py youtube-shorts-bot/tests/test_layout.py
          git commit -m "fit long caption words without clipping"
          git pull --rebase origin main
          git push origin HEAD:main
