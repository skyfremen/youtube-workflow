name: Trigger Context Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-trigger-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Remove one-shot trigger from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/context-trigger-once.yml
          git commit -m "chore: remove one-shot context trigger"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch context.yml on cleaned current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/context.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "context.yml dispatched on cleaned main"
