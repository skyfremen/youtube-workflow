name: Dry Run

env:
  PYTHONPATH: youtube-shorts-bot

on:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - 'youtube-shorts-bot/Dockerfile'
      - 'youtube-shorts-bot/requirements.txt'
      - 'youtube-shorts-bot/**/*.py'
      - 'youtube-shorts-bot/tests/**'
      - 'youtube-shorts-bot/planning/**'
      - 'youtube-shorts-bot/**/*.md'
      - 'youtube-shorts-bot/analytics/**'
      - 'youtube-shorts-bot/media-library/backgrounds.json'
  workflow_dispatch:

concurrency:
  group: wacky-dramas-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      VIDEO_WIDTH: '720'
      VIDEO_HEIGHT: '1280'
      VIDEO_FPS: '30'
      STORY_TEST_MODE: 'true'
      STORY_RENDER_MAX_SECONDS: '5'
      DRY_RUN_ARTIFACT_DIR: ${{ runner.temp }}/wacky-dramas-dry-run-visual
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lightweight dry-run dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --no-input \
            'numpy>=2.0.2,<2.3' \
            'Pillow>=10,<12'

      - name: Compile production Python
        run: find youtube-shorts-bot -type f -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Verify canonical repository surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected_workflows = {
              'analytics-collection.yml',
              'background-management.yml',
              'build-image.yml',
              'daily-production.yml',
              'dry-run.yml',
          }
          actual_workflows = {path.name for path in Path('.github/workflows').glob('*.yml')}
          assert actual_workflows == expected_workflows, f'unexpected workflow set: {sorted(actual_workflows)}'

          expected_planner_docs = {'DAILY_PLANNER_PROMPT.md', 'STORY_RULES.md'}
          actual_planner_docs = {path.name for path in Path('youtube-shorts-bot/planning').glob('*.md')}
          assert actual_planner_docs == expected_planner_docs, f'unexpected planner docs: {sorted(actual_planner_docs)}'

          retired_roots = [
              Path('youtube-story-bot'),
              Path('youtube-longform-bot'),
              Path('youtube-shorts-bot-backup'),
          ]
          present = [str(path) for path in retired_roots if path.exists()]
          assert not present, 'retired project roots present: ' + ', '.join(present)
          print('Canonical daily-only Wacky Dramas repository surface verified.')
          PY

      - name: Check immutable production history
        if: github.event_name == 'push'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'youtube-shorts-bot')
          from validation.request_guard import check_immutable_changes

          before = os.environ['PREVIOUS_SHA']
          if before and set(before) != {'0'}:
              check_immutable_changes(before, os.environ['GITHUB_SHA'])
          print('Immutable request/result/recovery/planning/background-sourcing history unchanged.')
          PY

      - name: Run unit and contract tests
        run: python -m unittest discover -s youtube-shorts-bot/tests -v

      - name: Run production-equivalence dry run
        run: |
          # Canonical harness: python youtube-shorts-bot/production/dry_run.py
          # The adapter runs the same harness functions once and preserves validated visual outputs.
          python youtube-shorts-bot/production/dry_run_artifact.py

      - name: Validate satisfying-background registry
        run: python youtube-shorts-bot/media/validate_media_library.py

      - name: Run full planning acceptance dry run
        shell: bash
        run: |
          python youtube-shorts-bot/planning/planning_engine.py \
            --acceptance-dry-run --date 2026-09-10 --analytics-video-count 0 \
            --output /tmp/planning-dry-run.json
          python - <<'PY'
          import json

          data = json.load(open('/tmp/planning-dry-run.json'))
          assert data['raw_premises_generated'] >= 120
          assert data['final_selected'] == 24
          assert data['analytics_weight'] == 0
          assert data['exploit_selections'] == 19
          assert data['explore_selections'] == 5
          selected = data['selected']
          assert len({item['publication']['publish_at'] for item in selected}) == len(selected)
          assert all(item['publication']['timezone'] == 'Asia/Singapore' for item in selected)
          assert all(len(item['title_candidates']) >= 5 for item in selected)
          assert all(item['opening_line'] for item in selected)
          print('Planning acceptance: 120+ premises -> 24 valid unique scheduled winners.')
          PY

      - name: Verify renderer production contracts statically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'youtube-shorts-bot')
          from rendering import render
          from rendering import tts_backend
          from common import workflow_common
          from media.background_policy import production_rendition_policy

          assert workflow_common.PRODUCTION_MAX_SECONDS == 178.0
          assert workflow_common.PRODUCTION_TARGET_MIN_SECONDS == 120.0
          assert workflow_common.PRODUCTION_TARGET_MAX_SECONDS == 175.0
          assert workflow_common.START_LEAD_SECONDS == 0.50
          assert workflow_common.END_TAIL_SECONDS == 0.35
          assert workflow_common.expected_video_config() == {'width': 720, 'height': 1280, 'fps': 30}
          assert render.X264_PRESET == 'superfast'
          assert render.X264_CRF == 19
          assert tts_backend.ONNX_BACKEND == 'onnx-fp32'
          policy = production_rendition_policy()
          assert policy['max_source_pixels'] == 1920 * 1080
          assert policy['uhd_downloads_allowed'] is False
          source = Path('youtube-shorts-bot/rendering/render.py').read_text(encoding='utf-8')
          for token in (
              'OnnxKokoroSynthesizer',
              'PytorchKokoroSynthesizer',
              'narration_backend_used',
              'inline_blackdetect_passed',
              '"-map", "3:a:0"',
              'lead_audio = np.zeros',
          ):
              assert token in source
          print('Rendering identity and bounded background policy verified.')
          PY

      - name: Verify workflow safety contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dry = Path('.github/workflows/dry-run.yml').read_text()
          batch = Path('.github/workflows/daily-production.yml').read_text()
          maintenance = Path('.github/workflows/background-management.yml').read_text()
          secret_names = (
              'YOUTUBE_' + 'CLIENT_ID',
              'YOUTUBE_' + 'CLIENT_SECRET',
              'YOUTUBE_' + 'REFRESH_TOKEN',
          )
          for secret in secret_names:
              assert secret not in dry
          assert ('container' + ':') not in dry
          assert 'group: wacky-dramas-youtube-upload' in batch
          assert '[daily production]' in batch
          assert 'schedule:' not in batch.split('jobs:')[0]
          assert 'python youtube-shorts-bot/production/batch.py' in batch
          assert 'python youtube-shorts-bot/production/dry_run.py' in dry
          assert 'ingest-manifest' in batch and 'PEXELS_API_KEY' in batch
          assert batch.index('ingest-manifest') < batch.index('render_aligned.py')
          assert 'branches: [main]' in maintenance
          print('Dry-run isolation, shared batch orchestration, upload serialization and production routing verified.')
          PY

      - name: Confirm zero expensive production side effects
        shell: bash
        run: |
          test ! -f youtube-shorts-bot/output/short.mp4
          test ! -f youtube-shorts-bot/output/narration.wav
          test ! -f youtube-shorts-bot/output/upload_result.json
          test ! -d youtube-shorts-bot/content/planning
          test ! -d youtube-shorts-bot/content/background-sourcing
          echo 'Dry run passed with no TTS, production render, upload, receipt, planning, or sourcing side effects.'

      - name: Upload Dry Run visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-visual-${{ github.run_number }}
          path: ${{ runner.temp }}/wacky-dramas-dry-run-visual/
          if-no-files-found: warn
          retention-days: 7
