name: Dry Run

env:
  PYTHONPATH: youtube-shorts-bot

on:
  push:
    paths:
      - 'README.md'
      - 'docs/private/**'
      - '.github/workflows/**'
      - 'youtube-shorts-bot/**/*.py'
      - 'youtube-shorts-bot/tests/**'
      - 'youtube-shorts-bot/planning/**'
      - 'youtube-shorts-bot/**/*.md'
      - 'youtube-shorts-bot/analytics/**'
      - 'youtube-shorts-bot/media-library/backgrounds.json'
  workflow_dispatch:

concurrency:
  group: wacky-dramas-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIDEO_WIDTH: '1080'
      VIDEO_HEIGHT: '1920'
      VIDEO_FPS: '30'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compile private Python
        run: find youtube-shorts-bot -type f -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Verify canonical repository surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required_workflows = {
              'adhoc-production.yml',
              'analytics-collection.yml',
              'automatic-recovery.yml',
              'background-management.yml',
              'daily-production.yml',
              'dry-run.yml',
          }
          actual_workflows = {path.name for path in Path('.github/workflows').glob('*.yml')}
          missing = required_workflows - actual_workflows
          assert not missing, f'E_ARCH_PRIVATE_SURFACE missing workflows: {sorted(missing)}'
          retired = {'build-image.yml', 'pipeline-validation.yml', 'background-library.yml'}
          restored = retired & actual_workflows
          assert not restored, f'E_ARCH_RETIRED restored workflows: {sorted(restored)}'

          expected_planner_docs = {
              'ADHOC_PLANNER_PROMPT.md',
              'ADHOC_PLANNER_RULES.md',
              'DAILY_PLANNER_PROMPT.md',
              'DAILY_PLANNER_RULES.md',
              'STORY_RULES.md',
          }
          actual_planner_docs = {path.name for path in Path('youtube-shorts-bot/planning').glob('*.md')}
          assert actual_planner_docs == expected_planner_docs, f'unexpected planner docs: {sorted(actual_planner_docs)}'

          retired_roots = [
              Path('youtube-story-bot'),
              Path('youtube-longform-bot'),
              Path('youtube-shorts-bot-backup'),
              Path('youtube-shorts-bot/production'),
              Path('youtube-shorts-bot/rendering'),
              Path('youtube-shorts-bot/assets'),
              Path('youtube-shorts-bot/Dockerfile'),
              Path('youtube-shorts-bot/requirements.txt'),
          ]
          present = [str(path) for path in retired_roots if path.exists()]
          assert not present, 'retired project/build roots present: ' + ', '.join(present)

          expected_publishing = {'__init__.py', 'upload.py'}
          actual_publishing = {
              path.name
              for path in Path('youtube-shorts-bot/publishing').glob('*.py')
          }
          assert actual_publishing == expected_publishing, (
              'unexpected private publishing surface: '
              + ', '.join(sorted(actual_publishing))
          )

          upload_contract = Path(
              'youtube-shorts-bot/publishing/upload.py'
          ).read_text()
          required_contract = (
              'def expected_publication(',
              'def build_upload_body(',
          )
          forbidden_execution = (
              'def make_client(',
              'def authenticated_channel(',
              'def find_existing_by_marker(',
              'def upload_new(',
              'def recover_record(',
              'def authorize_fresh_upload(',
              'def execute_upload(',
              'videos().insert(',
              'YOUTUBE_' + 'REFRESH_TOKEN',
              'youtube.upload',
          )
          for required in required_contract:
              assert required in upload_contract, (
                  f'missing private request-body contract: {required}'
              )
          for forbidden in forbidden_execution:
              assert forbidden not in upload_contract, (
                  f'private execution implementation restored: {forbidden}'
              )
          print('Canonical Wacky Dramas planner/publishing surface verified.')
          PY

      - name: Check immutable production history
        if: github.event_name == 'push'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'youtube-shorts-bot')
          from validation.request_guard import check_immutable_changes

          before = os.environ['PREVIOUS_SHA']
          if before and set(before) != {'0'}:
              check_immutable_changes(before, os.environ['GITHUB_SHA'])
          print('Immutable request/result/recovery/planning/background-sourcing history unchanged.')
          PY

      - name: Run private planning, state, and contract tests
        run: python -m unittest discover -s youtube-shorts-bot/tests -v

      - name: Verify cross-repository contract parity
        shell: bash
        run: |
          set -euo pipefail
          public_sha="$(git ls-remote https://github.com/skyfremen/production-runtime.git refs/heads/main | awk 'NR==1 {print $1}')"
          if [[ ! "${public_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::E_DRY_PUBLIC_SHA Unable to resolve exact public runtime revision"
            exit 1
          fi
          echo "PUBLIC_EXPECTED_SHA=${public_sha}" >> "${GITHUB_ENV}"

          rm -rf /tmp/production-runtime-contract
          git init --quiet /tmp/production-runtime-contract
          git -C /tmp/production-runtime-contract remote add origin https://github.com/skyfremen/production-runtime.git
          git -C /tmp/production-runtime-contract fetch --quiet --depth 1 origin "${public_sha}"
          git -C /tmp/production-runtime-contract checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/production-runtime-contract rev-parse HEAD)" = "${public_sha}"

          private_hash="$(cd youtube-shorts-bot && python -m common.runtime_contract)"
          public_hash="$(cd /tmp/production-runtime-contract && PYTHONPATH=runtime python -m base.compat)"
          if [ "${private_hash}" != "${public_hash}" ]; then
            echo "::error::E_CONTRACT_PARITY Cross-repository execution contract drift detected"
            exit 1
          fi
          test -f /tmp/production-runtime-contract/base/Dockerfile
          test -f /tmp/production-runtime-contract/base/dependencies.txt
          test -f /tmp/production-runtime-contract/.github/workflows/base.yml
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/production-runtime-contract/.github/workflows')
          actual = {path.name for path in root.glob('*.yml')}
          required = {'base.yml', 'dry-run.yml', 'observe.yml', 'run.yml', 'single.yml'}
          missing = required - actual
          if missing:
              raise SystemExit(f'E_ARCH_PUBLIC_SURFACE missing workflows: {sorted(missing)}')
          if 'check.yml' in actual:
              raise SystemExit('E_ARCH_RETIRED public check.yml is still active')

          dry = (root / 'dry-run.yml').read_text(encoding='utf-8')
          observe = (root / 'observe.yml').read_text(encoding='utf-8')
          run = (root / 'run.yml').read_text(encoding='utf-8')
          single = (root / 'single.yml').read_text(encoding='utf-8')
          if 'schedule:' in dry.split('jobs:', 1)[0]:
              raise SystemExit('E_TRIGGER_DRY_RUN dry-run.yml must not be scheduled')
          if "cron: '30 5,11,17,23 * * *'" not in observe:
              raise SystemExit('E_TRIGGER_OBSERVE observation cadence drifted')
          for name, text in (('run.yml', run), ('single.yml', single)):
              trigger = text.split('on:', 1)[1].split('permissions:', 1)[0]
              if 'workflow_dispatch:' not in trigger or 'schedule:' in trigger or '\n  push:' in trigger:
                  raise SystemExit(f'E_TRIGGER_EXEC unsafe trigger in {name}')
          PY
          echo "Cross-repository execution contract parity PASS sha=${public_sha}"

      - name: Validate satisfying-background registry
        run: python youtube-shorts-bot/media/validate_media_library.py

      - name: Run full planning acceptance dry run
        shell: bash
        run: |
          python youtube-shorts-bot/planning/planning_engine.py \
            --acceptance-dry-run --date 2026-09-10 --analytics-video-count 0 \
            --output /tmp/planning-dry-run.json
          python - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'youtube-shorts-bot')
          from planning.planning_config import (
              CANONICAL_TIMEZONE,
              DAILY_PUBLISH_COUNT,
              EXPLORATION_FRACTION,
              RAW_CANDIDATE_COUNT,
              TITLES_PER_SEMIFINALIST,
          )

          data = json.load(open('/tmp/planning-dry-run.json'))
          explore = round(DAILY_PUBLISH_COUNT * EXPLORATION_FRACTION)
          exploit = DAILY_PUBLISH_COUNT - explore
          assert data['raw_premises_generated'] >= RAW_CANDIDATE_COUNT
          assert data['final_selected'] == DAILY_PUBLISH_COUNT
          assert data['analytics_weight'] == 0
          assert data['exploit_selections'] == exploit
          assert data['explore_selections'] == explore
          selected = data['selected']
          assert len({item['publication']['publish_at'] for item in selected}) == len(selected)
          assert all(item['publication']['timezone'] == CANONICAL_TIMEZONE for item in selected)
          assert all(len(item['title_candidates']) >= TITLES_PER_SEMIFINALIST for item in selected)
          assert all(item['opening_line'] for item in selected)
          print('Planning acceptance: 120+ premises -> 24 valid unique scheduled winners.')
          PY

      - name: Verify workflow safety contracts
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          dry = Path('.github/workflows/dry-run.yml').read_text()
          batch = Path('.github/workflows/daily-production.yml').read_text()
          adhoc = Path('.github/workflows/adhoc-production.yml').read_text()
          recovery = Path('.github/workflows/automatic-recovery.yml').read_text()
          maintenance = Path('.github/workflows/background-management.yml').read_text()
          adhoc_prompt = Path('youtube-shorts-bot/planning/ADHOC_PLANNER_PROMPT.md').read_text()
          daily_prompt = Path('youtube-shorts-bot/planning/DAILY_PLANNER_PROMPT.md').read_text()
          secret_names = (
              'YOUTUBE_' + 'CLIENT_ID',
              'YOUTUBE_' + 'CLIENT_SECRET',
              'YOUTUBE_' + 'REFRESH_TOKEN',
          )
          for secret in secret_names:
              assert secret not in dry
              assert secret not in recovery
          secret_refs = set(re.findall(r'secrets\.([A-Z0-9_]+)', dry))
          assert secret_refs == {'PUBLIC_PRODUCTION_TOKEN'}, (
              f'E_SECRET_PRIVATE_DRY_RUN unexpected secret references: {sorted(secret_refs)}'
          )
          assert ('container' + ':') not in dry
          assert ('container' + ':') not in recovery
          assert 'group: private-production-dispatch-' in batch
          assert '[daily production]' in batch
          assert 'schedule:' not in batch.split('jobs:')[0]
          assert 'actions/workflows/run.yml/dispatches' in batch
          assert 'python -m common.runtime_contract' in batch
          assert "'batch_id': os.environ['BATCH_ID']" in batch
          assert "'source_sha': os.environ['SOURCE_SHA']" in batch
          assert "'contract_hash': os.environ['CONTRACT_HASH']" in batch
          assert 'planning.pool_admission daily' in batch
          expected_adhoc_group = 'group: private-adhoc-production-$' + '{{ github.ref }}'
          assert expected_adhoc_group in adhoc
          assert 'actions/workflows/single.yml/dispatches' in adhoc
          assert 'planning.pool_admission adhoc' in adhoc
          assert 'validation/public_dry_run.py' in dry
          assert 'PUBLIC_EXPECTED_SHA=' in dry
          assert 'timeout-minutes: 20' in dry
          assert 'Cross-repository execution contract parity PASS' in dry
          assert 'content/diagnostics/**/*.json' in recovery
          assert "workflows: ['Daily Production', 'Ad-hoc Production']" in recovery
          assert re.search(r"(?m)^\s*-\s+cron:\s+'17,47 \* \* \* \*'\s*$", recovery)
          assert not re.search(r"(?m)^\s*-\s+cron:\s+'17 \*/2 \* \* \*'\s*$", recovery)
          assert 'recovery/controller.py' in recovery
          assert 'RECOVERY_MAX_AUTOMATIC_ATTEMPTS' in recovery
          assert 'actions/workflows/run.yml/dispatches' in recovery
          assert 'PUBLIC_PRODUCTION_TOKEN' in recovery
          for forbidden in ('youtube-shorts-runner', 'media_resolver.py', 'render_aligned.py', 'PEXELS_API_KEY'):
              assert forbidden not in batch
              assert forbidden not in recovery
          assert 'branches: [main]' in maintenance
          assert 'media.pexels_resilient_ingest' in maintenance
          assert 'media.media_readiness audit' in maintenance
          assert 'PEXELS_API_KEY' in maintenance
          assert 'content/background-sourcing/readiness/*.json' in maintenance
          for prompt in (adhoc_prompt, daily_prompt):
              assert 'Git-first exact detached snapshot' in prompt
              assert 'connector/API fallback' in prompt
              assert 'FAIL CLOSED if the exact precommit module cannot execute' in prompt
              assert '--verify-git-head' in prompt
              assert 'GitHub Actions planner execution is prohibited' in prompt
          print('Dry-run isolation, Git-first planner bootstrap with connector fallback, linked public validation, shared media readiness, automatic recovery, and opaque public routing verified.')
          PY

      - name: Confirm zero private execution side effects
        shell: bash
        run: |
          for artifact in \
            youtube-shorts-bot/output/short.mp4 \
            youtube-shorts-bot/output/narration.wav \
            youtube-shorts-bot/output/upload_result.json; do
            if [ -e "${artifact}" ]; then
              echo "::error::E_ARCH_SIDE_EFFECT unexpected artifact"
              exit 1
            fi
          done
          echo 'Private dry run passed with no render or upload side effects.'

      - name: Dispatch and verify public dry run
        shell: bash
        env:
          PUBLIC_PRODUCTION_TOKEN: ${{ secrets.PUBLIC_PRODUCTION_TOKEN }}
          PUBLIC_REPOSITORY: skyfremen/production-runtime
          PUBLIC_DRY_RUN_WORKFLOW: dry-run.yml
        run: |
          set -euo pipefail
          python youtube-shorts-bot/validation/public_dry_run.py
